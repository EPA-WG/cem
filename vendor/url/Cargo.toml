# CEM-maintained fork; upstream manifest is retained in UPSTREAM-Cargo.toml.

[package]
edition = "2018"
rust-version = "1.63"
name = "cem-url"
publish = ["crates-io"]
version = "0.1.0"
authors = ["The rust-url developers", "CEM maintainers"]
build = false
include = [
    "src/**/*",
    "debug_metadata/*",
    "LICENSE-*",
    "README.md",
    "README.upstream.md",
    "UPSTREAM-Cargo.toml",
    "CEM-*.md",
    "CEM-*.patch",
    "CEM-*.txt",
    "RELEASING.md",
    "tests/**",
]
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
description = "CEM-maintained fork of rust-url with scoped WHATWG URL compatibility fixes"
documentation = "https://docs.rs/cem-url"
readme = "README.md"
keywords = [
    "url",
    "parser",
]
categories = [
    "parser-implementations",
    "web-programming",
    "encoding",
    "no-std",
]
license = "MIT OR Apache-2.0"
repository = "https://github.com/EPA-WG/cem"

[package.metadata.cem-upstream]
package = "url"
version = "2.5.8"
repository = "https://github.com/servo/rust-url"
revision = "d6ea13c5f8e7e6e627f6390161b3e185bda5e5ce"
archive-sha256 = "ff67a8a4397373c3ef660812acab3268222035010ab8680ec4215f38ba3d0eed"

[package.metadata.docs.rs]
features = ["serde"]
rustdoc-args = ["--generate-link-to-definition"]

[package.metadata.playground]
features = ["serde"]

[features]
debugger_visualizer = []
default = ["std"]
expose_internals = []
serde = [
    "dep:serde",
    "dep:serde_derive",
]
std = [
    "idna/std",
    "percent-encoding/std",
    "form_urlencoded/std",
    "serde?/std",
]

[lib]
name = "url"
path = "src/lib.rs"

[[test]]
name = "unit"
path = "tests/unit.rs"

[[test]]
name = "url_wpt"
path = "tests/wpt.rs"
harness = false

[dependencies.form_urlencoded]
version = "1.2.2"
features = ["alloc"]
default-features = false

[dependencies.idna]
version = "1.1.0"
features = [
    "alloc",
    "compiled_data",
]
default-features = false

[dependencies.percent-encoding]
version = "2.3.2"
features = ["alloc"]
default-features = false

[dependencies.serde]
version = "1.0"
optional = true
default-features = false

[dependencies.serde_derive]
version = "1.0"
optional = true
default-features = false

[dev-dependencies.bencher]
version = "0.1"

[dev-dependencies.serde]
version = "1.0"

[dev-dependencies.serde_derive]
version = "1.0"

[dev-dependencies.serde_json]
version = "1.0"

[target.'cfg(all(target_arch = "wasm32", target_os = "unknown"))'.dev-dependencies.wasm-bindgen-test]
version = "0.3"

# Keep upstream tests/dev dependencies out of the CEM workspace.
[workspace]
