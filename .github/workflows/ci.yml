name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  CEM_ML_SCHEMA_PARITY_REQUIRED: '1'
  TRANG_NATIVE_REQUIRE_PREBUILT: '1'

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Enable Corepack
        run: corepack enable

      - name: Use Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: yarn

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> dist/target"

      - name: Install wasm-bindgen-cli
        uses: taiki-e/install-action@v2
        with:
          tool: wasm-bindgen-cli@0.2.122

      - name: Install dependencies
        run: yarn install --immutable

      - name: Install xmllint
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libxml2-utils

      - name: Resolve native Trang
        run: yarn nx run @epa-wg/trang-native:build

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Validate UTF-8 encoding
        run: yarn validate:utf8

      - name: Run fitness-function gates
        run: |
          yarn nx run-many -t fitness-removal-scan fitness-semver-presence fitness-gate-map
          yarn nx run cem_ml_cli:validate-fixtures
          yarn nx run cem_ml_cli:e2e

      - name: Derive Nx SHAs
        uses: nrwl/nx-set-shas@v4
        with:
          main-branch-name: main

      - name: Run affected targets
        run: >-
          yarn nx affected -t lint test test:unit build typecheck e2e-ci
          --exclude=cem_ml_cli_native_brew_arm64,cem_ml_cli_native_windows_amd64

  native-macos-arm64:
    name: CEM-ML native macOS ARM64
    # Temporarily local-only. Keep the job recipe available, but build, verify,
    # sign, and publish this executable through its Nx targets on an authorized
    # Apple Silicon host.
    if: ${{ false }}
    runs-on: macos-14
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Enable Corepack
        run: corepack enable

      - name: Use Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: yarn

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: aarch64-apple-darwin

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> dist/target"

      - name: Install dependencies
        run: yarn install --immutable

      - name: Lint native deployment project
        run: yarn nx run cem_ml_cli_native_brew_arm64:lint

      - name: Prove deterministic unsigned package shape
        run: |
          yarn nx run cem_ml_cli_native_brew_arm64:package
          artifact_dir=dist/packages/cem-ml-cli-native-brew-arm64/artifacts
          find "$artifact_dir" -type f -print | sort | while IFS= read -r file; do
            shasum -a 256 "$file"
          done | sed "s|$artifact_dir/||" > "$RUNNER_TEMP/cem-ml-macos-before.sha256"
          yarn nx run cem_ml_cli_native_brew_arm64:package --skipNxCache --excludeTaskDependencies
          find "$artifact_dir" -type f -print | sort | while IFS= read -r file; do
            shasum -a 256 "$file"
          done | sed "s|$artifact_dir/||" > "$RUNNER_TEMP/cem-ml-macos-after.sha256"
          diff -u "$RUNNER_TEMP/cem-ml-macos-before.sha256" "$RUNNER_TEMP/cem-ml-macos-after.sha256"

      - name: Verify native package shape
        run: yarn nx run cem_ml_cli_native_brew_arm64:verify

      - name: Run Homebrew lifecycle smokes
        run: |
          yarn nx run cem_ml_cli_native_brew_arm64:smoke:install
          yarn nx run cem_ml_cli_native_brew_arm64:smoke:upgrade
          yarn nx run cem_ml_cli_native_brew_arm64:smoke:uninstall

  native-windows-amd64:
    name: CEM-ML native Windows AMD64
    # Temporarily local-only. Keep the job recipe available, but build, verify,
    # sign, and publish this executable through its Nx targets on an authorized
    # Windows AMD64 host.
    if: ${{ false }}
    runs-on: windows-2025
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Use Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          package-manager-cache: false

      - name: Enable Corepack
        run: corepack enable

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: x86_64-pc-windows-msvc

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> dist/target"
          cache-on-failure: true

      - name: Install WiX v4
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          if (dotnet tool list --global | Select-String '^wix\s') {
            dotnet tool update --global wix --version 4.0.6
          } else {
            dotnet tool install --global wix --version 4.0.6
          }
          "$env:USERPROFILE\.dotnet\tools" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Ensure WinGet is registered
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          if (-not (Get-Command winget.exe -ErrorAction SilentlyContinue)) {
            Add-AppxPackage -RegisterByFamilyName -MainPackage Microsoft.DesktopAppInstaller_8wekyb3d8bbwe -ErrorAction SilentlyContinue
          }
          if (-not (Get-Command winget.exe -ErrorAction SilentlyContinue)) {
            Install-PackageProvider -Name NuGet -Force -Scope CurrentUser | Out-Null
            Install-Module -Name Microsoft.WinGet.Client -Force -Repository PSGallery -Scope CurrentUser | Out-Null
            Repair-WinGetPackageManager -AllUsers
          }
          winget.exe --version

      - name: Install dependencies
        run: yarn install --immutable

      - name: Lint native deployment project
        run: yarn nx run cem_ml_cli_native_windows_amd64:lint

      - name: Prove deterministic unsigned package shape
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          function Write-ArtifactManifest([string]$Destination) {
            $artifactDir = (Resolve-Path 'dist/packages/cem-ml-cli-native-windows-amd64/artifacts').Path
            Get-ChildItem -LiteralPath $artifactDir -File |
              Sort-Object Name |
              ForEach-Object {
                $hash = (Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
                "$hash  $($_.Name)"
              } | Set-Content -LiteralPath $Destination -Encoding utf8NoBOM
          }
          function Copy-MsiDiagnostic([string]$Destination) {
            $installers = @(Get-ChildItem `
              'dist/packages/cem-ml-cli-native-windows-amd64/artifacts' `
              -Filter '*.msi' `
              -File)
            if ($installers.Count -ne 1) {
              throw "Expected one MSI diagnostic input, found $($installers.Count)"
            }
            Copy-Item -LiteralPath $installers[0].FullName -Destination $Destination
          }
          yarn nx run cem_ml_cli_native_windows_amd64:package
          Write-ArtifactManifest "$env:RUNNER_TEMP\cem-ml-windows-before.sha256"
          Copy-MsiDiagnostic "$env:RUNNER_TEMP\cem-ml-windows-before.msi"
          yarn nx run cem_ml_cli_native_windows_amd64:package --skipNxCache --excludeTaskDependencies
          Write-ArtifactManifest "$env:RUNNER_TEMP\cem-ml-windows-after.sha256"
          Copy-MsiDiagnostic "$env:RUNNER_TEMP\cem-ml-windows-after.msi"
          $difference = Compare-Object `
            (Get-Content "$env:RUNNER_TEMP\cem-ml-windows-before.sha256") `
            (Get-Content "$env:RUNNER_TEMP\cem-ml-windows-after.sha256")
          if ($difference) {
            $difference | Format-Table | Out-String | Write-Error
          }

      - name: Upload determinism diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: cem-ml-native-windows-amd64-determinism-diagnostics
          path: |
            ${{ runner.temp }}/cem-ml-windows-before.msi
            ${{ runner.temp }}/cem-ml-windows-after.msi
          if-no-files-found: ignore
          retention-days: 1

      - name: Verify native package shape
        run: yarn nx run cem_ml_cli_native_windows_amd64:verify

      - name: Run direct MSI install smoke
        timeout-minutes: 10
        run: yarn nx run cem_ml_cli_native_windows_amd64:smoke:install

      - name: Run direct MSI fixture-upgrade smoke
        timeout-minutes: 10
        run: yarn nx run cem_ml_cli_native_windows_amd64:smoke:upgrade

      - name: Run direct MSI uninstall smoke
        timeout-minutes: 10
        run: yarn nx run cem_ml_cli_native_windows_amd64:smoke:uninstall

      - name: Upload MSI lifecycle diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: cem-ml-native-windows-amd64-msi-lifecycle-diagnostics
          path: dist/packages/cem-ml-cli-native-windows-amd64/smoke-*/**/*
          if-no-files-found: warn
          retention-days: 1

      - name: Stage Windows Sandbox inputs
        uses: actions/upload-artifact@v4
        with:
          name: cem-ml-native-windows-amd64-sandbox-inputs
          path: dist/packages/cem-ml-cli-native-windows-amd64/artifacts
          if-no-files-found: error
          retention-days: 1

  native-windows-sandbox:
    name: CEM-ML native Windows Sandbox lifecycle
    # The Windows lifecycle now runs locally through the existing Nx target.
    if: ${{ false }}
    needs: native-windows-amd64
    runs-on: [self-hosted, Windows, X64, windows-11-sandbox-x64]
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Use Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          package-manager-cache: false

      - name: Enable Corepack
        run: corepack enable

      - name: Install WiX v4
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          if (dotnet tool list --global | Select-String '^wix\s') {
            dotnet tool update --global wix --version 4.0.6
          } else {
            dotnet tool install --global wix --version 4.0.6
          }
          "$env:USERPROFILE\.dotnet\tools" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Install dependencies
        run: yarn install --immutable

      - name: Download verified installer inputs
        uses: actions/download-artifact@v4
        with:
          name: cem-ml-native-windows-amd64-sandbox-inputs
          path: dist/packages/cem-ml-cli-native-windows-amd64/artifacts

      - name: Run Windows Sandbox lifecycle smoke
        run: yarn nx run cem_ml_cli_native_windows_amd64:smoke:sandbox --excludeTaskDependencies
