<cem-element xmlns="http://www.w3.org/1999/xhtml" tag="cem-studio-shell">
 <template id="cem-studio-shell" type="text/cem-ml">
{module |
    {slice @name=themeMode | cem-theme-light}
 {slice @name=pageTitle | Examples - CEM Studio}
 {slice @name=heading}
 {slice @name=packageDemandUrl}
 {slice @name=workspaceStatus | ready}
 {attribute @name=class @select='datadom.slices.themeMode ?? "cem-theme-light"'}
 {attribute @name=data-theme @select='datadom.slices.themeMode ?? "cem-theme-light"'}
 {attribute @name=data-cem-studio-shell @select='""'}
 {attribute @name=data-cem-studio-state @select='"ready"'}
 {attribute @name=data-cem-density | super-compact}
 {attribute @name=data-cem-spacing | normal}
 {body |
 {cem:if @test=datadom.slices.packageDemandUrl | {http-request @slice=schemaPackage @url={datadom.slices.packageDemandUrl} @content-type="application/json"}}
 {style @type=text/css |```
:scope { display: block; min-inline-size: 0; color: var(--cem-palette-comfort-text); background-color: var(--cem-palette-comfort); font-family: var(--cem-typography-ui-font-family); }
[part~='root'] { display: grid; grid-template-columns: minmax(0, 1fr); grid-template-rows: auto minmax(0, 1fr) auto; gap: 0; min-inline-size: 0; min-block-size: 100dvb; }
[part~='workspace'], [part~='workspace'] > * { min-inline-size: 0; min-block-size: 0; block-size: 100%; }
[part~='status'] { display: flex; flex-wrap: wrap; gap: var(--cem-coupling-guard-min); justify-content: space-between; padding-block: var(--cem-control-padding-y); padding-inline: var(--cem-control-padding-x); border-block-start: var(--cem-stroke-boundary) solid currentColor; }
@media (min-width: 840px) { [part~='root'] { block-size: 100dvb; } }
@media (forced-colors: active) { :scope { color: CanvasText; background-color: Canvas; } }
```}
 {div @part=root |
  {cem-app-bar @label="CEM Studio" @appearance=compact |
   {h1 @slot=title @part=heading @aria-label={datadom.slices.pageTitle} |
    {cem:choose |
     {cem:when @test=datadom.slices.heading.projectName |
      {cem-text @variant=caption @kind=project @text={datadom.slices.heading.projectName}}{cem:if @test=datadom.slices.heading.path |  · {cem-text @variant=caption @kind={if datadom.slices.heading.pathKind == "output-file" || datadom.slices.heading.pathKind == "output-folder" { "output" } else { if datadom.slices.heading.pathKind == "file" || datadom.slices.heading.pathKind == "configuration" { "resource" } else { "" } }} @text={datadom.slices.heading.path}}} - CEM Studio
     }
     {cem:otherwise | {$ | datadom.slices.pageTitle}}
    }
   }
   {cem-theme-switch @data-cem-studio-theme="" @theme-command=theme @storage-key=cem-studio-theme @value={datadom.slices.themeMode}}
  }
  {div @part=workspace @data-cem-studio-workspace-mount="" | {slot | {cem-studio-workbench-layout}}}
  {footer @part=status @aria-label="Studio status" |
   {span @role=status @aria-live=polite | {$ | if datadom.slices.workspaceStatus == "opening" { "Opening…" } else { if datadom.slices.workspaceStatus == "dirty" { "Unsaved changes retained" } else { if datadom.slices.workspaceStatus == "sample" { "Sample · Clone to edit" } else { if datadom.slices.workspaceStatus == "ready" { "Ready" } else { datadom.slices.workspaceStatus } } } }}}
   {cem-recovery-status
    @state={datadom.slices.recoveryStatus.state ?? "unconfigured"}
    @reason={datadom.slices.recoveryStatus.reason ?? "not-configured"}
    @runtime-count={datadom.slices.recoveryStatus.runtimeCount ?? 0}
    @owner-count={datadom.slices.recoveryStatus.ownerCount ?? 0}
    @acknowledged-count={datadom.slices.recoveryStatus.acknowledgedCount ?? 0}
    @admission-count={datadom.slices.recoveryStatus.admissionCount ?? 0}
    @unknown-operation-count={datadom.slices.recoveryStatus.unknownOperationCount ?? 0}
    @unsupported-owner-count={datadom.slices.recoveryStatus.unsupportedOwnerCount ?? 0}}
  }
 }
 }
}
 </template>
</cem-element>
