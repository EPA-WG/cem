<cem-element xmlns="http://www.w3.org/1999/xhtml" tag="cem-studio-workbench-navigation">
 <template id="cem-studio-workbench-navigation" type="text/cem-ml">
{module |
 {slice @name=state}{slice @name=pending | false}
 {template @name=tree-node |
  {param @name=item}
  {body |
   {cem-tree-item @value={item.key} @label={item.name} |
    {cem:for-each @as=child @select=item.children | {call @template=tree-node @with:item={child}}}
   }
  }
 }
 {body |
 {style @type=text/css |```
:scope { display: block; min-inline-size: 0; }
[part~='navigation'] { display: grid; gap: var(--cem-gap-related); }
[part~='actions'] { display: flex; flex-wrap: wrap; align-items: center; gap: max(var(--cem-gap-related), var(--cem-coupling-guard-min)); }
```}
 {cem:if @test=datadom.slices.state |
  {cem:variable @name=state @select=datadom.slices.state}
  {cem:variable @name=nav @select=state.navigation}
  {cem:variable @name=busy @select='datadom.slices.pending || nav.busy'}
  {nav @part=navigation @aria-label="Studio navigation" |
   {cem:if @test=nav |
   {div @part=actions @role=group @aria-label="Selection actions" |
    {cem-icon-button @image="+" @aria-label="Create" @variant=contextual @host-command=create-selected @disabled={if busy { true } else { null }}}
    {cem-icon-button @image="▣" @aria-label="Clone selected" @variant=contextual @host-command=clone-selected @disabled={if busy || !nav.canClone { true } else { null }}}
    {cem-icon-button @image="×" @aria-label="Delete selected" @variant=contextual @host-command=delete-selected @disabled={if busy || !nav.canDelete { true } else { null }}}
    {span @aria-live=polite | {$ | str:concat((nav.count, " ", nav.countKind, if nav.count == 1 { "" } else { "s" }), "")}}
   }
   {cem:for-each @as=root @select='(nav.samples, nav.saved, nav.files)' |
    {cem:if @test=root |
     {cem-tree @label={root.name} @selection=single @activate-branches=true @selected-values={nav.selection.key} @expanded-values={str:concat((root.key, nav.expanded), " ")} @host-command=open-entity @host-command-event=cem-tree-activate |
      {call @template=tree-node @with:item={root}}
     }
    }
   }
   }
   {cem:if @test='state.navigationError &amp;&amp; (nav.selection.project || !str:starts_with(state.navigationError.code, "cem.studio.selection."))' | {cem-alert @tone=danger @label={state.navigationError.message}}}
        {cem:if @test=state.transition |
            {cem-dialog @label="Resolve drafts before navigation" @mode=modal @default-open=true
                @closedby=closerequest @host-command=navigation-cancel @host-command-event=cem-close |
                {cem-text | {$ | if state.transition.stage == "source" { "Save or discard the source draft before leaving." } else { if state.transition.stage == "command" { "Apply or discard the command draft before leaving." } else { if state.transition.stage == "confirmation" { "Applying this command replaces the selected configuration. Confirm replacement or keep the draft." } else { "Opening the requested workbench…" } } } }}
                {cem:if @test=state.transition.error | {cem-alert @tone=danger @label={state.transition.error.message}}}
                {cem-stack |
                    {cem:if @test='state.transition.stage == "source"' |
                        {cem-action @host-command=navigation-save @variant=primary @disabled={if busy { true } else { null }} | Save source}
                    }
                    {cem:if @test='state.transition.stage == "command"' |
                        {cem-action @host-command=navigation-apply @variant=primary @disabled={if busy { true } else { null }} | Apply command}
                    }
                    {cem:if @test='state.transition.stage == "confirmation"' |
                        {cem-action @host-command=navigation-confirm @variant=destructive @disabled={if busy { true } else { null }} | Replace configuration}
                    }
                    {cem:if @test='(state.transition.stage == "source") || (state.transition.stage == "command") || (state.transition.stage == "confirmation")' |
                        {cem-action @host-command=navigation-discard @variant=destructive @disabled={if busy { true } else { null }} | Discard draft}
                    }
                    {cem:if @test='state.transition.error &amp;&amp; (state.transition.stage == "opening")' |
                        {cem-action @host-command=navigation-retry @variant=primary | Retry navigation}
                    }
                    {cem-action @host-command=navigation-cancel @variant=contextual | Cancel navigation}
                }
            }
        }

  }
 }
 }
}
 </template>
</cem-element>
