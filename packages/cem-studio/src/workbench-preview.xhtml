<cem-element xmlns="http://www.w3.org/1999/xhtml" tag="cem-studio-workbench-preview">
 <template id="cem-studio-workbench-preview" type="text/cem-ml">
{module |
 {attribute @name=section | all}
 {slice @name=state}

 {body |
{style @type=text/css |```
:scope { display: block; block-size: 100%; min-block-size: 0; }
[part~='root'] { display: grid; grid-template-rows: minmax(0, 1fr); gap: var(--cem-gap-related); block-size: 100%; min-block-size: 0; overflow-wrap: anywhere; }
[part~='root']:where([data-project][data-section='all']) { grid-template-rows: minmax(0, auto) minmax(20vb, 1fr); }
[part~='build-content'] { display: grid; gap: var(--cem-layout-stack-gap); min-inline-size: 0; }
[part~='build-controls'] { min-block-size: 0; overflow: auto; }
[part~='preview'] { display: flex; flex-direction: column; gap: var(--cem-gap-related); block-size: 100%; min-block-size: 0; overflow: auto; }
[part~='preview'] > cem-media-preview { flex: 1 1 auto; min-block-size: 0; }
[part~='preview'] > cem-data-view { display: block; }
[part~='related'] { margin-block: var(--cem-control-padding-y); }
```}
  {cem:variable @name=projection @select=datadom.slices.state.projection}
  {cem:variable @name=preview @select=projection.preview}
  {cem:variable @name=project @select=datadom.slices.state.projectPreview}
  {cem:variable @name=source @select=datadom.slices.state.sourcePreview}
  {cem:variable @name=previewStatus @select='project.attempt.status ?? "idle"'}
  {div @part=root @data-project={if project { "" } else { null }} @data-section={section} |
  {cem:if @test='project &amp;&amp; section != "preview"' |
   {div @part=build-controls |
   {div @part=build-content |
    {cem:if @test=project.projectId |
     {cem-select @label="Build configuration" @value={project.configurationId ?? ""} @disabled={if project.busy { true } else { null }} @host-command=select-build @host-command-event=change |
      {option @value="" | Choose build configuration}
      {cem:for-each @as=configuration @select=project.configurations |
       {option @value={configuration.id} | {$ | if configuration.kind == "document-html" { str:concat(("HTML · ", configuration.name), "") } else { configuration.name }}}
     }}
     {cem-expansion @label="Pinned builds" |
      {cem-stack @gap=sm |
       {p | Save successful artifact bytes and build metadata for offline reopening. Pins are separate from editable project sources.}
       {cem-select @label="Preview build" @value={project.pinSelection ?? ""} @disabled={if project.pinBusy || project.busy { true } else { null }} @host-command=select-pinned-build @host-command-event=change |
        {option @value="" | Current build}
        {cem:for-each @as=pin @select=project.pins | {option @value={pin.key} | {$ | pin.name}}}
       }
       {cem-grid @columns=2 @gap=sm |
        {cem-action @variant=contextual @host-command=pin-build @host-command-event=click @disabled={if !project.canPin { true } else { null }} | Pin successful build}
        {cem-action @variant=contextual @host-command=delete-pinned-build @host-command-event=click @disabled={if !project.pinSelection || project.pinBusy { true } else { null }} | Delete pinned build}
       }
       {p | Up to 8 pins and 64 MiB in this browser. Delete pins to free space. Pins are not included in portable source project exports.}
       {cem:if @test=project.pinBusy | {p @role=status | Opening or saving pinned build…}}
       {cem:if @test=project.pinError | {cem-alert @label={project.pinError.message} @tone=danger}}
       {cem:if @test=project.pinMessage | {cem-alert @label={project.pinMessage} @tone=info}}
       {cem:if @test=project.comparison |
        {cem:variable @name=comparison @select=project.comparison}
        {cem-expansion @label="Compare pin with current build" |
         {cem-stack @gap=sm |
          {p | Pin → current build. Compares captured successful runs; unsaved edits and failed attempts are excluded. Source locations describe native provenance, not a claim about what caused a change.}
          {p | {$ | str:concat(("Pinned run ", comparison.baselineRunId, " · project revision ", comparison.baselineProjectRevision, " → current run ", comparison.currentRunId, " · project revision ", comparison.currentProjectRevision), "")}}
          {p @role=status | {$ | str:concat((comparison.counts.added, " added · ", comparison.counts.removed, " removed · ", comparison.counts.changed, " changed · ", comparison.counts.unchanged, " unchanged artifacts"), "")}}
          {cem-expansion @label="Captured configuration and engine versions" |
           {p | {$ | str:concat(("Configuration changed: ", comparison.configurationChanged, " · engine identity changed: ", comparison.executionIdentityChanged), "")}}
           {p | Pinned configuration: {code | {$ | comparison.baselineConfiguration}}}
           {p | Current configuration: {code | {$ | comparison.currentConfiguration}}}
           {p | Pinned engine: {code | {$ | comparison.baselineExecutionIdentity}}}
           {p | Current engine: {code | {$ | comparison.currentExecutionIdentity}}}
          }
          {cem-expansion @label="Compare input versions" |
           {ul @aria-label="Input version comparison" |
            {cem:for-each @as=input @select=comparison.inputs |
             {li | {$ | str:concat((input.status, " · ", input.resourceId), "")}
              {p | Pinned: {code | {$ | input.before}}}
              {p | Current: {code | {$ | input.after}}}
             }
            }
           }
          }
          {ul @aria-label="Artifact comparison" |
           {cem:for-each @as=artifact @select=comparison.artifacts | {li | {$ | str:concat((artifact.status, " · ", artifact.path), "")}}}
          }
          {cem-select @label="Compare artifact" @value={comparison.selectedArtifact.path} @host-command=select-comparison-artifact @host-command-event=change |
           {cem:for-each @as=artifact @select=comparison.artifacts | {option @value={artifact.path} | {$ | artifact.path}}}
          }
          {cem:variable @name=artifact @select=comparison.selectedArtifact}
          {p | {$ | str:concat((artifact.status, " · ", artifact.path, " · bytes changed: ", artifact.bytesChanged, " · media/length changed: ", artifact.metadataChanged, " · native provenance changed: ", artifact.provenanceChanged), "")}}
          {cem:choose |
           {cem:when @test=artifact.before | {p | Pinned: {$ | str:concat((artifact.before.contentType, " · ", artifact.before.byteLength, " bytes · SHA-256 ", artifact.before.sha256), "")}}}
           {cem:otherwise | {p | Pinned: absent}}
          }
          {cem:choose |
           {cem:when @test=artifact.after | {p | Current: {$ | str:concat((artifact.after.contentType, " · ", artifact.after.byteLength, " bytes · SHA-256 ", artifact.after.sha256), "")}}}
           {cem:otherwise | {p | Current: absent}}
          }
          {p | Pinned native source locations}
          {ul @aria-label="Pinned native provenance" |
           {cem:for-each @as=frame @select=artifact.before.provenance | {li | {$ | str:concat((frame.uri, " · ", frame.transform, " · source bytes ", frame.range, " · output bytes ", frame.outputRange), "")}}}
          }
          {p | Current native source locations}
          {ul @aria-label="Current native provenance" |
           {cem:for-each @as=frame @select=artifact.after.provenance | {li | {$ | str:concat((frame.uri, " · ", frame.transform, " · source bytes ", frame.range, " · output bytes ", frame.outputRange), "")}}}
          }
          {p | Empty source-location lists mean no native source frames were captured. Historical source bytes are not stored in pins.}
         }
        }
       }
       {cem:if @test='project.pinId &amp;&amp; !project.comparison' | {p | Build a current run of this project, then select the pin again to compare captured artifacts and provenance.}}
       {cem:if @test=project.pinId |
        {cem-expansion @label="Pinned build metadata" |
         {cem-stack @gap=sm |
          {p | {$ | str:concat((project.pinnedConfiguration.name, " · configuration revision ", project.pinnedConfiguration.revision, " · SHA-256 ", project.pinnedConfiguration.sha256), "")}}
          {ul @aria-label="Pinned input versions" | {cem:for-each @as=input @select=project.pinnedInputs | {li | {$ | str:concat((input.path, " · revision ", input.revision, " · ", input.sha256), "")}}}}
          {ul @aria-label="Pinned artifact digests" | {cem:for-each @as=artifact @select=project.pinnedArtifacts | {li | {$ | str:concat((artifact.path, " · ", artifact.byteLength, " bytes · ", artifact.sha256), "")}}}}
         }
        }
       }
      }
     }
     {cem:if @test=project.entryEditable |
      {cem-expansion @label="Build entry settings" |
      {form @host-command=save-build-entry @host-command-event=submit |
       {cem-stack @gap=sm |
        {cem-text-field @label="Build entry artifact" @name=entryArtifact @value={project.entryArtifact ?? ""} @placeholder="generated/index.html" @disabled={if !project.canEditEntry { true } else { null }} | {span @slot=help | Project-relative output path. Leave empty for automatic selection. Explicit URL and artifact selections take precedence.}}
        {cem-action @type=submit @variant=contextual @disabled={if !project.canEditEntry { true } else { null }} | Save build entry}
       }
      }
      }
     }
     {cem:if @test=project.entryError | {cem-alert @label={project.entryError.message} @tone=danger}}
     {cem:if @test=project.entryMessage | {cem-alert @label={project.entryMessage} @tone=info}}
     {cem-grid @columns=2 @gap=sm |
      {cem-action @host-command=build-project @host-command-event=click @variant=primary @disabled={if !project.available || project.busy { true } else { null }} | Build project}
      {cem-action @host-command=cancel-build @host-command-event=click @variant=contextual @disabled={if !project.busy { true } else { null }} | Cancel build}
     }
     {cem:if @test='!project.available' | {cem-alert @tone=warning @label="Choose an available build configuration, or add a CEM-ML document or native command configuration."}}
    }
    {cem:variable @name=status @select='project.attempt.status ?? "idle"'}
    {cem:variable @name=message @select='if project.busy { "Building saved project revisions…" } else { if status == "failed" { if project.hasRun { "Build failed. Showing the last successful run." } else { "Build failed. No successful preview is available." } } else { if status == "cancelled" { if project.hasRun { "Build cancelled. Showing the last successful run." } else { "Build cancelled." } } else { if status == "stale" { "Build completed with stale inputs; the previous successful run is retained." } else { if project.stale { "Preview is stale. Build again to use the latest saved revisions; unsaved edits are not built." } else { if project.hasRun { "Preview uses the captured saved revisions." } else { "Build a project configuration to preview its output." } } } } } }'}
    {cem:if @test=project.projectId | {cem-alert @label={if project.pinId { "Viewing an immutable pinned build. Current build and source selection are retained. Build project returns to the current build." } else { message }} @tone={if project.pinId { "info" } else { if status == "failed" { "danger" } else { if project.stale || status == "cancelled" || status == "stale" { "warning" } else { "info" } } }}}}
    {cem:if @test=project.runId | {p | {$ | str:concat(("Run ", project.runId, " · saved project revision ", project.projectRevision), "")}}}
    {cem:if @test=project.attempt.error | {cem-alert @label={project.attempt.error.message} @tone=danger}}
    {cem:if @test='seq:count(project.attempt.diagnostics.code) &gt; 0' |
     {ul @aria-label="Build diagnostics" | {cem:for-each @as=diagnostic @select=project.attempt.diagnostics | {li | {$ | str:concat((diagnostic.code, ": ", diagnostic.message), "")}}}}
    }
    {cem:if @test=project.hasRun |
     {cem-select @label="Preview artifact" @value={project.artifactPath ?? ""} @disabled={if project.busy { true } else { null }} @host-command=select-preview-artifact @host-command-event=change |
      {option @value="" | Choose output artifact}
      {cem:for-each @as=artifact @select=project.artifacts | {option @value={artifact.path} | {$ | artifact.path}}}
     }
     {cem-grid @columns=2 @gap=sm |
      {cem-action @host-command=copy-preview @host-command-event=click @variant=alternate @disabled={if project.busy || !project.copyable { true } else { null }} | Copy preview output}
      {cem-action @host-command=download-preview @host-command-event=click @variant=contextual @disabled={if project.busy || !project.selected { true } else { null }} | Download preview output}
     }
     {cem:if @test=project.transfer.message | {cem-alert @label={project.transfer.message} @tone={if project.transfer.status == "failed" { "danger" } else { "info" }}}}
    }
   }
   }
  }
  {cem:if @test='section != "build"' |
  {section @part=preview @aria-label={preview.label ?? "Result preview"} @data-cem-studio-preview="" @data-cem-studio-preview-kind={preview.kind ?? null} |
   {cem:if @test=project.busy | {p @role=status | Building saved project revisions…}}
   {cem:if @test='project.hasRun &amp;&amp; (project.stale || previewStatus == "failed" || previewStatus == "cancelled" || previewStatus == "stale")' |
    {cem-alert @tone={if previewStatus == "failed" { "danger" } else { "warning" }} @label={if previewStatus == "failed" { "Build failed. Showing output from the last successful saved build." } else { if previewStatus == "cancelled" { "Build cancelled. Showing output from the last successful saved build." } else { "Showing output from the last successful saved build. Build again to refresh it." } }}}
   }
   {cem:if @test='source.draft' | {p @role=status | Preview includes unsaved source changes. Generated build artifacts use saved revisions.}}
   {cem:if @test=source.stale | {cem-alert @tone=warning @label={source.error.message ?? "Source preview is stale while native conversion is pending."}}}
   {cem:if @test='seq:count(project.relatedArtifacts.path) &gt; 1' |
    {cem-select @part=related @label="Related generated output" @value={project.artifactPath ?? ""} @host-command=select-preview-artifact @host-command-event=change |
     {option @value="" | Choose related output}
     {cem:for-each @as=artifact @select=project.relatedArtifacts | {option @value={artifact.path} | {$ | artifact.path}}}
    }
   }
   {cem:choose |
    {cem:when @test='datadom.slices.state.dataPreview' |
     {cem:choose |
      {cem:when @test=datadom.slices.state.dataPreview.tooLarge | {cem-alert @tone=warning @label="Data exceeds the bounded table preview limit. Open the source or download the exact artifact."}}
      {cem:otherwise | {cem-data-view @data-cem-density=super-compact @format={datadom.slices.state.dataPreview.format} @value={datadom.slices.state.dataPreview.text} @label={datadom.slices.state.dataPreview.label}}}
     }
    }
    {cem:when @test='projection.output.available == false' |
     {cem-alert @label="No output was published. See the command diagnostics below." @tone=warning}
    }
    {cem:when @test=preview |
     {cem:variable @name=mode @select='if preview.kind == "artifact-tree" { "artifact-tree" } else { if preview.kind == "text" { "text" } else { if preview.kind == "sandboxed-html" { "document" } else { if preview.kind == "live-cem" { "live" } else { "message" } } } }'}
     {cem:variable @name=value @select='if preview.kind == "text" { preview.text } else { if preview.kind == "sandboxed-html" || preview.kind == "live-cem" { preview.source } else { preview.reason } }'}
     {cem-media-preview @fit=fill @source-uri={preview.sourceUri} @artifact-path={preview.artifactPath} @resource-set={preview.resourceSet} @label={preview.label} @mode={mode} @truncated={if preview.truncated { true } else { null }} @value={value} @host-command={if preview.sourceNavigation { "open-source-link" } else { "select-preview-artifact" }} @host-command-event=cem-preview-navigate}
    }
    {cem:when @test='source.status == "pending"' | {p @role=status | Preparing native source preview…}}
    {cem:when @test=source.error | {cem-alert @tone=warning @label={source.error.message}}}
    {cem:otherwise |
     {cem-alert @label={if project { if !project.projectId { "Select a project to build its preview." } else { if project.missingArtifact { str:concat(("The requested artifact is unavailable in this run: ", project.artifactPath, ". Choose another artifact."), "") } else { if project.hasRun { project.missingReason ?? "Choose an output artifact to preview." } else { project.missingReason ?? "Build saved revisions to preview project output." } } } } else { "Run an operation to preview its bounded result" }} @tone={if project.missingArtifact { "warning" } else { "info" }}}
    }
   }
  }
  }
  }
 }
}
 </template>
</cem-element>
