[package]
name = "cem-ml-transform-cem-ql"
version = "0.1.0"
authors = ["Sasha Firsov <sasha@firsov.net>"]
edition = "2021"
description = "CEM-ML transform template adapter backed by CEM-QL rendering"
license = "MIT"
publish = true

[lib]
name = "cem_ml_transform_cem_ql"
crate-type = ["rlib"]

[features]
default = ["debug-control"]
debug-control = ["cem-ml/debug-control", "cem-ql/debug-control"]

[dependencies]
blake3 = "1"
cem-ml = { path = "../cem_ml", default-features = false }
cem-ql = { path = "../cem_ql", default-features = false }
serde_json = "1"
