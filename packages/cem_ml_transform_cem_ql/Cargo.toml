[package]
name = "cem-ml-transform-cem-ql"
version = "0.1.0"
authors = ["Sasha Firsov <sasha@firsov.net>"]
edition = "2021"
description = "CEM-ML transform template adapter backed by CEM-QL rendering"
license = "MIT"
publish = true

[lib]
name = "cem_ml_transform_cem_ql"
crate-type = ["rlib", "cdylib"]

[features]
default = ["debug-control"]
debug-control = ["cem-ml/debug-control", "cem-ql/debug-control"]
schema-asset-packs = ["cem-ml/schema-asset-packs"]

[dependencies]
blake3 = "1"
cem-ml = { version = "=0.1.0", path = "../cem_ml", default-features = false }
cem-ql = { version = "=0.1.0", path = "../cem_ql", default-features = false }
serde_json = "1"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
