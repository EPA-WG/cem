<svg xmlns="http://www.w3.org/2000/svg" width="760" height="190" viewBox="0 0 760 190" role="img" aria-labelledby="title desc">
  <title id="title">CEM-QL tabular formatter HTML preview</title>
  <desc id="desc">Rendered preview of HTML color output for the basic CEM-QL query example.</desc>
  <rect width="760" height="190" rx="8" fill="#101316"/>
  <rect x="0" y="0" width="760" height="36" rx="8" fill="#1b2127"/>
  <circle cx="20" cy="18" r="5" fill="#ff5f56"/>
  <circle cx="38" cy="18" r="5" fill="#ffbd2e"/>
  <circle cx="56" cy="18" r="5" fill="#27c93f"/>
  <text x="78" y="23" fill="#c9d1d9" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13">tabular + HTML color</text>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" xml:space="preserve">
    <text y="70">
      <tspan x="28" fill="#7a4cc2" font-weight="600">module</tspan><tspan x="94" fill="#d6dee6"> </tspan><tspan x="105" fill="#067647">&quot;https://example.test/queries/basic&quot;</tspan>
    </text>
    <text y="98">
      <tspan x="28" fill="#7a4cc2" font-weight="600">declare</tspan><tspan x="105" fill="#d6dee6"> </tspan><tspan x="116" fill="#7a4cc2" font-weight="600">let</tspan><tspan x="149" fill="#d6dee6"> </tspan><tspan x="160" fill="#087990">greeting</tspan><tspan x="248" fill="#d6dee6"> </tspan><tspan x="259" fill="#667085">=</tspan><tspan x="270" fill="#d6dee6"> </tspan><tspan x="281" fill="#067647">&quot;Hello&quot;</tspan>
    </text>
    <text y="126">
      <tspan x="28" fill="#087990">greeting</tspan>
    </text>
  </g>
</svg>
