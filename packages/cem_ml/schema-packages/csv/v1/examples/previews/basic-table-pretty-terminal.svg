<svg xmlns="http://www.w3.org/2000/svg" width="520" height="160" viewBox="0 0 520 160" role="img" aria-labelledby="title desc">
  <title id="title">CSV pretty formatter terminal preview</title>
  <desc id="desc">Terminal-style preview of colored pretty CSV output with tab-based near alignment.</desc>
  <rect width="520" height="160" rx="8" fill="#101316"/>
  <rect x="0" y="0" width="520" height="36" rx="8" fill="#1b2127"/>
  <circle cx="20" cy="18" r="5" fill="#ff5f56"/>
  <circle cx="38" cy="18" r="5" fill="#ffbd2e"/>
  <circle cx="56" cy="18" r="5" fill="#27c93f"/>
  <text x="78" y="23" fill="#c9d1d9" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13">pretty + terminal color</text>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" xml:space="preserve">
    <text y="70">
      <tspan x="28" fill="#5fafff">id</tspan><tspan x="105" fill="#8b949e">,</tspan><tspan x="116" fill="#5fd75f">name</tspan><tspan x="182" fill="#8b949e">,</tspan><tspan x="193" fill="#ff8700">active</tspan>
    </text>
    <text y="98">
      <tspan x="28" fill="#5fafff"> 1</tspan><tspan x="105" fill="#8b949e">,</tspan><tspan x="116" fill="#5fd75f">Ada </tspan><tspan x="182" fill="#8b949e">,</tspan><tspan x="193" fill="#ff8700">true  </tspan>
    </text>
    <text y="126">
      <tspan x="28" fill="#5fafff"> 2</tspan><tspan x="105" fill="#8b949e">,</tspan><tspan x="116" fill="#5fd75f">Lin </tspan><tspan x="182" fill="#8b949e">,</tspan><tspan x="193" fill="#ff8700">false </tspan>
    </text>
  </g>
</svg>
