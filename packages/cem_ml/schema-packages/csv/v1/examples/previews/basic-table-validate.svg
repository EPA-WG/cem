    <tspan x="24" dy="19">    "warningCount": 0,</tspan>
    <tspan x="24" dy="19">    "errorCount": 0,</tspan>
    <tspan x="24" dy="19">    "fatalCount": 0,</tspan>
    <tspan x="24" dy="19">    "hardViolationCount": 0</tspan>
    <tspan x="24" dy="19">  },</tspan>
    <tspan x="24" dy="19">  "options": {</tspan>
    <tspan x="24" dy="19">    "failLevel": "validate",</tspan>
    <tspan x="24" dy="19">    "schema": "https://cem.dev/ns/data/csv/1",</tspan>
    <tspan x="24" dy="19">    "contentType": "text/csv",</tspan>
