  <circle cx="20" cy="18" r="5" fill="#ff5f56"/>
  <circle cx="38" cy="18" r="5" fill="#ffbd2e"/>
  <circle cx="56" cy="18" r="5" fill="#27c93f"/>
  <text x="78" y="23" fill="#c9d1d9" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13">validate basic-table.csv</text>
  <text x="24" y="64" fill="#d6dee6" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" xml:space="preserve">
    <tspan x="24" dy="0">{</tspan>
    <tspan x="24" dy="19">  "generatedAt": "1970-01-01T00:00:00.000Z",</tspan>
    <tspan x="24" dy="19">  "inputs": [</tspan>
