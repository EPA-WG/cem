<svg xmlns="http://www.w3.org/2000/svg" width="920" height="601" viewBox="0 0 920 601" role="img" aria-labelledby="title desc">
  <title id="title">CEM events JSON validation command preview</title>
  <desc id="desc">Terminal-style preview of the JSON validation report for the basic CEM events JSON debug view example.</desc>
