    <tspan x="24" dy="19">      &quot;eventCount&quot;: 0,</tspan>
    <tspan x="24" dy="19">      &quot;events&quot;: []</tspan>
    <tspan x="24" dy="19">    }</tspan>
    <tspan x="24" dy="19">  }</tspan>
    <tspan x="24" dy="19">}</tspan>
