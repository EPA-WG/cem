  <rect x="0" y="0" width="920" height="36" rx="8" fill="#1b2127"/>
  <circle cx="20" cy="18" r="5" fill="#ff5f56"/>
  <circle cx="38" cy="18" r="5" fill="#ffbd2e"/>
  <circle cx="56" cy="18" r="5" fill="#27c93f"/>
  <text x="78" y="23" fill="#c9d1d9" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13">validate basic-events.events.json</text>
  <text x="24" y="64" fill="#d6dee6" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" xml:space="preserve">
    <tspan x="24" dy="0">{</tspan>
    <tspan x="24" dy="19">  &quot;generatedAt&quot;: &quot;1970-01-01T00:00:00.000Z&quot;,</tspan>
    <tspan x="24" dy="19">  &quot;inputs&quot;: [</tspan>
    <tspan x="24" dy="19">    &quot;packages/cem_ml/schema-packages/cem-events-projection/v1/examples/basic-events.events.json&quot;</tspan>
    <tspan x="24" dy="19">  ],</tspan>
    <tspan x="24" dy="19">  &quot;summary&quot;: {</tspan>
    <tspan x="24" dy="19">    &quot;inputCount&quot;: 1,</tspan>
    <tspan x="24" dy="19">    &quot;infoCount&quot;: 0,</tspan>
    <tspan x="24" dy="19">    &quot;warningCount&quot;: 0,</tspan>
    <tspan x="24" dy="19">    &quot;errorCount&quot;: 0,</tspan>
    <tspan x="24" dy="19">    &quot;fatalCount&quot;: 0,</tspan>
    <tspan x="24" dy="19">    &quot;hardViolationCount&quot;: 0</tspan>
    <tspan x="24" dy="19">  },</tspan>
    <tspan x="24" dy="19">  &quot;options&quot;: {</tspan>
    <tspan x="24" dy="19">    &quot;failLevel&quot;: &quot;validate&quot;,</tspan>
    <tspan x="24" dy="19">    &quot;schema&quot;: &quot;https://cem.dev/ns/projection/events/1&quot;,</tspan>
    <tspan x="24" dy="19">    &quot;contentType&quot;: &quot;application/vnd.cem.events+json&quot;,</tspan>
    <tspan x="24" dy="19">    &quot;baseUri&quot;: null</tspan>
