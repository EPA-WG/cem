<svg xmlns="http://www.w3.org/2000/svg" width="760" height="342" viewBox="0 0 760 342" role="img" aria-labelledby="title desc">
  <title id="title">CEM transform pretty formatter terminal preview</title>
  <desc id="desc">Terminal-style preview of colored pretty CEM transform output for the basic transform example.</desc>
  <rect width="760" height="342" rx="8" fill="#101316"/>
  <rect x="0" y="0" width="760" height="36" rx="8" fill="#1b2127"/>
  <circle cx="20" cy="18" r="5" fill="#ff5f56"/>
  <circle cx="38" cy="18" r="5" fill="#ffbd2e"/>
  <circle cx="56" cy="18" r="5" fill="#27c93f"/>
  <text x="78" y="23" fill="#c9d1d9" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13">pretty + terminal color</text>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" xml:space="preserve">
    <text y="70">
      <tspan x="28" fill="#79c0ff">@</tspan><tspan x="39" fill="#79c0ff">doc</tspan><tspan x="72" fill="#d6dee6"> </tspan><tspan x="83" fill="#79c0ff">cem-ml 1</tspan>
    </text>
    <text y="98">
      <tspan x="28" fill="#79c0ff">@</tspan><tspan x="39" fill="#79c0ff">ns</tspan><tspan x="61" fill="#d6dee6"> </tspan><tspan x="72" fill="#79c0ff">transform = &quot;https://cem.dev/ns/transform/cem/1&quot;</tspan>
    </text>
    <text y="126">
      <tspan x="28" fill="#79c0ff">@</tspan><tspan x="39" fill="#79c0ff">default</tspan><tspan x="116" fill="#d6dee6"> </tspan><tspan x="127" fill="#79c0ff">transform</tspan>
    </text>
    <text y="154">
      <tspan x="28" fill="#79c0ff">{</tspan><tspan x="39" fill="#79c0ff">module</tspan><tspan x="105" fill="#d6dee6"> |</tspan>
    </text>
    <text y="182">
      <tspan x="28" fill="#c9d1d9">    </tspan><tspan x="72" fill="#79c0ff">{</tspan><tspan x="83" fill="#79c0ff">template</tspan><tspan x="171" fill="#d6dee6"> </tspan><tspan x="182" fill="#79c0ff">@name=main</tspan><tspan x="292" fill="#d6dee6"> |</tspan>
    </text>
    <text y="210">
      <tspan x="28" fill="#c9d1d9">        </tspan><tspan x="116" fill="#79c0ff">{</tspan><tspan x="127" fill="#79c0ff">body</tspan><tspan x="171" fill="#d6dee6"> |</tspan>
    </text>
    <text y="238">
      <tspan x="28" fill="#c9d1d9">            </tspan><tspan x="160" fill="#7ee787">Converted output.</tspan>
    </text>
    <text y="266">
      <tspan x="28" fill="#d6dee6">        </tspan><tspan x="116" fill="#79c0ff">}</tspan>
    </text>
    <text y="294">
      <tspan x="28" fill="#d6dee6">    </tspan><tspan x="72" fill="#79c0ff">}</tspan>
    </text>
    <text y="322">
      <tspan x="28" fill="#79c0ff">}</tspan>
    </text>
  </g>
</svg>
