<svg xmlns="http://www.w3.org/2000/svg" width="760" height="342" viewBox="0 0 760 342" role="img" aria-labelledby="title desc">
  <title id="title">CEM-native template pretty formatter terminal preview</title>
  <desc id="desc">Terminal-style preview of colored pretty CEM-native template output for the basic template example.</desc>
  <rect width="760" height="342" rx="8" fill="#101316"/>
  <rect x="0" y="0" width="760" height="36" rx="8" fill="#1b2127"/>
  <circle cx="20" cy="18" r="5" fill="#ff5f56"/>
  <circle cx="38" cy="18" r="5" fill="#ffbd2e"/>
  <circle cx="56" cy="18" r="5" fill="#27c93f"/>
  <text x="78" y="23" fill="#c9d1d9" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13">pretty + terminal color</text>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" xml:space="preserve">
    <text y="70">
      <tspan x="28" fill="#5fd7ff">@</tspan><tspan x="39" fill="#5fd7ff">doc</tspan><tspan x="72" fill="#d6dee6"> </tspan><tspan x="83" fill="#5fd7ff">cem-ml 1</tspan>
    </text>
    <text y="98">
      <tspan x="28" fill="#5fd7ff">@</tspan><tspan x="39" fill="#5fd7ff">ns</tspan><tspan x="61" fill="#d6dee6"> </tspan><tspan x="72" fill="#5fd7ff">template = &quot;https://cem.dev/ns/template/cem-native/1&quot;</tspan>
    </text>
    <text y="126">
      <tspan x="28" fill="#5fd7ff">@</tspan><tspan x="39" fill="#5fd7ff">default</tspan><tspan x="116" fill="#d6dee6"> </tspan><tspan x="127" fill="#5fd7ff">template</tspan>
    </text>
    <text y="154">
      <tspan x="28" fill="#5fd7ff">{</tspan><tspan x="39" fill="#5fd7ff">module</tspan><tspan x="105" fill="#d6dee6"> |</tspan>
    </text>
    <text y="182">
      <tspan x="28" fill="#8b949e">    </tspan><tspan x="72" fill="#5fd7ff">{</tspan><tspan x="83" fill="#5fd7ff">template</tspan><tspan x="171" fill="#d6dee6"> </tspan><tspan x="182" fill="#5fd7ff">@name=greeting</tspan><tspan x="336" fill="#d6dee6"> |</tspan>
    </text>
    <text y="210">
      <tspan x="28" fill="#8b949e">        </tspan><tspan x="116" fill="#5fd7ff">{</tspan><tspan x="127" fill="#5fd7ff">body</tspan><tspan x="171" fill="#d6dee6"> |</tspan>
    </text>
    <text y="238">
      <tspan x="28" fill="#8b949e">            </tspan><tspan x="160" fill="#5fd75f">Hello, world.</tspan>
    </text>
    <text y="266">
      <tspan x="28" fill="#d6dee6">        </tspan><tspan x="116" fill="#5fd7ff">}</tspan>
    </text>
    <text y="294">
      <tspan x="28" fill="#d6dee6">    </tspan><tspan x="72" fill="#5fd7ff">}</tspan>
    </text>
    <text y="322">
      <tspan x="28" fill="#5fd7ff">}</tspan>
    </text>
  </g>
</svg>
