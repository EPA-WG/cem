    <title>SVG and MathML Islands</title>

    <svg viewBox="0 0 24 24" role="img" aria-label="Plus">
      <title>Plus</title>
      <path d="M12 3v18"></path>
      <path d="M3 12h18"></path>

        <mi>x</mi>

        <mn>1</mn>

    </math>
