[package]
name = "cem-ml"
version = "0.1.0"
authors = ["Sasha Firsov <sasha@firsov.net>"]
edition = "2021"
description = "CEM schema-defined parser/runtime library"
license = "MIT"
publish = true

[lib]
name = "cem_ml"
crate-type = ["cdylib", "rlib"]

[features]
default = ["debug-control"]
debug-control = []
fake-engine = []

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
yaml-rust2 = "0.11"
quick-xml = "0.41"
pulldown-cmark = { version = "0.13", default-features = false }
blake3 = "1"
syn = { version = "2", features = ["full", "visit"] }
regex = "1"
csv = "1"
cssparser = "0.37"
ryu = "1"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
js-sys = "0.3"

[target.'cfg(all(target_arch = "wasm32", target_os = "unknown"))'.dependencies]
getrandom = { version = "0.3", features = ["wasm_js"] }

[dev-dependencies]
tree-sitter = "0.25"
tree-sitter-cem = { path = "grammar/tree-sitter-cem" }
xee-xpath-ast = { version = "=0.1.4", features = ["serde"] }
xee-xpath-lexer = "=0.1.4"
