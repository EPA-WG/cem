<cem-element xmlns="http://www.w3.org/1999/xhtml" tag="cem-theme-switch">
  <template id="cem-theme-switch" type="text/cem-ml">
    {cem-element @tag=cem-icon-button @src="../cem-icon-button/cem-icon-button.xhtml#cem-icon-button"}
    {cem-element @tag=cem-dropdown @capability=popup @src="../cem-dropdown/cem-dropdown.xhtml#cem-dropdown"}
    {cem-element @tag=cem-menu @capability=composite-menu @src="../cem-menu/cem-menu.xhtml#cem-menu"}
    {attribute @name=storage-key @select='datadom.attributes.storage-key ?? datadom.attributes.name ?? "cem-theme"'}
    {local-storage @slice=selection @key="{$storage-key}" @type=text @live=true}
    {attribute @name=mode | light}
    {attribute @name=contrast | false}
    {attribute @name=current-theme @select='datadom.attributes.value ?? datadom.slices.selection ?? (if $mode == "dark" { if $contrast == "true" { "cem-theme-contrast-dark" } else { "cem-theme-dark" } } else { if $mode == "native" { "cem-theme-native" } else { if $contrast == "true" { "cem-theme-contrast-light" } else { "cem-theme-light" } } })'}
    {attribute @name=data-theme @select='if ($current-theme == "cem-theme-dark") || ($current-theme == "cem-theme-contrast-dark") || ($current-theme == "cem-theme-contrast-light") || ($current-theme == "cem-theme-native") { $current-theme } else { "cem-theme-light" }'}
    {attribute @name=interaction-scope @select='""'}
    {style @type="text/css" |```
      :scope[hidden]:where(:not([hidden="until-found" i])) { display: none; }
      :scope { display: block; background-color: var(--cem-palette-comfort); color: var(--cem-palette-comfort-text); }
      :scope:where([data-theme='cem-theme-native']) { color-scheme: light dark; }
    ```}
    {cem-icon-button @part=trigger @interaction-name=theme-trigger @image="◐" @variant=contextual @title="Change theme" @aria-label="Change theme"}
    {cem-dropdown @part=menu @trigger-for="@theme-trigger" @boundary=viewport @open=false @host-command={datadom.attributes.theme-command} @slice=selection @slice-event=click @slice-value="$target.value" |
      {cem-menu @keyboard=menu @direction=column @aria-label="Theme" |
        {cem-icon-button @align=start @image="☀" @variant=contextual @selectable=true @selected={if $data-theme == "cem-theme-light" { true } else { null } } @control-role=menuitemradio @aria-label="Light" @value=cem-theme-light | Light}
        {cem-icon-button @align=start @image="☾" @variant=contextual @selectable=true @selected={if $data-theme == "cem-theme-dark" { true } else { null } } @control-role=menuitemradio @aria-label="Dark" @value=cem-theme-dark | Dark}
        {cem-icon-button @align=start @image="☀" @variant=contextual @selectable=true @selected={if $data-theme == "cem-theme-contrast-light" { true } else { null } } @control-role=menuitemradio @aria-label="Contrast light" @value=cem-theme-contrast-light | Contrast light}
        {cem-icon-button @align=start @image="☾" @variant=contextual @selectable=true @selected={if $data-theme == "cem-theme-contrast-dark" { true } else { null } } @control-role=menuitemradio @aria-label="Contrast dark" @value=cem-theme-contrast-dark | Contrast dark}
        {cem-icon-button @align=start @image="◐" @variant=contextual @selectable=true @selected={if $data-theme == "cem-theme-native" { true } else { null } } @control-role=menuitemradio @aria-label="System" @value=cem-theme-native | System}
      }
    }
    {slot}
  </template>
</cem-element>
