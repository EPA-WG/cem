<cem-element xmlns="http://www.w3.org/1999/xhtml" tag="cem-workspace">
  <template id="cem-workspace" type="text/cem-ml">
{attribute @name=label | Workspace}
{attribute @name=fit | content}
{attribute @name=layout | workbench}
{attribute @name=appearance | surface}
{attribute @name=navigation-label | Project explorer}
{attribute @name=editor-label | Current file editor}
{attribute @name=preview-label | Preview}
{attribute @name=tools-label | Commands and diagnostics}
{style @type=text/css |```
:scope { display: block; min-inline-size: 0; min-block-size: 0; container-type: inline-size; }
:scope[fit='fill'] { block-size: 100%; }
:scope[hidden]:where(:not([hidden='until-found' i])) { display: none; }
[part~='root'] { display: grid; grid-template-areas: 'navigation' 'editor' 'preview' 'tools'; grid-template-columns: minmax(0, 1fr); gap: var(--cem-gap-related); min-inline-size: 0; min-block-size: 0; font-family: var(--cem-typography-ui-font-family); font-size: var(--cem-typography-ui-font-size); line-height: var(--cem-typography-ui-line-height); }
[part~='region'] { display: grid; grid-template-rows: auto minmax(0, 1fr); min-inline-size: 0; min-block-size: 0; background-color: var(--cem-palette-comfort); color: var(--cem-palette-comfort-text); border: var(--cem-stroke-boundary) solid currentColor; border-radius: var(--cem-bend-container); }
[part~='heading'] { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: max(var(--cem-gap-related), var(--cem-coupling-guard-min)); padding: var(--cem-inset-container); }
[part~='title'] { margin: 0; font: inherit; font-weight: var(--cem-typography-ui-font-weight); }
[part~='content'] { display: grid; min-inline-size: 0; min-block-size: 0; padding: var(--cem-inset-container); padding-block-start: 0; overflow: auto; }
[part~='content'] > [slot] { display: grid; min-inline-size: 0; min-block-size: 0; }
[part~='navigation'] { grid-area: navigation; }
[part~='editor'] { grid-area: editor; }
[part~='preview'] { grid-area: preview; min-block-size: 20vb; }
[part~='tools'] { grid-area: tools; }
@container (min-width: 840px) {
 [part~='root'] { grid-template-columns: minmax(0, 1fr) minmax(0, 3fr); grid-template-areas: 'navigation editor' 'navigation preview' 'navigation tools'; }
}
@container (min-width: 1200px) {
 [part~='root'] { grid-template-columns: minmax(0, 1fr) minmax(0, 2fr) minmax(0, 1.5fr); grid-template-areas: 'navigation editor preview' 'navigation tools tools'; }
 [part~='root'][data-fit='fill'] { block-size: 100%; grid-template-rows: minmax(0, 1fr) minmax(0, 0.3fr); }
}
[part~='root'][data-layout='browser'] { grid-template-areas: 'navigation' 'editor'; grid-template-columns: minmax(0, 1fr); grid-template-rows: auto minmax(0, 1fr); }
[part~='root'][data-layout='browser'] > :where([part~='preview'], [part~='tools']) { display: none; }
@container (min-width: 840px) {
 [part~='root'][data-layout='browser'] { block-size: 100%; grid-template-areas: 'navigation editor'; grid-template-columns: minmax(0, 1fr) minmax(0, 3fr); grid-template-rows: minmax(0, 1fr); }
}
[part~='root'][data-layout='project'] { grid-template-areas: 'navigation' 'editor' 'preview'; grid-template-columns: minmax(0, 1fr); grid-template-rows: auto auto minmax(0, 1fr); }
[part~='root'][data-layout='project'] > :where([part~='tools']) { display: none; }
@container (min-width: 840px) {
 [part~='root'][data-layout='project'] { grid-template-areas: 'navigation editor' 'navigation preview'; grid-template-columns: minmax(0, 1fr) minmax(0, 3fr); grid-template-rows: minmax(0, 1fr) minmax(0, 1fr); }
 [part~='root'][data-layout='project']:where([data-fit='fill']) { block-size: 100%; }
}
@container (min-width: 1200px) {
 [part~='root'][data-layout='project'] { grid-template-areas: 'navigation editor preview'; grid-template-columns: minmax(0, 1fr) minmax(0, 2fr) minmax(0, 1.5fr); grid-template-rows: minmax(0, 1fr); }
}
[part~='root']:where([data-appearance='flush']) { gap: 0; }
[part~='root']:where([data-appearance='flush']) > [part~='region'] { border-radius: 0; }
[part~='root']:where([data-appearance='flush']) > :where([part~='region']) > :where([part~='heading']) { padding-block: var(--cem-control-padding-y); padding-inline: var(--cem-control-padding-x); gap: var(--cem-coupling-guard-min); }
[part~='root']:where([data-appearance='flush']) > :where([part~='region']) > :where([part~='content']) { padding: 0; }
@media (forced-colors: active) {
 [part~='region'] { background-color: Canvas; color: CanvasText; border-color: CanvasText; forced-color-adjust: auto; }
}
```}
{section @part=root @data-fit={fit} @data-layout={layout} @data-appearance={appearance} @aria-label={datadom.attributes.aria-label ?? label} |
 {section @part="region navigation" @aria-label="{$navigation-label}" |
  {header @part=heading | {h2 @part=title | {slot @name=navigation-heading | {$navigation-label}}} {slot @name=navigation-actions}}
  {div @part=content | {slot @name=navigation}}
 }
 {section @part="region editor" @aria-label="{$editor-label}" |
  {header @part=heading | {h2 @part=title | {slot @name=editor-heading | {$editor-label}}}}
  {div @part=content | {slot @name=editor}}
 }
 {section @part="region preview" @aria-label="{$preview-label}" |
  {header @part=heading | {h2 @part=title | {slot @name=preview-heading | {$preview-label}}}}
  {div @part=content | {slot @name=preview}}
 }
 {section @part="region tools" @aria-label="{$tools-label}" |
  {header @part=heading | {h2 @part=title | {slot @name=tools-heading | {$tools-label}}}}
  {div @part=content | {slot @name=tools}}
 }
}
  </template>
</cem-element>
