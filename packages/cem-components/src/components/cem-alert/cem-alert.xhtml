<cem-element xmlns="http://www.w3.org/1999/xhtml" tag="cem-alert">
  <template id="cem-alert" type="text/cem-ml">
    {style @type=text/css |```
:scope { display: block; }
[part~='root'] { box-sizing: border-box; }
:scope[hidden]:where(:not([hidden='until-found' i])) { display: none; }
[part~='root'] { background-color: var(--cem-palette-comfort); color: var(--cem-palette-comfort-text); border: var(--cem-stroke-boundary) solid currentColor; padding: var(--cem-inset-container); font-family: var(--cem-typography-ui-font-family); font-size: var(--cem-typography-ui-font-size); font-weight: var(--cem-typography-ui-font-weight); line-height: var(--cem-typography-ui-line-height); letter-spacing: var(--cem-typography-ui-letter-spacing); }
@media (forced-colors: active) { [part~='root'] { background-color: Canvas; color: CanvasText; border-color: CanvasText; } }
[part~='root'][data-tone='info'] { background-color: var(--cem-palette-trust); color: var(--cem-palette-trust-text); }
[part~='root'][data-tone='success'] { background-color: var(--cem-palette-calm); color: var(--cem-palette-calm-text); }
[part~='root'][data-tone='warning'] { background-color: var(--cem-palette-enthusiasm); color: var(--cem-palette-enthusiasm-text); }
[part~='root'][data-tone='danger'] { background-color: var(--cem-palette-danger); color: var(--cem-palette-danger-text); }
    ```}
    {attribute @name=label | Alert}{attribute @name=tone | info}{attribute @name=role | status}{div @part=root @class="cem-alert cem-alert--{$tone}" @data-tone={if ($tone == "success") || ($tone == "warning") || ($tone == "danger") { $tone } else { "info" }} @role={if $role == "alert" { "alert" } else { "status" }} | {slot | {$label}}}
  </template>
</cem-element>
