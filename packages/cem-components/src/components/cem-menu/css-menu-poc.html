<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Radio menu prototype</title>
    <style>
        label{ display:block;}
    </style>
</head>
<body>
This is proof of concept for cem-menu component implementation.
<nav>

    <label ><input type="radio" name="Q"/> A <button type="button">A</button></label>
    <label ><input type="radio" name="Q"/> Open Dialog
        <button command="show-popover" commandfor="my-dialog1" type="button">Open Dialog</button>
    </label>
    <dialog id="my-dialog1"  popover style="position-area: bottom;" >
        <menu>

            <label ><input type="radio" name="W"/> A <button type="button">A</button></label>
            <label ><input type="radio" name="W"/> submenu2
                <button command="show-popover" commandfor="my-dialog2" type="button">Open Dialog2</button>
            </label>
            <dialog id="my-dialog2"  popover style="position-area: bottom;" >
                <menu>

                    <p>Dialog is open!</p>
                    <button command="hide-popover" commandfor="my-dialog2" type="button">Close</button>
                </menu>
            </dialog>
            <label ><input type="radio" name="W"/> C <button type="button">C</button></label>
            <button command="hide-popover" commandfor="my-dialog1" type="button">Close</button>
        </menu>
    </dialog>
    <label ><input type="radio" name="Q"/> C <button type="button">C</button></label>
</nav>

<script>
    [...document.querySelectorAll('label')].forEach( l=>
    {   l.addEventListener('keydown', event=>
        {
            if (event.target.closest('button')) return;
            if (event.key !== 'Enter' && event.key !== ' ' ) return;
            event.preventDefault(); // when "Enter" is pressed to stop the browser from looking for a parent form to submit.
            const b = l.querySelector('button');
            b.focus();
            b.click();
        });
        l.addEventListener('click', event => {
            // Native radio arrow navigation dispatches a click: select without activating.
            if (event.target.closest('button, input[type=radio]')) return;
            l.firstElementChild.checked = true;
            event.preventDefault();
            const b = l.querySelector('button');
            b.focus();
            b.click();
        });
    });

    [...document.querySelectorAll('dialog')].forEach( d=>d.addEventListener('toggle', (event) => {
        if (event.newState === 'closed') {
            event.preventDefault();
            const source = d.toggleSource;
            if (!source?.isConnected) return;
            // Closing a whole branch must not restore into a hidden ancestor.
            for (let ancestor = source.parentElement; ancestor; ancestor = ancestor.parentElement) {
                if (ancestor.hasAttribute('popover') && !ancestor.matches(':popover-open')) return;
            }
            // Leave newly focused outside controls alone after light dismissal.
            const focused = document.activeElement;
            if (focused !== document.body && focused !== source && !d.contains(focused)) return;
            source.parentElement.focus();
        }else{
            d.toggleSource = event.source;
            // debugger
        }
    }));
</script>
</body>
</html>
