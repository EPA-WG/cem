<!--
Difference b/w tabs and menu.
* tabs switch the content in target area
* menu triggers popover with sub-menu or dialogs.

# Similarity
Items allows to use arrow keys navigation and serve a single tabstop for items in menubar.
The <input type=radio> is the only mechanism for declarative native arrow navigation.

To support the popover <button popovertarget=dialog-id> has to be presented as only declarative popover mechanism.
Click/ENTER/SPACE on the radio should trigger the popover for a button. In order to have the focus back when popup closed,
the button should have the focus before the popup opened. i.e. sequence is
* click/enter/space on radio
* button.focus()
* button.click()
* the popup appeared
* eventually popup closed by ESC
* button receives focus
* giving focus back to associated radio - radio.focus().

The button receives focus only for 1st level of menu, the deep enclosed sub-menus do not get the focus back, even the ESC
sequence is properly handles encapsulation stack.

Q1. How to make sure the popup closure will lead to focus associated radio ( perhaps via button )?
Q2. What is declarative markup good enough for popup appearance and catching the focus back disregarding of enclosure depth?
* ? @popovertarget to trigger the sibling <button> render AND Click/ENTER/SPACE handler
Q3. What is styling and can/should it be done inline
Q4. Should popovertarget be handled by cem-element as generic pattern?

Q5. why on ESC closing dialog id="page-options"  the host dialog id="export-options"  resets radio selection to 1st?
    Instead of keeping the last selected

Q6. Is there event for popover source when popup is closed?


-->
<cem-element xmlns="http://www.w3.org/1999/xhtml" tag="cem-menu" capability="composite-menu">
  <template id="cem-menu" type="text/cem-ml">
    {cem-element @tag=cem-menu-item @capability=action-control @src="../cem-menu-item/cem-menu-item.xhtml#cem-menu-item"}
    {attribute @name=justify | start}
    {style @type="text/css" |```
        :scope { display: block; }
        :scope[hidden]:where(:not([hidden="until-found" i])) { display: none; }
        :scope:where([slot='submenu'], [popover]) { margin: 0; padding: 0; inline-size: max-content; display: none; background: var(--cem-palette-comfort); color: var(--cem-palette-comfort-text); border: var(--cem-stroke-boundary) solid var(--cem-palette-comfort-text); }
        :scope:where([popover]:not([hidden])):popover-open { display: block; }
        :scope > :where([part~='composite']) {
            display: flex; flex-direction: row; flex-wrap: wrap; justify-content: flex-start;
            box-sizing: border-box;
            padding: max(var(--cem-menu-inset), var(--cem-inset-control), var(--cem-coupling-guard-min), calc(3 * var(--cem-zebra-strip-size)), calc(var(--cem-stroke-focus) + var(--cem-stroke-indicator-offset)));
            gap: max(var(--cem-menu-item-gap), var(--cem-gap-related), calc(2 * var(--cem-coupling-guard-min)), calc(6 * var(--cem-zebra-strip-size)), calc(2 * (var(--cem-stroke-focus) + var(--cem-stroke-indicator-offset))));
        }
        :scope[direction='column'] > :where([part~='composite']), :scope:where([slot='submenu']:not([direction='row'])) > :where([part~='composite']) { flex-direction: column; }
        :scope[justify='end'] > :where([part~='composite']) { justify-content: flex-end; }
        :scope > :where([part~='composite']) > :is(a, button) {
            display: flex; align-items: center; gap: var(--cem-gap-related);
            min-block-size: var(--cem-menu-row-height); box-sizing: border-box;
            padding: var(--cem-inset-control); border: 0;
            background: var(--cem-action-contextual-default-background);
            color: var(--cem-action-contextual-default-text); text-decoration: none;
            font-family: var(--cem-typography-ui-font-family); font-size: var(--cem-typography-ui-font-size);
            font-weight: var(--cem-typography-ui-font-weight); line-height: var(--cem-typography-ui-line-height);
        }
        :scope > :where([part~='composite']) > :is(a, button):where(:not([disabled], [aria-disabled='true']):hover) { background: var(--cem-action-contextual-hover-background); color: var(--cem-action-contextual-hover-text); }
        :scope > :where([part~='composite']) > :is(a, button):where(:not([disabled], [aria-disabled='true']):active) { background: var(--cem-action-contextual-active-background); color: var(--cem-action-contextual-active-text); }
        :scope > :where([part~='composite']) > :is(a, button):where([disabled], [aria-disabled='true']) { background: var(--cem-action-contextual-disabled-background); color: var(--cem-action-contextual-disabled-text); }
        :scope > :where([part~='composite']) > :is(a, button):focus-visible { outline: var(--cem-stroke-focus) solid currentColor; outline-offset: var(--cem-stroke-indicator-offset); box-shadow: var(--cem-ring-zebra-3); }
        :scope > :where([part~='composite']) > [hidden]:where(:not([hidden='until-found' i])) { display: none; }
      @supports (anchor-name: --cem-probe) and (position-area: bottom span-right) and (position-try-fallbacks: top span-right) {
        :scope:where([slot='submenu'], [popover]) {
          --_cem-surface-anchor-policy: area;
          position: var(--_cem-surface-position-mode, fixed);
          position-area: var(--_cem-surface-area, none);
          position-try-fallbacks: var(--_cem-surface-tries, none);
        }
      }
        @media (forced-colors: active) {
            :scope:where([slot='submenu'], [popover]) { background: Canvas; color: CanvasText; border-color: CanvasText; }
            :scope > :where([part~='composite']) > :is(a, button):focus-visible { outline-color: Highlight; }
            :scope > :where([part~='composite']) > :is(a, button):where([disabled], [aria-disabled='true']) { color: GrayText; }
        }
        ```}
    {div @part=composite @aria-label="{$datadom.attributes.aria-label}" @aria-labelledby="{$datadom.attributes.aria-labelledby}" | {slot}}
  </template>
</cem-element>
