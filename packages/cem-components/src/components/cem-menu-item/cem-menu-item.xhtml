<cem-element xmlns="http://www.w3.org/1999/xhtml" tag="cem-menu-item" capability="action-control">
  <template id="cem-menu-item" type="text/cem-ml">
    {attribute @name=label | Menu item}
    {style @type="text/css" |```
        :scope[hidden]:where(:not([hidden="until-found" i])) { display: none; }
        :scope > :is(button, a)[part~='control'] {
            background-color: var(--cem-action-contextual-default-background);
            color: var(--cem-action-contextual-default-text);
        }
        :scope > button[part~='control']:where(:enabled:hover) {
            background-color: var(--cem-action-contextual-hover-background);
            color: var(--cem-action-contextual-hover-text);
        }
        :scope > button[part~='control']:where(:enabled:active) {
            background-color: var(--cem-action-contextual-active-background);
            color: var(--cem-action-contextual-active-text);
        }
        :scope > a[part~='control']:where([href]:hover) { background-color: var(--cem-action-contextual-hover-background); color: var(--cem-action-contextual-hover-text); }
        :scope > a[part~='control']:where([href]:active) { background-color: var(--cem-action-contextual-active-background); color: var(--cem-action-contextual-active-text); }
        :scope { display: inline-flex; position: relative; }
        :scope > :is(button, a)[part~='control'] {
            display: flex; flex: 1; align-items: center; gap: var(--cem-gap-related);
            min-block-size: var(--cem-menu-row-height);
            padding: var(--cem-inset-control);
            border: 0; text-decoration: none;
            font-family: var(--cem-typography-ui-font-family);
            font-size: var(--cem-typography-ui-font-size);
            line-height: var(--cem-typography-ui-line-height);
            font-weight: var(--cem-typography-ui-font-weight);
        }
        :scope > [part~='control']:where(:focus-visible) { outline: var(--cem-stroke-focus) solid var(--cem-zebra-color-1); outline-offset: var(--cem-stroke-indicator-offset); box-shadow: var(--cem-ring-zebra-3); }
        :scope > [part~='control']:where(:disabled, [aria-disabled='true']) { background: var(--cem-action-contextual-disabled-background); color: var(--cem-action-contextual-disabled-text); }
        :scope > [part~='control']:where([aria-haspopup='menu'])::after { content: '▾'; }
        :scope > [part~='control']:where([aria-expanded='true'])::after { content: '▴'; }
        @media (forced-colors: active) {
            :scope > [part~='control']:where(:focus-visible) { outline-color: Highlight; }
            :scope > [part~='control']:where(:disabled, [aria-disabled='true']) { color: GrayText; }
        }
        ```}
    {slice @name=hasSubmenu | false}
    {cem:choose |
      {cem:when @test="seq:count(datadom.attributes.href) > 0 &amp;&amp; !datadom.slices.hasSubmenu" |
        {a @part=control @role=menuitem @href={if seq:count(datadom.attributes.disabled) > 0 { null } else { datadom.attributes.href }} @aria-label="{$datadom.attributes.aria-label}" @aria-disabled={if seq:count(datadom.attributes.disabled) > 0 { true } else { null }} @tabindex={if seq:count(datadom.attributes.disabled) > 0 { -1 } else { null }} @slice=selected @slice-event=click @slice-value="$event.type" | {slot | {$label}}}
      }
      {cem:otherwise |
        {button @type=button @class=cem-menu-item @role=menuitem @part=control @aria-label="{$datadom.attributes.aria-label}" @disabled={if seq:count(datadom.attributes.disabled) > 0 { true } else { null }} @aria-expanded={if datadom.slices.hasSubmenu { null } else { datadom.attributes.expanded }} @slice=selected @slice-event=click @slice-value="$event.type" | {slot | {$label}}}
      }
    }
    {slot @name=submenu}
  </template>
</cem-element>
