<cem-element xmlns="http://www.w3.org/1999/xhtml" tag="cem-progress-spinner" capability="progress-status">
  <template id="cem-progress-spinner" type="text/cem-ml">
    {style @type=text/css |```
:scope {
    display: inline-block;
}

:scope > :where([part~='root']) {
    block-size: var(--cem-progress-spinner-size);
    display: inline-block;
    inline-size: var(--cem-progress-spinner-size);
}

:scope :where([part~='svg']) {
    block-size: 100%;
    display: block;
    inline-size: 100%;
    overflow: visible;
    transform: rotate(-90deg);
}

:scope :where([part~='track']) {
    fill: none;
    stroke: var(--cem-progress-track-color);
    stroke-width: var(--cem-progress-track-thickness);
    vector-effect: non-scaling-stroke;
}

:scope :where([part~='indicator']) {
    fill: none;
    stroke: var(--cem-progress-indicator-color);
    stroke-linecap: round;
    stroke-width: var(--cem-progress-track-thickness);
    transform-box: fill-box;
    transform-origin: center;
    vector-effect: non-scaling-stroke;
}

:scope > :where([part~='root'][data-mode='indeterminate']) :where([part~='indicator']) {
    animation-name: cem-progress-spinner-cycle;
    animation-duration: var(--cem-duration-continuous-cycle);
    animation-timing-function: var(--cem-easing-uniform);
    animation-iteration-count: infinite;
}

@keyframes cem-progress-spinner-cycle {
    to {
        transform: rotate(360deg);
    }
}

@media (prefers-reduced-motion: reduce) {
    :scope > :where([part~='root'][data-mode='indeterminate']) :where([part~='indicator']) {
        animation: none;
    }
}
:scope[hidden]:where(:not([hidden='until-found' i])) { display: none; }
