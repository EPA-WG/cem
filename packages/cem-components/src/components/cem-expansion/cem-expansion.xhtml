<cem-element xmlns="http://www.w3.org/1999/xhtml" tag="cem-expansion" capability="disclosure-panel">
<template id="cem-expansion" type="text/cem-ml">
{style @type=text/css |```
:scope {
    display: block;
}

:scope > :where([part~="root"]) {
    background-color: var(--cem-palette-comfort);
    color: var(--cem-palette-comfort-text);
}

:scope[layout='panel'] > :where([part~="root"]) > :where([part~="heading"]) {
    align-items: center;
    display: flex;
    min-inline-size: 0;
}

:scope > :where([part~="root"]) > :where([part~="heading"]) > :where([part~="header"]) {
    align-items: center;
    appearance: none;
    background-color: var(--cem-action-contextual-default-background);
    border: var(--cem-stroke-none) solid transparent;
    border-radius: var(--cem-bend-control);
    box-sizing: border-box;
    color: var(--cem-action-contextual-default-text);
    display: flex;
    font-family: var(--cem-typography-ui-font-family);
    font-size: var(--cem-typography-ui-font-size);
    font-weight: var(--cem-typography-ui-font-weight);
    gap: var(--cem-gap-related);
    letter-spacing: var(--cem-typography-ui-letter-spacing);
    line-height: var(--cem-typography-ui-line-height);
    margin: var(--cem-stroke-none);
    min-block-size: var(--cem-coupling-zone-min);
    min-inline-size: var(--cem-coupling-zone-min);
    padding-block: var(--cem-control-padding-y);
    padding-inline: var(--cem-control-padding-x);
    text-align: start;
}

:scope > :where([part~="root"]) > :where([part~="heading"]) > :where([part~="header"]:enabled:hover) {
    background-color: var(--cem-action-contextual-hover-background);
    color: var(--cem-action-contextual-hover-text);
}

:scope > :where([part~="root"]) > :where([part~="heading"]) > :where([part~="header"]:enabled:active) {
    background-color: var(--cem-action-contextual-active-background);
    color: var(--cem-action-contextual-active-text);
}

:scope > :where([part~="root"]) > :where([part~="heading"]) > :where([part~="header"]:disabled) {
    background-color: var(--cem-action-contextual-disabled-background);
    color: var(--cem-action-contextual-disabled-text);
}

:scope > :where([part~="root"]) > :where([part~="heading"]) > :where([part~="header"]:enabled:focus-visible) {
    outline: var(--cem-stroke-focus) solid var(--cem-zebra-color-1);
    outline-offset: var(--cem-stroke-indicator-offset);
}

:scope :where([part~="summary"]) {
    flex: 1 1 auto;
}

:scope :where([part~="indicator"]) {
    align-items: center;
    block-size: var(--cem-icon-button-icon-size);
    display: inline-flex;
    flex: 0 0 var(--cem-icon-button-icon-size);
    inline-size: var(--cem-icon-button-icon-size);
    justify-content: center;
}

:scope > :where([part~="root"]) > :where([part~="panel"]) {
    background-color: var(--cem-palette-comfort);
    border-radius: var(--cem-bend-surface);
    color: var(--cem-palette-comfort-text);
    margin-block-start: var(--cem-gap-related);
    padding: var(--cem-inset-container);
}
:scope[indicator='start'] :where([part~="indicator"]) { order: -1; }
:scope[layout='panel'] { display: flex; min-block-size: 0; min-inline-size: 0; }
:scope[layout='panel'] > :where([part~="root"]) {
    display: grid; flex: 1 1 auto; grid-template-columns: minmax(0, 1fr) auto; grid-template-rows: auto minmax(0, 1fr); min-block-size: 0; min-inline-size: 0;
}
:scope[layout='panel'] > :where([part~="root"]) > :where([part~="heading"]) { grid-area: 1 / 1; }
:scope[layout='panel'] > :where([part~="root"]) > :where([part~="heading"]) > :where([part~="header"]) { flex: 1 1 auto; min-inline-size: 0; }
:scope[layout='panel'] > :where([part~="root"]) > :where([part~="panel"]) {
    grid-area: 2 / 1 / 3 / 3; margin: 0; padding: 0; min-block-size: 0; min-inline-size: 0; overflow: auto;
}
:scope > :where([part~="root"]) > :where([slot='header-actions']) {
    align-items: center; display: inline-flex; grid-area: 1 / 2; gap: var(--cem-coupling-guard-min);
}
@media (forced-colors: active) {
:scope > :where([part~="root"]),
:scope > :where([part~="root"]) > :where([part~="heading"]) > :where([part~="header"]),
:scope > :where([part~="root"]) > :where([part~="panel"]) {
        background-color: Canvas;
        color: CanvasText;
    }

:scope > :where([part~="root"]) > :where([part~="heading"]) > :where([part~="header"]:enabled:hover),
:scope > :where([part~="root"]) > :where([part~="heading"]) > :where([part~="header"]:enabled:active) {
        background-color: Highlight;
        color: HighlightText;
    }

:scope > :where([part~="root"]) > :where([part~="heading"]) > :where([part~="header"]:disabled) {
        background-color: Canvas;
        color: GrayText;
    }

:scope > :where([part~="root"]) > :where([part~="heading"]) > :where([part~="header"]:enabled:focus-visible) {
        outline: var(--cem-stroke-focus) solid CanvasText;
        outline-offset: var(--cem-stroke-indicator-offset);
    }
}
:scope[hidden]:where(:not([hidden="until-found" i])) { display: none; }
```}

</cem-element>
