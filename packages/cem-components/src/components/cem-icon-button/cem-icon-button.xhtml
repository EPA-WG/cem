<cem-element xmlns="http://www.w3.org/1999/xhtml" tag="cem-icon-button">
  <template id="cem-icon-button" type="text/cem-ml">
    {attribute @name=label | Icon action}
    {attribute @name=name | circle}
    {attribute @name=variant | quiet}
    {style @type="text/css" |```
        :scope[hidden]:where(:not([hidden="until-found" i])) { display: none; }
        :scope > button[part~='control'] {
            background-color: var(--cem-action-contextual-default-background);
            color: var(--cem-action-contextual-default-text);
        }
        :scope > button[part~='control']:where(:enabled:hover) {
            background-color: var(--cem-action-contextual-hover-background);
            color: var(--cem-action-contextual-hover-text);
        }
        :scope > button[part~='control']:where(:enabled:active) {
            background-color: var(--cem-action-contextual-active-background);
            color: var(--cem-action-contextual-active-text);
        }
        ```}
    {button @type=button @class="cem-icon-button cem-icon-button--{$variant}" @aria-label="{$label}" @part=control @disabled={if seq:count(datadom.attributes.disabled) > 0 { true } else { null }} @aria-expanded={datadom.attributes.expanded} @slice=pressed @slice-event=click @slice-value="$event.type" |
      {span @class="cem-icon cem-icon--{$name}" @part=icon @aria-hidden=true | {$name}}
      {slot}
    }
  </template>
</cem-element>
