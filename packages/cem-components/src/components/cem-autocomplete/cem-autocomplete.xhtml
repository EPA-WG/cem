<cem-element xmlns="http://www.w3.org/1999/xhtml" tag="cem-autocomplete" capability="editable-choice">
  <template id="cem-autocomplete" type="text/cem-ml">
    {module |
      {attribute @name=label | Autocomplete}
      {attribute @name=indicator | underline}
      {slice @name=groups}
      {slice @name=displayValue | }
      {slice @name=expanded | false}
      {template @name=autocomplete-option |
        {param @name=option}
        {body |
          {div @id="{$option.id}" @class=cem-autocomplete__option @part=option @role=option @data-option-index="{$option.index}" @data-active="{$option.active}" @aria-selected="{$option.selected}" @aria-disabled="{$option.disabled}" |
            {cem:choose |
              {cem:when @test="option.hasChildren" | {cem:project-payload @select="option.children" | }}
              {cem:otherwise | {$option.label}}
            }
          }
        }
      }
      {template @name=autocomplete-options |
        {param @name=groups}
        {body |
          {cem:for-each @select="groups" @as=group |
            {cem:choose |
              {cem:when @test="group.label" |
                {div @class=cem-autocomplete__group @part=group @role=group @aria-label="{$group.label}" @aria-disabled="{$group.disabled}" |
                  {div @class=cem-autocomplete__group-label @part=group-label @aria-hidden=true | {$group.label}}
                  {cem:for-each @select="group.options" @as=option | {call @template=autocomplete-option @with:option="{$option}"}}
                }
              }
              {cem:otherwise |
                {cem:for-each @select="group.options" @as=option | {call @template=autocomplete-option @with:option="{$option}"}}
              }
            }
          }
        }
      }
      {body |
        {style @type="text/css" |```
          :scope[hidden]:where(:not([hidden="until-found" i])) { display: none; }


          [part~=control] {
              --_cem-input-indicator-anchor-width: var(--cem-stroke-none);
              --_cem-input-indicator-focus-width: var(--cem-stroke-none);
              --_cem-input-indicator-selection-width: var(--cem-stroke-none);
              --_cem-input-indicator-anchor-color: var(--cem-input-indicator-anchor-color);
              --_cem-input-indicator-focus-color: var(--cem-zebra-color-1);
              --_cem-input-indicator-selection-color: var(--cem-input-indicator-selection-color);
          }
          [part~=control]:where(:focus-visible, :checked, [aria-checked='mixed'], [aria-expanded='true'], [aria-invalid='true']:enabled, [data-state='loading']:enabled) {
              box-shadow:
                  0 calc(var(--_cem-input-indicator-appearance) * var(--_cem-input-indicator-anchor-width)) 0
                      calc((1 - var(--_cem-input-indicator-appearance)) * var(--_cem-input-indicator-anchor-width))
                      var(--_cem-input-indicator-anchor-color),
                  0
                      calc(
                          var(--_cem-input-indicator-appearance) *
                              (var(--_cem-input-indicator-anchor-width) + var(--_cem-input-indicator-focus-width))
                      )
                      0
                      calc(
                          (1 - var(--_cem-input-indicator-appearance)) *
                              (var(--_cem-input-indicator-anchor-width) + var(--_cem-input-indicator-focus-width))
                      )
                      var(--_cem-input-indicator-focus-color),
                  0
                      calc(
                          var(--_cem-input-indicator-appearance) *
                              (
                                  var(--_cem-input-indicator-anchor-width) + var(--_cem-input-indicator-focus-width) +
                                      var(--_cem-input-indicator-selection-width)
                              )
                      )
                      0
                      calc(
                          (1 - var(--_cem-input-indicator-appearance)) *
                              (
                                  var(--_cem-input-indicator-anchor-width) + var(--_cem-input-indicator-focus-width) +
                                      var(--_cem-input-indicator-selection-width)
                              )
                      )
                      var(--_cem-input-indicator-selection-color);
              outline: var(--cem-stroke-none) solid transparent;
          }
          [part~=control] {
              --_cem-input-indicator-appearance: var(
                  --cem-input-indicator-appearance,
                  var(--cem-indicator-appearance-underline)
              );
          }
          :scope:where([indicator='outline']) [part~=control] {
              --_cem-input-indicator-appearance: var(
                  --cem-input-indicator-appearance,
                  var(--cem-indicator-appearance-outline)
              );
          }
          [part~=control]:where(:enabled:hover) {
              --_cem-input-indicator-anchor-color: var(--cem-input-indicator-anchor-hover-color);
          }
          [part~=control]:where([readonly]:enabled) {
              --_cem-input-indicator-anchor-color: var(--cem-input-indicator-anchor-readonly-color);
          }
          [part~=control]:where([data-state='loading']:enabled) {
              --_cem-input-indicator-anchor-color: var(--cem-input-indicator-anchor-pending-color);
              --_cem-input-indicator-anchor-width: var(--cem-stroke-pending);
          }
          [part~=control]:where([aria-invalid='true']:enabled) {
              --_cem-input-indicator-anchor-color: var(--cem-input-indicator-anchor-invalid-color);
              --_cem-input-indicator-anchor-width: var(--cem-stroke-boundary);
          }
          [part~=control]:where([aria-invalid='true']:enabled:hover) {
              --_cem-input-indicator-anchor-color: var(--cem-input-indicator-anchor-invalid-hover-color);
              --_cem-input-indicator-anchor-width: var(--cem-stroke-boundary);
          }
          [part~=control]:where(:disabled) {
              --_cem-input-indicator-anchor-color: var(--cem-input-indicator-anchor-disabled-color);
              --_cem-input-indicator-anchor-width: var(--cem-stroke-none);
          }
          [part~=control]:where(:focus-visible) {
              --_cem-input-indicator-focus-width: var(--cem-zebra-strip-size);
          }
          [part~=control]:where([aria-expanded='true']) {
              --_cem-input-indicator-selection-width: var(--cem-zebra-strip-size);
          }
          :scope {
              display: inline-block;
              inline-size: 100%;
          }
          [part~=root] {
              display: grid;
              gap: var(--cem-gap-related);
              position: relative;
          }
          [part~=label],
          [part~=help],
          [part~=group-label] {
              font-family: var(--cem-typography-ui-font-family);
              font-size: var(--cem-typography-ui-font-size);
              line-height: var(--cem-typography-ui-line-height);
          }
          [part~=control] {
              background-color: var(--cem-select-popup-background);
              border: var(--cem-stroke-none) solid transparent;
              box-sizing: border-box;
              color: var(--cem-select-popup-text);
              font-family: var(--cem-typography-ui-font-family);
              font-size: var(--cem-typography-ui-font-size);
              inline-size: 100%;
              line-height: var(--cem-typography-ui-line-height);
              min-block-size: var(--cem-control-height);
              padding-block: var(--cem-control-padding-y);
              padding-inline: var(--cem-control-padding-x);
              text-align: start;
          }
          [part~=popup] {
              background-color: var(--cem-select-popup-background);
              color: var(--cem-select-popup-text);
              overflow: auto;
          }
          [part~=popup] {
              border: var(--cem-stroke-standard) solid var(--cem-select-popup-border-color);
              border-radius: var(--cem-bend-overlay);
              box-shadow: var(--cem-elevation-3);
              inset-block-start: 100%;
              inset-inline: 0;
              max-block-size: calc(var(--cem-list-row-height) * var(--cem-list-popup-rows));
              position: absolute;
              z-index: var(--cem-select-popup-z-index);
          }
          [part~=option],
          [part~=group-label] {
              align-items: center;
              box-sizing: border-box;
              display: flex;
              min-block-size: var(--cem-list-row-height);
              padding-block: var(--cem-control-padding-y);
              padding-inline: var(--cem-control-padding-x);
          }
          [part~=option]:where(:not([aria-disabled='true'])) {
              cursor: pointer;
          }
          [part~=group-label] {
              color: var(--cem-select-group-text);
          }
          [part~=option]:where([aria-selected='true']) {
              background-color: var(--cem-select-option-selected-background);
              color: var(--cem-select-option-selected-text);
              outline: var(--cem-stroke-selected) solid var(--cem-select-option-selected-background);
              outline-offset: calc(var(--cem-stroke-selected) * -1);
          }
          [part~=option]:where(:not([aria-disabled='true']):hover) {
              background-color: var(--cem-select-option-hover-background);
              color: var(--cem-select-option-hover-text);
          }
          [part~=option]:where([data-active='true']) {
              background-color: var(--cem-select-option-active-background);
              color: var(--cem-select-option-active-text);
          }
          [part~=option]:where([aria-disabled='true']) {
              background-color: var(--cem-select-option-disabled-background);
              color: var(--cem-select-option-disabled-text);
          }
          @media (forced-colors: active) {

              [part~=control] {
                  box-shadow: none;
              }

              [part~=control]:where(:enabled:hover) {
                  border-color: Highlight;
              }

              [part~=control]:where([data-state='loading']:enabled:not([aria-invalid='true'])) {
                  outline: var(--cem-stroke-pending) solid CanvasText;
                  outline-offset: var(--cem-stroke-indicator-offset);
              }

              [part~=control]:where(:focus-visible),
          [part~=control]:where([data-state='loading']:enabled:focus-visible) {
                  outline: var(--cem-stroke-focus) solid CanvasText;
                  outline-offset: var(--cem-stroke-indicator-offset);
              }

              [part~=popup] {
                  background-color: Canvas;
                  border-color: CanvasText;
                  color: CanvasText;
              }

              [part~=option]:where(:not([aria-disabled='true']):hover),
          [part~=option]:where([data-active='true']) {
                  background-color: Highlight;
                  color: HighlightText;
              }

              [part~=option]:where([aria-selected='true']) {
                  outline: var(--cem-stroke-selected) solid SelectedItem;
                  outline-offset: calc(var(--cem-stroke-selected) * -1);
              }

              [part~=option]:where([aria-disabled='true']) {
                  color: GrayText;
              }
          }
        ```}
        {div @class=cem-autocomplete @part=root |
        {span @id="{$datadom.slices.labelId}" @class=cem-autocomplete__label @part=label | {slot @name=label | {$label}}}
        {input @type=text @class=cem-autocomplete__control @part=control @role=combobox @value="{$datadom.slices.displayValue}" @placeholder="{$datadom.attributes.placeholder}" @autocomplete="{$datadom.attributes.autocomplete}" @aria-labelledby="{$datadom.slices.labelId}" @aria-autocomplete=list @aria-haspopup=listbox @aria-expanded="{$datadom.slices.expanded}" @aria-controls={if datadom.slices.expanded { datadom.slices.listboxId } else { null }} @aria-activedescendant={if datadom.slices.expanded &amp;&amp; datadom.slices.activeOptionId { datadom.slices.activeOptionId } else { null }} @disabled={if (seq:count(datadom.attributes.disabled) > 0) || datadom.slices.behaviorDisabled { true } else { null }} @readonly={if seq:count(datadom.attributes.readonly) > 0 {true} else {null}} @required={if seq:count(datadom.attributes.required) > 0 {true} else {null}} @data-state={if (seq:count(datadom.attributes.busy) > 0) { "loading" } else { null }} @aria-busy={if (seq:count(datadom.attributes.busy) > 0) { true } else { null }} @aria-invalid={if seq:count(datadom.attributes.invalid) > 0 {true} else {null}} @aria-describedby={datadom.attributes.describedby} @aria-errormessage={datadom.attributes.error} | }
        {cem:if @test="datadom.slices.expanded" |
        {div @id="{$datadom.slices.listboxId}" @class=cem-autocomplete__popup @part=popup @role=listbox @aria-labelledby="{$datadom.slices.labelId}" |
        {call @template=autocomplete-options @with:groups="{$datadom.slices.groups}"}}}
        {span @class=cem-autocomplete__help @part=help | {slot @name=help}}
        }
      }
    }
  </template>
</cem-element>
