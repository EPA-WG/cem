<cem-gallery-page heading="cem-recovery-status: Full examples and variation matrix"><template><p>Advisory recovery metadata with an accessible disclosure. Use <a href="./cem-alert-gallery.html">cem-alert</a> for application feedback and <a href="./cem-progress-gallery.html">cem-progress</a> for measured work. This component never reads credentials or starts recovery.</p><p><a href="./cem-recovery-status-gallery.html">Full examples and variation matrix</a> · <a href="./cem-recovery-status.html">Property playground</a> · <a href="https://github.com/EPA-WG/cem/blob/develop/packages/cem-components/src/components/cem-recovery-status/cem-recovery-status.stories.ts">Automated stories</a></p><main><table><caption>Public attributes</caption><thead><tr><th>Attribute</th><th>Contract</th></tr></thead><tbody><tr><th data-gallery-attribute="state">state</th><td>See the property playground and shared recovery status contract.</td></tr><tr><th data-gallery-attribute="reason">reason</th><td>See the property playground and shared recovery status contract.</td></tr><tr><th data-gallery-attribute="runtime-count">runtime-count</th><td>Nonnegative integer, default 0.</td></tr><tr><th data-gallery-attribute="owner-count">owner-count</th><td>Nonnegative integer, default 0.</td></tr><tr><th data-gallery-attribute="acknowledged-count">acknowledged-count</th><td>Nonnegative integer, default 0.</td></tr><tr><th data-gallery-attribute="admission-count">admission-count</th><td>Nonnegative integer, default 0.</td></tr><tr><th data-gallery-attribute="unknown-operation-count">unknown-operation-count</th><td>Nonnegative integer, default 0.</td></tr><tr><th data-gallery-attribute="unsupported-owner-count">unsupported-owner-count</th><td>Nonnegative integer, default 0.</td></tr><tr><th data-gallery-attribute="label">label</th><td>See the property playground and shared recovery status contract.</td></tr><tr><th data-gallery-attribute="aria-label">aria-label</th><td>See the property playground and shared recovery status contract.</td></tr><tr><th data-gallery-attribute="dir">dir</th><td>See the property playground and shared recovery status contract.</td></tr><tr><th data-gallery-attribute="hidden">hidden</th><td>See the property playground and shared recovery status contract.</td></tr><tr><th data-gallery-attribute="class">class</th><td>See the property playground and shared recovery status contract.</td></tr></tbody></table><p>Public attributes: state (unconfigured by default), reason (not-configured by default), runtime-count, owner-count, acknowledged-count, admission-count, unknown-operation-count, unsupported-owner-count (all 0 by default), label (Recovery), aria-label, dir and hidden. The default slot replaces label. Counts and publications do not establish privacy eligibility, complete physical runtime coverage or a current checkpoint. Entered passwords and one-time codes continue to block recovery.</p><cem-demo-element legend="unconfigured · not-configured" description="Simulated metadata only; this example never grants checkpoint consent or recovery authority."><template><cem-recovery-status state="unconfigured" reason="not-configured" runtime-count="3" owner-count="5" acknowledged-count="4" admission-count="1" unknown-operation-count="1" unsupported-owner-count="1"></cem-recovery-status></template></cem-demo-element>
