<cem-gallery-page id="playground-theme" heading="cem-datepicker: Full examples and variation matrix">
<template><p class="component-description">A single-date calendar around your native text input. The input owns labels, validation, reset and form submission; the modal calendar drafts a date until Apply. Use <a href="./cem-field-gallery.html">cem-field</a> for general text and <a href="./cem-autocomplete-gallery.html">cem-autocomplete</a> for suggested values.</p><p><a href="./cem-datepicker-gallery.html">Full examples and variation matrix</a> · <a href="./cem-datepicker.html">Property playground</a> · <a href="https://github.com/EPA-WG/cem/blob/develop/packages/cem-components/src/components/cem-datepicker/cem-datepicker.stories.ts">Automated stories</a></p><main><h2>Public attributes and slots</h2><ul><li data-gallery-attribute="class"><code>class</code> — native host classes.</li><li data-gallery-attribute="min"><code>min</code></li><li data-gallery-attribute="max"><code>max</code></li><li data-gallery-attribute="lang"><code>lang</code></li><li data-gallery-attribute="indicator"><code>indicator</code></li><li data-gallery-attribute="disabled"><code>disabled</code></li><li data-gallery-attribute="required"><code>required</code></li><li data-gallery-attribute="invalid"><code>invalid</code></li><li data-gallery-attribute="hidden"><code>hidden</code></li><li data-gallery-attribute="dir"><code>dir</code></li></ul><p>min/max default to 0001-01-01 and 9999-12-31. disabled, required and invalid use presence, including empty and false. lang controls labels and week order. Indicator defaults to underline; outline is supported. hidden and dir retain native semantics. The input slot requires exactly one native text input; toggle is one optional native button with type=button. Input name, form, value/defaultValue, autocomplete and accessible relationships stay native. The host expanded property silently opens or closes the calendar.</p><p>No date range, date filter, date-time object or locale parsing adapter is provided. Calendar dates are canonical YYYY-MM-DD. Try pointer hover, keyboard focus, arrows, month/year movement and draft/Apply; current date and selection keep separate indicators.</p><section data-gallery-theme="light" class="cem-theme-light"><h2>light</h2><cem-datepicker ><input slot="input" type="text" aria-label="Default" value="2026-08-11" ><button slot="toggle" type="button" aria-label="Choose default">Choose</button></cem-datepicker><cem-datepicker required><input slot="input" type="text" aria-label="Required" value="2026-08-11" ><button slot="toggle" type="button" aria-label="Choose required">Choose</button></cem-datepicker><cem-datepicker disabled><input slot="input" type="text" aria-label="Disabled" value="2026-08-11" ><button slot="toggle" type="button" aria-label="Choose disabled">Choose</button></cem-datepicker><cem-datepicker invalid><input slot="input" type="text" aria-label="Invalid" value="2026-08-11" ><button slot="toggle" type="button" aria-label="Choose invalid">Choose</button></cem-datepicker><cem-datepicker indicator="outline"><input slot="input" type="text" aria-label="Outline" value="2026-08-11" ><button slot="toggle" type="button" aria-label="Choose outline">Choose</button></cem-datepicker></section>

<cem-demo-element id="forms" legend="Native forms and reset" description="The exact text input submits the canonical value; Apply dispatches input then change. Reset restores the authored date."><template slot="source"><form><cem-datepicker min="2026-01-01" max="2027-12-31" required lang="en-US"><input slot="input" type="text" aria-label="Arrival" value="2026-08-11" name="arrival"><button slot="toggle" type="button" aria-label="Choose arrival">Choose</button></cem-datepicker><cem-action type="reset" label="Reset arrival"></cem-action></form></template></cem-demo-element>
<cem-demo-element id="external" legend="External form ownership" description="The projected input can belong to an external form; its reset restores the date."><template slot="source"><form id="external-date-form"><cem-action type="reset" label="Reset external booking"></cem-action></form><cem-datepicker ><input slot="input" type="text" aria-label="External booking" value="2026-08-11" name="external" form="external-date-form"><button slot="toggle" type="button" aria-label="Choose external booking">Choose</button></cem-datepicker></template></cem-demo-element>
<cem-demo-element id="localization" legend="Localized calendar" description="French labels and week ordering preserve the canonical submitted date."><template slot="source"><cem-datepicker lang="fr-FR" min="2026-12-01" max="2026-12-31"><input slot="input" type="text" aria-label="Date de départ" value="2026-12-24" ><button slot="toggle" type="button" aria-label="Choose date de départ">Choose</button></cem-datepicker></template></cem-demo-element>
<cem-demo-element id="keyboard" legend="Keyboard without a toggle" description="Focus the input and press ArrowDown. Cancelled drafts never replace its value."><template slot="source"><cem-datepicker ><input slot="input" type="text" aria-label="Keyboard date" value="2026-08-11" ></cem-datepicker></template></cem-demo-element>
<cem-demo-element id="presence" legend="Boolean presence and host options" description="Empty and false mean present. RTL, hidden and indicator fallback use native contracts."><template slot="source"><cem-datepicker required="false"><input slot="input" type="text" aria-label="Present required" value="2026-08-11" ><button slot="toggle" type="button" aria-label="Choose present required">Choose</button></cem-datepicker><cem-datepicker disabled="false"><input slot="input" type="text" aria-label="Present disabled" value="2026-08-11" ><button slot="toggle" type="button" aria-label="Choose present disabled">Choose</button></cem-datepicker><cem-datepicker invalid="false"><input slot="input" type="text" aria-label="Present invalid" value="2026-08-11" ><button slot="toggle" type="button" aria-label="Choose present invalid">Choose</button></cem-datepicker><cem-datepicker dir="rtl"><input slot="input" type="text" aria-label="RTL date" value="2026-08-11" ><button slot="toggle" type="button" aria-label="Choose rtl date">Choose</button></cem-datepicker><cem-datepicker hidden><input slot="input" type="text" aria-label="Hidden date" value="2026-08-11" ><button slot="toggle" type="button" aria-label="Choose hidden date">Choose</button></cem-datepicker><cem-datepicker indicator="unsupported"><input slot="input" type="text" aria-label="Indicator fallback" value="2026-08-11" ><button slot="toggle" type="button" aria-label="Choose indicator fallback">Choose</button></cem-datepicker></template></cem-demo-element>
