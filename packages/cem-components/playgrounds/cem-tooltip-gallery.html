<p><a href="./cem-tooltip.html">Property playground</a> · <a href="https://github.com/EPA-WG/cem/blob/develop/packages/cem-components/src/components/cem-tooltip/cem-tooltip.stories.ts">Automated stories</a></p><main><h2>Public attributes and slots</h2><ul><li data-gallery-attribute="trigger-for"><code>trigger-for</code></li><li data-gallery-attribute="show-delay"><code>show-delay</code></li><li data-gallery-attribute="hide-delay"><code>hide-delay</code></li><li data-gallery-attribute="placement"><code>placement</code></li><li data-gallery-attribute="anchor"><code>anchor</code></li><li data-gallery-attribute="boundary"><code>boundary</code></li><li data-gallery-attribute="fallback"><code>fallback</code></li><li data-gallery-attribute="overflow"><code>overflow</code></li><li data-gallery-attribute="anchor-lost"><code>anchor-lost</code></li><li data-gallery-attribute="surface-id"><code>surface-id</code></li><li data-gallery-attribute="hidden"><code>hidden</code></li><li data-gallery-attribute="class"><code>class</code></li><li data-gallery-attribute="dir"><code>dir</code></li><li data-gallery-attribute="message"><code>message</code></li><li data-gallery-attribute="disabled"><code>disabled</code></li><li data-gallery-attribute="default-open"><code>default-open</code></li></ul><p>Slots: <code>trigger</code> supplies one native control or control provider; <code>label</code> replaces visible fallback text. Tooltip descriptions remain noninteractive.</p><p>Use Tab, Escape, pointer hover and native button activation. Five fixed theme rows compare supported states. Dialog modality is explicit; tooltip hover delays apply only to pointer interest. Disabled flags use presence, including the text false. Unsupported invalid, readonly and selected task states are not synthesized.</p><section data-gallery-theme="light" class="cem-theme-light"><h2>light</h2><cem-tooltip message="Default supplemental help" show-delay="0"><button type="button" slot="trigger">Default</button></cem-tooltip> <cem-tooltip message="Disabled supplemental help" disabled><button type="button" slot="trigger">Disabled</button></cem-tooltip> <cem-tooltip message="Delayed supplemental help" show-delay="500"><button type="button" slot="trigger">Delayed</button></cem-tooltip> </section><section data-gallery-theme="dark" class="cem-theme-dark"><h2>dark</h2><cem-tooltip message="Default supplemental help" show-delay="0"><button type="button" slot="trigger">Default</button></cem-tooltip> <cem-tooltip message="Disabled supplemental help" disabled><button type="button" slot="trigger">Disabled</button></cem-tooltip> <cem-tooltip message="Delayed supplemental help" show-delay="500"><button type="button" slot="trigger">Delayed</button></cem-tooltip> </section><section data-gallery-theme="contrast-light" class="cem-theme-contrast-light"><h2>contrast-light</h2><cem-tooltip message="Default supplemental help" show-delay="0"><button type="button" slot="trigger">Default</button></cem-tooltip> <cem-tooltip message="Disabled supplemental help" disabled><button type="button" slot="trigger">Disabled</button></cem-tooltip> <cem-tooltip message="Delayed supplemental help" show-delay="500"><button type="button" slot="trigger">Delayed</button></cem-tooltip> </section><section data-gallery-theme="contrast-dark" class="cem-theme-contrast-dark"><h2>contrast-dark</h2><cem-tooltip message="Default supplemental help" show-delay="0"><button type="button" slot="trigger">Default</button></cem-tooltip> <cem-tooltip message="Disabled supplemental help" disabled><button type="button" slot="trigger">Disabled</button></cem-tooltip> <cem-tooltip message="Delayed supplemental help" show-delay="500"><button type="button" slot="trigger">Delayed</button></cem-tooltip> </section><section data-gallery-theme="native" class="cem-theme-native"><h2>native</h2><cem-tooltip message="Default supplemental help" show-delay="0"><button type="button" slot="trigger">Default</button></cem-tooltip> <cem-tooltip message="Disabled supplemental help" disabled><button type="button" slot="trigger">Disabled</button></cem-tooltip> <cem-tooltip message="Delayed supplemental help" show-delay="500"><button type="button" slot="trigger">Delayed</button></cem-tooltip> </section><cem-demo-element legend="Visible fallback and projected description" description="Message is plain text; the label slot replaces it without changing the native trigger name."><template slot="source"><cem-tooltip message="Save changes" show-delay="0"><button slot="trigger" type="button">Save</button></cem-tooltip><cem-tooltip message="Fallback" show-delay="0"><button slot="trigger" type="button" aria-label="Account details">Account</button><strong slot="label">Projected account help</strong></cem-tooltip></template></cem-demo-element>
