        body {

            grid-template-columns: minmax(0, 1fr) minmax(0, 2fr);

<cem-gallery-page id="playground-theme" heading="cem-dropdown: Full examples and variation matrix">
<template>

    <p class="component-description">A trigger and positioned panel for arbitrary content. Compose <a
        href="./cem-menu-gallery.html">cem-menu</a> and <a href="./cem-menu-item-gallery.html">cem-menu-item</a> inside
        the panel for nested command navigation; use <a href="./cem-select-gallery.html">cem-select</a> for value
        selection.</p>
    <p><a href="./cem-dropdown.html">Property playground</a> · <a
        href="https://github.com/EPA-WG/cem/blob/develop/packages/cem-components/src/components/cem-dropdown/cem-dropdown.stories.ts">Automated
        stories</a></p>
    <main><h2>Public attributes and slots</h2>
        <ul>
            <li data-gallery-attribute="label"><code>label</code></li>
            <li data-gallery-attribute="open"><code>open</code></li>
            <li data-gallery-attribute="disabled"><code>disabled</code></li>
            <li data-gallery-attribute="aria-label"><code>aria-label</code></li>
            <li data-gallery-attribute="hidden"><code>hidden</code></li>
            <li data-gallery-attribute="class"><code>class</code></li>
            <li data-gallery-attribute="dir"><code>dir</code></li>
        </ul>
        <p><code>label</code> supplies fallback trigger text (Dropdown). <code>open="false"</code> closes the panel;
            other values open it, preserving source visibility semantics (default true). <code>disabled</code> and
            <code>hidden</code> use presence. <code>aria-label</code> names the fallback trigger separately.
            <code>class</code> and <code>dir</code> are supported. The <code>base</code> slot replaces the trigger; the
            default slot supplies panel content.</p>
        <p>Use native click, Enter or Space to toggle, ArrowDown to open and focus, Escape to close and restore focus.
            Tab and outside activation dismiss without a trap. Menu leaf activation dismisses the complete popup chain.
            Exercise real hover, press, keyboard focus and expansion. Each example includes five horizontal-rule
            siblings: an open panel paints over them, and closing it reveals the same rules underneath.</p>
