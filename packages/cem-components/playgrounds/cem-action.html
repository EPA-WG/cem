<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>cem-action — property playground</title>
    <script type="importmap">{
    "imports": {
        "@epa-wg/cem-elements": "../../cem-elements/dist/index.js",
        "@epa-wg/cem-components": "../dist/lib/primitives.js",
        "@epa-wg/cem-demo-element": "../../cem-demo-element/dist/index.js",
        "@epa-wg/cem-ml/wasm": "../../cem-ml-npm/dist/wasm/browser/cem_ml.js",
        "@epa-wg/cem-theme/styles.css": "../../cem-theme/dist/lib/css/cem-combined.css",
        "@epa-wg/cem-components/styles.css": "../dist/styles.css",
        "@epa-wg/cem-components/components/cem-action": "../src/components/cem-action/cem-action.xhtml",
        "@epa-wg/cem-components/action-demo": "../../custom-element/material/components/action.html",
        "@epa-wg/cem-components/action-playground": "./cem-action.html",
        "@epa-wg/cem-components/components/cem-theme-switch": "../src/components/cem-theme-switch/cem-theme-switch.xhtml",
        "@epa-wg/cem-components/theme-switch-playground": "./cem-theme-switch.html"
    }
}</script>
    <script type="module">
        import { installCemElementRuntime } from '@epa-wg/cem-elements';
        import { installCemComponentPrimitives } from '@epa-wg/cem-components';
        import '@epa-wg/cem-demo-element';
        await installCemComponentPrimitives(installCemElementRuntime(window));
    </script>
    <style>
        body { margin: 0; font-family: system-ui, sans-serif; }
        #playground-theme { box-sizing: border-box; min-block-size: 100vh; padding: var(--cem-dim-large); }
        main { display: block; }
        .workspace { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 2fr); gap: var(--cem-dim-large); }
        .properties { display: grid; gap: var(--cem-dim-medium); align-content: start; }
        .workspace > section:last-child { position: sticky; top: var(--cem-dim-medium); align-self: start; }
        .property-group { min-inline-size: 0; margin: 0; padding: 0; border: 0; }
        .property-group > legend { padding: 0; margin-block-end: var(--cem-dim-small); font-weight: bold; }
        .property-options { display: flex; flex-wrap: wrap; gap: var(--cem-dim-small); }
        .dimension-examples { display: grid; gap: max(var(--cem-dim-medium), var(--cem-coupling-guard-min)); }
        .dimension-examples .stretch { display: flex; min-block-size: 8rem; }
        .dimension-examples .stretch > cem-action { flex: 1; }
        .preview { padding: var(--cem-dim-large); border: var(--cem-stroke-boundary) solid currentColor; }
        cem-demo-element { display: block; margin-block: var(--cem-dim-large); }
        @media (max-width: 700px) { .workspace { grid-template-columns: 1fr; } .workspace > section:last-child { position: static; } }
    </style>
</head>
<body>
<cem-element hidden>
<template type="text/cem-ml">
{cem-module-url @slice=themeSwitchUrl @src="@epa-wg/cem-components/components/cem-theme-switch"}
{cem:if @test="datadom.slices.themeSwitchUrl" | {cem-element @tag=cem-theme-switch @src="{$datadom.slices.themeSwitchUrl}#cem-theme-switch"}}
{cem-module-url @slice=actionUrl @src="@epa-wg/cem-components/components/cem-action"}
{cem-module-url @slice=themeUrl @src="@epa-wg/cem-theme/styles.css"}
{cem-module-url @slice=stylesUrl @src="@epa-wg/cem-components/styles.css"}
{cem:if @test="datadom.slices.actionUrl" | {cem-element @tag=cem-action @src="{$datadom.slices.actionUrl}#cem-action"}}
{cem:if @test="datadom.slices.themeUrl" | {link @rel=stylesheet @href="{$datadom.slices.themeUrl}"}}
{cem:if @test="datadom.slices.stylesUrl" | {link @rel=stylesheet @href="{$datadom.slices.stylesUrl}"}}
</template>
</cem-element>

<cem-theme-switch id="playground-theme" mode="light" name="playground-theme-mode">
<header><h1><code>cem-action</code> playground</h1>
<p>Change the properties to try one live action. The source panel shows the production definition.</p>
<cem-element>
<template type="text/cem-ml">
{cem-module-url @slice=demoUrl @src="@epa-wg/cem-components/action-demo"}
{cem:if @test="datadom.slices.demoUrl" | {p | {a @href="{$datadom.slices.demoUrl}" | Full examples and variation matrix (legacy gallery)}}}
</template>
</cem-element>
</header>

<main>
<cem-element>
<template type="text/cem-ml">
{slice @name=intent | primary}
{slice @name=bend | smooth}
{slice @name=size | undefined}
{slice @name=type | button}
{slice @name=disabled | false}
{slice @name=loading | false}
{slice @name=expanded | unset}
{slice @name=label | Save changes}
{div @class=workspace |
    {section @class=properties @aria-label="Action properties" |
        {h2 | Properties}
        {cem-field @label="Label" @value="{$datadom.slices.label}" @slice=label @slice-event=input @slice-value="$target.value"}
{fieldset @class=property-group @role=radiogroup @aria-labelledby=action-property-intent @slice=intent @slice-event=change @slice-value="$target.value" |
    {legend @id=action-property-intent | Intent}
    {div @class=property-options |
            {cem-radio @name=action-property-intent @value="primary" @checked=true | Primary}
            {cem-radio @name=action-property-intent @value="explicit" | Explicit}
            {cem-radio @name=action-property-intent @value="contextual" | Contextual}
            {cem-radio @name=action-property-intent @value="alternate" | Alternate}
            {cem-radio @name=action-property-intent @value="destructive" | Destructive}
    }
}
{fieldset @class=property-group @role=radiogroup @aria-labelledby=action-property-bend @slice=bend @slice-event=change @slice-value="$target.value" |
    {legend @id=action-property-bend | Bend}
    {div @class=property-options |
            {cem-radio @name=action-property-bend @value="sharp" | Sharp}
            {cem-radio @name=action-property-bend @value="smooth" @checked=true | Smooth}
            {cem-radio @name=action-property-bend @value="round" | Round}
    }
}
{fieldset @class=property-group @role=radiogroup @aria-labelledby=action-property-size @slice=size @slice-event=change @slice-value="$target.value" |
    {legend @id=action-property-size | Size}
    {div @class=property-options |
        {cem-radio @name=action-property-size @value=undefined @checked=true | Undefined}
        {cem-radio @name=action-property-size @value=small | Small}
        {cem-radio @name=action-property-size @value=medium | Medium}
        {cem-radio @name=action-property-size @value=large | Large}
        {cem-radio @name=action-property-size @value=x-large | X-large}
    }
}
{fieldset @class=property-group @role=radiogroup @aria-labelledby=action-property-type @slice=type @slice-event=change @slice-value="$target.value" |
    {legend @id=action-property-type | Button type}
    {div @class=property-options |
            {cem-radio @name=action-property-type @value="button" @checked=true | Button}
            {cem-radio @name=action-property-type @value="submit" | Submit}
            {cem-radio @name=action-property-type @value="reset" | Reset}
    }
}
{fieldset @class=property-group @role=radiogroup @aria-labelledby=action-property-disabled @slice=disabled @slice-event=change @slice-value="$target.value" |
    {legend @id=action-property-disabled | Disabled}
    {div @class=property-options |
            {cem-radio @name=action-property-disabled @value="false" @checked=true | False}
            {cem-radio @name=action-property-disabled @value="true" | True}
    }
}
{fieldset @class=property-group @role=radiogroup @aria-labelledby=action-property-loading @slice=loading @slice-event=change @slice-value="$target.value" |
    {legend @id=action-property-loading | Loading}
    {div @class=property-options |
            {cem-radio @name=action-property-loading @value="false" @checked=true | False}
            {cem-radio @name=action-property-loading @value="true" | True}
    }
}
{fieldset @class=property-group @role=radiogroup @aria-labelledby=action-property-expanded @slice=expanded @slice-event=change @slice-value="$target.value" |
    {legend @id=action-property-expanded | Expanded}
    {div @class=property-options |
            {cem-radio @name=action-property-expanded @value="unset" @checked=true | Unset}
            {cem-radio @name=action-property-expanded @value="false" | False}
            {cem-radio @name=action-property-expanded @value="true" | True}
    }
}
    }
    {section @aria-label="Action preview" |
        {h2 | Preview}
        {div @class=preview |
            {cem-action @id=action-preview @size={if datadom.slices.size == "undefined" { null } else { datadom.slices.size }} @label="{$datadom.slices.label}" @variant="{$datadom.slices.intent}" @class="cem-bend-{$datadom.slices.bend}" @type="{$datadom.slices.type}" @disabled={if datadom.slices.disabled == "true" { true } else { null }} @loading="{$datadom.slices.loading}" @expanded={if datadom.slices.expanded == "unset" { null } else { datadom.slices.expanded }} }
        }
        {p | Hover to see hover paint. Hold the pointer or Space for active paint. Use Tab to inspect keyboard focus. Disabled actions cannot be focused or activated.}
        {p | Set Loading to True to show a continuously moving 45-degree gradient in the selected intent's pending colors. Each loop takes two seconds. Contrast modes keep the background at the surface color and animate a zebra outline instead. Hover and keyboard focus keep the loop running; zebra still marks focus. Set Loading to False to stop it and restore normal interaction colors. Disabled actions keep the pending indicator while loading but cannot be activated or focused. Reduced-motion settings freeze the pending indicator; forced colors use a static pending boundary.}
        {p | Size sets a minimum visible height: small 2.5rem, medium 3rem, large 4rem, x-large 6rem. Undefined removes the size attribute and inherits the container or theme. Compact actions reserve a transparent hit border inside a minimum 3rem target; larger profiles need no extra hit border. Content and layout can enlarge the control.}
        {p | Submit and reset can be inspected here; this preview is outside a form. Form behavior is covered in the automated stories.}
        {p | {a @href="https://github.com/EPA-WG/cem/blob/develop/packages/cem-components/src/components/cem-action/cem-action.stories.ts" | Automated stories}}
    }
}
</template>
</cem-element>
<section class="dimension-examples" aria-label="Action dimension examples">
<h2>Dimensions in layouts</h2>
<div><cem-action size="small">Content-sized action</cem-action></div>
<div data-cem-size="large"><cem-action>Inherited large action</cem-action></div>
<div class="stretch"><cem-action size="x-large">Container-stretched action</cem-action></div>
</section>
<cem-element>
<template type="text/cem-ml">
{cem-module-url @slice=sourceUrl @src="@epa-wg/cem-components/components/cem-action"}
{cem:if @test="datadom.slices.sourceUrl" |
    {p | {a @href="{$datadom.slices.sourceUrl}" | Open canonical XHTML}}
    {cem-demo-element @legend="Canonical action source" @src="{$datadom.slices.sourceUrl}" @type=xml @demo=false}
}
</template>
</cem-element>
</main>
</cem-theme-switch>
</body>
</html>
