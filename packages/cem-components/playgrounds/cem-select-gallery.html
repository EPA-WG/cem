<cem-gallery-page id="playground-theme" heading="cem-select: Full examples and variation matrix">
<template>

<header>
<p class="component-description">A choice control supporting dropdowns, single or multiple listboxes, and grouped options. Use it for predefined choices alongside free-text controls such as <a href="./cem-field-gallery.html"><code>cem-field</code></a> and <a href="./cem-text-field-gallery.html"><code>cem-text-field</code></a>.</p>
<p><a href="./cem-select.html">Property playground</a> · <a href="https://github.com/EPA-WG/cem/blob/develop/packages/cem-components/src/components/cem-select/cem-select.stories.ts">Automated stories</a></p></header><main>
<style>[data-gallery-theme] { padding: var(--cem-dim-large); background-color: var(--cem-palette-comfort); color: var(--cem-palette-comfort-text); } .examples { display: grid; gap: var(--cem-dim-large); grid-template-columns: repeat(auto-fit, minmax(min(100%, 18rem), 1fr)); } cem-demo-element { display: block; margin-block: var(--cem-dim-large); }</style><p>Hover each enabled control, hold a pointer press, and use Tab for keyboard focus. States below are real component attributes. The five theme rows stay fixed so you can compare the same states side by side.</p>
<p>Open dropdowns with click or Arrow keys; Enter commits, Escape cancels. Multiple listboxes use Space or click to toggle choices. Disabled options are skipped. Public option and option-group payloads support selected, disabled, value, labels and rich content.</p><h2>Public attributes and slots</h2><ul><li data-gallery-attribute="label"><code>label</code></li>
<li data-gallery-attribute="name"><code>name</code></li>
<li data-gallery-attribute="value"><code>value</code></li>
<li data-gallery-attribute="placeholder"><code>placeholder</code></li>
<li data-gallery-attribute="required"><code>required</code></li>
<li data-gallery-attribute="disabled"><code>disabled</code></li>
<li data-gallery-attribute="multiple"><code>multiple</code></li>
<li data-gallery-attribute="size"><code>size</code></li>
<li data-gallery-attribute="indicator"><code>indicator</code></li>
<li data-gallery-attribute="busy"><code>busy</code></li>
<li data-gallery-attribute="invalid"><code>invalid</code></li>
<li data-gallery-attribute="describedby"><code>describedby</code></li>
<li data-gallery-attribute="error"><code>error</code></li>
<li data-gallery-attribute="hidden"><code>hidden</code></li>
<li data-gallery-attribute="class"><code>class</code></li></ul>
<p><strong>Slots:</strong> <code>label</code> replaces the label text; <code>help</code> supplies supporting content. Default payload contains <code>cem-option</code> and <code>cem-option-group</code> choices.</p>
<cem-demo-element legend="Label and help slots"><template slot="source">
<cem-select describedby="select-slot-help"><span slot="label">Review owner</span><span slot="help" id="select-slot-help">Choose a reviewer.</span><cem-option value="ada">Ada</cem-option><cem-option value="grace">Grace</cem-option></cem-select>
</template></cem-demo-element>
<cem-demo-element legend="Grouped rich choices"><template slot="source">
<cem-select label="Reviewer"><cem-option-group label="Engineering"><cem-option value="ada" selected><strong>Ada</strong> Lovelace</cem-option><cem-option value="grace">Grace Hopper</cem-option></cem-option-group><cem-option-group label="Unavailable" disabled><cem-option value="former">Former reviewer</cem-option></cem-option-group></cem-select>
</template></cem-demo-element>
<cem-demo-element legend="Single and multiple listboxes"><template slot="source">
<cem-select label="Priority" size="4" indicator="outline" ><cem-option value="ada" selected>Ada</cem-option><cem-option value="grace">Grace</cem-option><cem-option value="unavailable" disabled>Unavailable</cem-option></cem-select><cem-select label="Channels" multiple size="4" ><cem-option value="ada" selected>Ada</cem-option><cem-option value="grace">Grace</cem-option><cem-option value="unavailable" disabled>Unavailable</cem-option></cem-select>
</template></cem-demo-element>
<cem-demo-element legend="Form owner and reset"><template slot="source">
<form method="get" target="_blank"><cem-select label="Reviewer" name="reviewer" required ><cem-option value="ada" selected>Ada</cem-option><cem-option value="grace">Grace</cem-option><cem-option value="unavailable" disabled>Unavailable</cem-option></cem-select><cem-action type="submit">Submit</cem-action><cem-action type="reset">Reset</cem-action></form>
</template></cem-demo-element>
<cem-demo-element legend="Placeholder and validation"><template slot="source">
<cem-select label="Unselected" value="missing" placeholder="Choose a reviewer" invalid="true" describedby="select-help" error="select-error" ><cem-option value="ada" selected>Ada</cem-option><cem-option value="grace">Grace</cem-option><cem-option value="unavailable" disabled>Unavailable</cem-option></cem-select><p id="select-help">Choose one reviewer.</p><p id="select-error">A reviewer is required.</p>
</template></cem-demo-element>
<cem-demo-element legend="Value and presence"><template slot="source">
<cem-select label="Grace selected" value="grace" class="consumer-select" ><cem-option value="ada" selected>Ada</cem-option><cem-option value="grace">Grace</cem-option><cem-option value="unavailable" disabled>Unavailable</cem-option></cem-select><cem-select label="Disabled by presence" disabled="false" ><cem-option value="ada" selected>Ada</cem-option><cem-option value="grace">Grace</cem-option><cem-option value="unavailable" disabled>Unavailable</cem-option></cem-select><cem-select hidden="false" ><cem-option value="ada" selected>Ada</cem-option><cem-option value="grace">Grace</cem-option><cem-option value="unavailable" disabled>Unavailable</cem-option></cem-select>
</template></cem-demo-element>
