<cem-gallery-page heading="cem-source-editor: Full examples and variation matrix"><template><p class="component-description">A plain-text source editor using the browser's contenteditable="plaintext-only" editing surface. It keeps text, caret, native undo and composition through updates. Use <a href="./cem-textarea-gallery.html">cem-textarea</a> for submitted form values and <a href="./cem-workspace-gallery.html">cem-workspace</a> for an IDE layout. Source text is never executed or inserted as HTML.</p><p><a href="./cem-source-editor-gallery.html">Full examples and variation matrix</a> · <a href="./cem-source-editor.html">Property playground</a> · <a href="https://github.com/EPA-WG/cem/blob/develop/packages/cem-components/src/components/cem-source-editor/cem-source-editor.stories.ts">Automated stories</a></p><h2>Public attributes</h2><table><tbody><tr data-gallery-attribute="label"><th><code>label</code></th><td>Visible fallback label; default Source code.</td></tr><tr data-gallery-attribute="aria-label"><th><code>aria-label</code></th><td>Separate accessible textbox name.</td></tr><tr data-gallery-attribute="content-type"><th><code>content-type</code></th><td>Native source language; plain text by default. HTML, CEM-ML and CSS currently provide lossless coloring.</td></tr><tr data-gallery-attribute="highlight"><th><code>highlight</code></th><td>auto or off; paint is separate from source-changing formatting.</td></tr><tr data-gallery-attribute="source-id"><th><code>source-id</code></th><td>Optional project/resource identity; changes cancel pending paint.</td></tr><tr data-gallery-attribute="value"><th><code>value</code></th><td>Initial or controlled plain source text; .value updates silently.</td></tr><tr data-gallery-attribute="readonly"><th><code>readonly</code></th><td>Presence makes source selectable but not editable.</td></tr><tr data-gallery-attribute="disabled"><th><code>disabled</code></th><td>Presence prevents editing and removes the tab stop.</td></tr><tr data-gallery-attribute="fit"><th><code>fit</code></th><td>content or fill; fill needs a definite parent height.</td></tr><tr data-gallery-attribute="describedby"><th><code>describedby</code></th><td>ID of external help text.</td></tr><tr data-gallery-attribute="selection-request"><th><code>selection-request</code></th><td>Nonempty request identity; change to apply a range once.</td></tr><tr data-gallery-attribute="selection-start"><th><code>selection-start</code></th><td>Nonnegative UTF-16 start offset.</td></tr><tr data-gallery-attribute="selection-end"><th><code>selection-end</code></th><td>Nonnegative UTF-16 end offset.</td></tr><tr data-gallery-attribute="selection-direction"><th><code>selection-direction</code></th><td>none, forward or backward.</td></tr><tr data-gallery-attribute="selection-focus"><th><code>selection-focus</code></th><td>Presence explicitly focuses the requested range.</td></tr><tr data-gallery-attribute="hidden"><th><code>hidden</code></th><td>Native presence-based visibility.</td></tr><tr data-gallery-attribute="class"><th><code>class</code></th><td>Native host class and inherited token overrides.</td></tr><tr data-gallery-attribute="dir"><th><code>dir</code></th><td>Inherited ltr or rtl direction.</td></tr></tbody></table><p>Slots: label replaces the visible fallback with projected markup. The native editor has role=textbox and aria-multiline=true. This component is a document editor, not a form-associated control; use .value or declarative input bindings. Native semantic coloring is enabled with content-type=text/cem-ml, text/html or text/css. Coloring preserves source and native editing; highlight=off disables it. Other types stay plain.</p><main><section class="cem-theme-light" data-gallery-theme="light"><h2>light</h2><cem-demo-element legend="light editable source" description="Compare semantic source paint, control boundary and focus. Use native typing, paste, text selection and undo in the editable case."><template slot="source"><cem-source-editor label="view.cemt" content-type="text/cem-ml" value="{h1 | Hello}&#10;{p | Plain source}"></cem-source-editor></template></cem-demo-element><cem-demo-element legend="light readonly source" description="Compare semantic source paint, control boundary and focus. Use native typing, paste, text selection and undo in the editable case."><template slot="source"><cem-source-editor label="view.cemt" content-type="text/cem-ml" value="{h1 | Hello}&#10;{p | Plain source}" readonly></cem-source-editor></template></cem-demo-element><cem-demo-element legend="light disabled source" description="Compare semantic source paint, control boundary and focus. Use native typing, paste, text selection and undo in the editable case."><template slot="source"><cem-source-editor label="view.cemt" content-type="text/cem-ml" value="{h1 | Hello}&#10;{p | Plain source}" disabled></cem-source-editor></template></cem-demo-element></section><section class="cem-theme-dark" data-gallery-theme="dark"><h2>dark</h2><cem-demo-element legend="dark editable source" description="Compare semantic source paint, control boundary and focus. Use native typing, paste, text selection and undo in the editable case."><template slot="source"><cem-source-editor label="view.cemt" content-type="text/cem-ml" value="{h1 | Hello}&#10;{p | Plain source}"></cem-source-editor></template></cem-demo-element><cem-demo-element legend="dark readonly source" description="Compare semantic source paint, control boundary and focus. Use native typing, paste, text selection and undo in the editable case."><template slot="source"><cem-source-editor label="view.cemt" content-type="text/cem-ml" value="{h1 | Hello}&#10;{p | Plain source}" readonly></cem-source-editor></template></cem-demo-element><cem-demo-element legend="dark disabled source" description="Compare semantic source paint, control boundary and focus. Use native typing, paste, text selection and undo in the editable case."><template slot="source"><cem-source-editor label="view.cemt" content-type="text/cem-ml" value="{h1 | Hello}&#10;{p | Plain source}" disabled></cem-source-editor></template></cem-demo-element></section><section class="cem-theme-contrast-light" data-gallery-theme="contrast-light"><h2>contrast-light</h2><cem-demo-element legend="contrast-light editable source" description="Compare semantic source paint, control boundary and focus. Use native typing, paste, text selection and undo in the editable case."><template slot="source"><cem-source-editor label="view.cemt" content-type="text/cem-ml" value="{h1 | Hello}&#10;{p | Plain source}"></cem-source-editor></template></cem-demo-element><cem-demo-element legend="contrast-light readonly source" description="Compare semantic source paint, control boundary and focus. Use native typing, paste, text selection and undo in the editable case."><template slot="source"><cem-source-editor label="view.cemt" content-type="text/cem-ml" value="{h1 | Hello}&#10;{p | Plain source}" readonly></cem-source-editor></template></cem-demo-element><cem-demo-element legend="contrast-light disabled source" description="Compare semantic source paint, control boundary and focus. Use native typing, paste, text selection and undo in the editable case."><template slot="source"><cem-source-editor label="view.cemt" content-type="text/cem-ml" value="{h1 | Hello}&#10;{p | Plain source}" disabled></cem-source-editor></template></cem-demo-element></section><section class="cem-theme-contrast-dark" data-gallery-theme="contrast-dark"><h2>contrast-dark</h2><cem-demo-element legend="contrast-dark editable source" description="Compare semantic source paint, control boundary and focus. Use native typing, paste, text selection and undo in the editable case."><template slot="source"><cem-source-editor label="view.cemt" content-type="text/cem-ml" value="{h1 | Hello}&#10;{p | Plain source}"></cem-source-editor></template></cem-demo-element><cem-demo-element legend="contrast-dark readonly source" description="Compare semantic source paint, control boundary and focus. Use native typing, paste, text selection and undo in the editable case."><template slot="source"><cem-source-editor label="view.cemt" content-type="text/cem-ml" value="{h1 | Hello}&#10;{p | Plain source}" readonly></cem-source-editor></template></cem-demo-element><cem-demo-element legend="contrast-dark disabled source" description="Compare semantic source paint, control boundary and focus. Use native typing, paste, text selection and undo in the editable case."><template slot="source"><cem-source-editor label="view.cemt" content-type="text/cem-ml" value="{h1 | Hello}&#10;{p | Plain source}" disabled></cem-source-editor></template></cem-demo-element></section><section class="cem-theme-native" data-gallery-theme="native"><h2>native</h2><cem-demo-element legend="native editable source" description="Compare semantic source paint, control boundary and focus. Use native typing, paste, text selection and undo in the editable case."><template slot="source"><cem-source-editor label="view.cemt" content-type="text/cem-ml" value="{h1 | Hello}&#10;{p | Plain source}"></cem-source-editor></template></cem-demo-element><cem-demo-element legend="native readonly source" description="Compare semantic source paint, control boundary and focus. Use native typing, paste, text selection and undo in the editable case."><template slot="source"><cem-source-editor label="view.cemt" content-type="text/cem-ml" value="{h1 | Hello}&#10;{p | Plain source}" readonly></cem-source-editor></template></cem-demo-element><cem-demo-element legend="native disabled source" description="Compare semantic source paint, control boundary and focus. Use native typing, paste, text selection and undo in the editable case."><template slot="source"><cem-source-editor label="view.cemt" content-type="text/cem-ml" value="{h1 | Hello}&#10;{p | Plain source}" disabled></cem-source-editor></template></cem-demo-element></section><cem-demo-element legend="Projected label" description="Projected markup replaces the visible label; aria-label names the editor independently."><template slot="source"><cem-source-editor label="Fallback source" aria-label="Login template" value="&lt;form&gt;Sign in&lt;/form&gt;"><strong slot="label">templates/login.xhtml</strong></cem-source-editor></template></cem-demo-element>
<cem-demo-element legend="Bounded editor and source range" description="Fill a definite height. Change selection-request when navigating to a new source span; selection-focus is an explicit focus request."><template slot="source"><div style="block-size:40vb"><cem-source-editor fit="fill" label="Selected source" value="Select this text" selection-start="7" selection-end="11" selection-request="initial-range"></cem-source-editor></div></template></cem-demo-element>

<cem-demo-element legend="HTML with nested CSS" description="Native semantic roles paint the original text, including nested language regions. Typing and undo stay browser-owned."><template slot="source"><cem-source-editor label="index.html" content-type="text/html" source-id="index-html" value="&lt;style&gt;.card { color: red }&lt;/style&gt;&#10;&lt;p title=&quot;é😀&quot;&gt;Hello&lt;/p&gt;"></cem-source-editor></template></cem-demo-element>
