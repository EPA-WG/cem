<cem-gallery-page id="playground-theme" heading="cem-textarea: Full examples and variation matrix">
<template>

<header>
<p class="component-description">A labeled multiline text control with help content, validation, and borderless state indicators. It shares form behavior with <a href="./cem-text-field-gallery.html"><code>cem-text-field</code></a> and <a href="./cem-field-gallery.html"><code>cem-field</code></a>; use <a href="./cem-action-gallery.html"><code>cem-action</code></a> to submit or reset the form.</p>
<p><a href="./cem-textarea.html">Property playground</a> · <a href="https://github.com/EPA-WG/cem/blob/develop/packages/cem-components/src/components/cem-textarea/cem-textarea.stories.ts">Automated stories</a></p></header><main>
<style>[data-gallery-theme] { padding: var(--cem-dim-large); background-color: var(--cem-palette-comfort); color: var(--cem-palette-comfort-text); } .examples { display: grid; gap: var(--cem-dim-large); grid-template-columns: repeat(auto-fit, minmax(min(100%, 18rem), 1fr)); } cem-demo-element { display: block; margin-block: var(--cem-dim-large); }</style><p>Hover each enabled control, hold a pointer press, and use Tab for keyboard focus. States below are real component attributes. The five theme rows stay fixed so you can compare the same states side by side.</p>
<p>The textarea remains borderless. Enabled, unfocused controls keep a subtle resting indicator. Hover changes its color; focus adds a separate stripe. Busy preserves editing; disabled, readonly, required and busy use attribute presence, including the text false. Invalid is an ARIA string.</p><h2>Public attributes and slots</h2><ul><li data-gallery-attribute="label"><code>label</code></li>
<li data-gallery-attribute="fit"><code>fit</code>: content (default) or fill a definite parent</li>
<li data-gallery-attribute="rows"><code>rows</code></li>
<li data-gallery-attribute="cols"><code>cols</code></li>
<li data-gallery-attribute="minlength"><code>minlength</code></li>
<li data-gallery-attribute="maxlength"><code>maxlength</code></li>
<li data-gallery-attribute="autocomplete"><code>autocomplete</code></li>

<li data-gallery-attribute="selection-request"><code>selection-request</code></li>
<li data-gallery-attribute="selection-start"><code>selection-start</code></li>
<li data-gallery-attribute="selection-end"><code>selection-end</code></li>
<li data-gallery-attribute="selection-direction"><code>selection-direction</code></li>
<li data-gallery-attribute="selection-focus"><code>selection-focus</code></li>
<li data-gallery-attribute="value"><code>value</code></li>
<li data-gallery-attribute="name"><code>name</code></li>
<li data-gallery-attribute="form"><code>form</code></li>
<li data-gallery-attribute="placeholder"><code>placeholder</code></li>
<li data-gallery-attribute="disabled"><code>disabled</code></li>
<li data-gallery-attribute="required-marker"><code>required-marker</code></li>
<li data-gallery-attribute="required"><code>required</code></li>
<li data-gallery-attribute="readonly"><code>readonly</code></li>
<li data-gallery-attribute="busy"><code>busy</code></li>
<li data-gallery-attribute="invalid"><code>invalid</code></li>
<li data-gallery-attribute="describedby"><code>describedby</code></li>
<li data-gallery-attribute="error"><code>error</code></li>
<li data-gallery-attribute="indicator"><code>indicator</code></li>
<li data-gallery-attribute="hidden"><code>hidden</code></li>
<li data-gallery-attribute="class"><code>class</code></li></ul>
<p><strong>Slots:</strong> <code>label</code> replaces the label text; <code>required-marker</code> overrides the marker text/markup when required; <code>help</code> supplies supporting content.</p>
<cem-demo-element legend="Text selection requests" description="Offsets count UTF-16 code units. Change selection-request to issue a new range; selection-focus explicitly moves focus. Reusing a token never replays navigation on later renders. Disabled or composing editors ignore requests. This example selects text without moving focus."><template slot="source">
<cem-textarea label="Selected source" value="Select this source text" selection-request="initial-range" selection-start="7" selection-end="11"></cem-textarea>
</template></cem-demo-element>
<cem-demo-element legend="Custom required markers" description="Required-marker sets fallback text; the required-marker slot takes precedence and preserves markup. Without required, neither override displays. Native required semantics remain the same, and the decorative marker does not change the accessible name."><template slot="source">
<cem-textarea label="Text override" required required-marker="(required)"></cem-textarea>
<cem-textarea label="Slotted symbol" required>
  <strong slot="required-marker">✦</strong>
</cem-textarea>
<cem-textarea label="Slot override" required required-marker="Fallback"><strong slot="required-marker">✦</strong></cem-textarea>
<cem-textarea label="Optional field" required-marker="(required)"><strong slot="required-marker">✦</strong></cem-textarea>
</template></cem-demo-element>
<cem-demo-element legend="Required-field marker" description="Required fields show a star beside the label and participate in native validation. Required uses attribute presence, including required=false. The marker is independent of underline or outline. Remove required to clear both the star and the validation requirement."><template slot="source">
<cem-textarea label="Optional field"></cem-textarea>
<cem-textarea label="Required field" required indicator="underline"></cem-textarea>
<cem-textarea label="Required account" required indicator="outline"><span slot="label">Account name</span></cem-textarea>
<cem-textarea label="Required by presence" required="false"></cem-textarea>
</template></cem-demo-element>
<cem-demo-element legend="Indicator appearances" description="Indicator selects appearance: absent or underline uses a subtle filled background and bottom line; outline surrounds the control with a transparent background; unsupported values fall back to underline. Hover each enabled field and use Tab to compare focus. Required controls validation independently of indicator."><template slot="source">
<cem-textarea label="Default underline" value="Default appearance"></cem-textarea>
<cem-textarea label="Explicit underline" indicator="underline" value="Bottom boundary"></cem-textarea>
<cem-textarea label="Outline" indicator="outline" value="Full boundary"></cem-textarea>
<cem-textarea label="Unsupported appearance" indicator="unsupported" value="Falls back to underline"></cem-textarea>
</template></cem-demo-element>
<cem-demo-element legend="Label and help slots"><template slot="source">
<cem-textarea name="account" value="Draft" describedby="slot-help"><span slot="label">Notes</span><span slot="help" id="slot-help">Describe the requested changes.</span></cem-textarea>
</template></cem-demo-element>
<cem-demo-element legend="Form validation, submission and reset" type="cem-ml"><template slot="source">
{form @id=example-form @method=get @target=_blank |
    {cem-textarea @label=Notes @name=notes @required @value="First line&#10;Second line"}
    {cem-action @type=submit | Submit}
    {cem-action @type=reset | Reset}
}
{cem-textarea @form=example-form @label="External owner" @name=external @value=External}
</template></cem-demo-element>
<cem-demo-element legend="Multiline text, dimensions, and native constraints"><template slot="source">
<cem-textarea label="Notes" rows="4" cols="30" minlength="3" maxlength="120" autocomplete="off" placeholder="Enter several lines" value="First line&#10;Second line"></cem-textarea>
</template></cem-demo-element>
<cem-demo-element legend="Presence, hidden and consumer class" type="cem-ml"><template slot="source">
{cem-textarea @disabled=false @label="Disabled by presence"}
{cem-textarea @label="Readonly by presence" @readonly=false @value="Read me"}
{cem-textarea @busy=false @class=consumer-field @label="Required and busy by presence"
    @required=false}
{cem-textarea @hidden=false @label="Hidden by presence"}
</template></cem-demo-element>
<cem-demo-element legend="Validation message" type="cem-ml"><template slot="source">
{cem-textarea @describedby=validation-help @error=validation-error @invalid=true
    @label="Invalid entry"}
{p @id=validation-help | Check the account name.}
{p @id=validation-error | This name is unavailable.}
</template></cem-demo-element>
<cem-demo-element legend="Bounded editor" description="fit=fill reserves label/help space and fills the remaining panel; the native input and selection stay retained."><template slot="source"><div style="block-size:60vb"><cem-textarea fit="fill" label="Current file" value="{section | Editable source}"><span slot="help">Save explicitly</span></cem-textarea></div></template></cem-demo-element></main>
