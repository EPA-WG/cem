<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="https://fonts.googleapis.com/icon?family=Material+Icons">
    <link rel="stylesheet" href="https://use.fontawesome.com/releases/v5.15.4/css/all.css">
    <title>cem-icon-button — property playground</title>
    <script type="importmap">{
    "imports": {
        "@epa-wg/cem-elements": "../../cem-elements/dist/index.js",
        "@epa-wg/cem-components": "../dist/lib/primitives.js",
        "@epa-wg/cem-demo-element": "../../cem-demo-element/dist/index.js",
        "@epa-wg/cem-ml/wasm": "../../cem-ml-npm/dist/wasm/browser/cem_ml.js",
        "@epa-wg/cem-theme/styles.css": "../../cem-theme/dist/lib/css/cem-combined.css",
        "@epa-wg/cem-components/styles.css": "../dist/styles.css",
        "@epa-wg/cem-components/components/cem-action": "../src/components/cem-action/cem-action.xhtml",
        "@epa-wg/cem-components/action-demo": "./cem-action-gallery.html",
        "@epa-wg/cem-components/action-playground": "./cem-action.html",
        "@epa-wg/cem-components/components/cem-theme-switch": "../src/components/cem-theme-switch/cem-theme-switch.xhtml",
        "@epa-wg/cem-components/theme-switch-playground": "./cem-theme-switch.html",
        "@epa-wg/cem-components/components/cem-select": "../src/components/cem-select/cem-select.xhtml",
        "@epa-wg/cem-components/components/cem-icon-button": "../src/components/cem-icon-button/cem-icon-button.xhtml",
        "@epa-wg/cem-components/components/cem-menu-item": "../src/components/cem-menu-item/cem-menu-item.xhtml",
        "@epa-wg/cem-components/components/cem-field": "../src/components/cem-field/cem-field.xhtml",
        "@epa-wg/cem-components/components/cem-text-field": "../src/components/cem-text-field/cem-text-field.xhtml",
        "@epa-wg/cem-components/components/cem-icon": "../src/components/cem-icon/cem-icon.xhtml"
    }
}</script>
    <script type="module">
        import { installCemElementRuntime } from '@epa-wg/cem-elements';
        import { installCemComponentPrimitives } from '@epa-wg/cem-components';
        import '@epa-wg/cem-demo-element';
        const runtime = installCemElementRuntime(window);
        window.cemPlaygroundRuntime = runtime;
        await installCemComponentPrimitives(runtime);
    </script>
    <link rel="stylesheet" href="../demo.css">
    <style>
        body { margin: 0; font-family: system-ui, sans-serif; }
        #playground-theme { box-sizing: border-box; min-block-size: 100vh; padding: var(--cem-dim-large); }
        main { display: block; }
        .workspace { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 2fr); gap: var(--cem-dim-large); }
        .preview { padding: var(--cem-dim-large); border: var(--cem-stroke-boundary) solid currentColor; }
        .examples { display: grid; gap: var(--cem-dim-large); grid-template-columns: repeat(auto-fit, minmax(min(100%, 18rem), 1fr)); }
        .examples > article { min-inline-size: 0; }
        cem-demo-element { display: block; margin-block: var(--cem-dim-large); }
        @media (max-width: 700px) { .workspace { grid-template-columns: 1fr; } }
    </style>
</head>
<body>
<cem-element hidden>
<template type="text/cem-ml">
{cem-module-url @slice=cemfieldUrl @src="@epa-wg/cem-components/components/cem-field"}
{cem:if @test="datadom.slices.cemfieldUrl" | {cem-element @tag=cem-field @capability=form-control @src="{$datadom.slices.cemfieldUrl}#cem-field"}}
{cem-module-url @slice=cemtextfieldUrl @src="@epa-wg/cem-components/components/cem-text-field"}
{cem:if @test="datadom.slices.cemtextfieldUrl" | {cem-element @tag=cem-text-field @capability=form-control @src="{$datadom.slices.cemtextfieldUrl}#cem-text-field"}}
{cem-module-url @slice=themeSwitchUrl @src="@epa-wg/cem-components/components/cem-theme-switch"}
{cem:if @test="datadom.slices.themeSwitchUrl" | {cem-element @tag=cem-theme-switch @src="{$datadom.slices.themeSwitchUrl}#cem-theme-switch"}}
{cem-module-url @slice=commandUrl @src="@epa-wg/cem-components/components/cem-icon-button"}
{cem-module-url @slice=themeUrl @src="@epa-wg/cem-theme/styles.css"}
{cem-module-url @slice=stylesUrl @src="@epa-wg/cem-components/styles.css"}
{cem:if @test="datadom.slices.commandUrl" | {cem-element @tag=cem-icon-button @src="{$datadom.slices.commandUrl}#cem-icon-button"}}
{cem:if @test="datadom.slices.themeUrl" | {link @rel=stylesheet @href="{$datadom.slices.themeUrl}"}}
{cem:if @test="datadom.slices.stylesUrl" | {link @rel=stylesheet @href="{$datadom.slices.stylesUrl}"}}
</template>
</cem-element>

<cem-theme-switch id="playground-theme" mode="light" name="playground-theme-mode">
<header><h1>cem-icon-button playground</h1><p>Change every implemented attribute and inspect the production source.</p><p><a href="./cem-icon-button-gallery.html">Full examples and variation matrix</a> · <a href="https://github.com/EPA-WG/cem/blob/develop/packages/cem-components/src/components/cem-icon-button/cem-icon-button.stories.ts">Automated stories</a></p></header>
<main><cem-element><template type="text/cem-ml">
{slice @name=label | Run command}
{slice @name=disabled | absent}
{slice @name=expanded | absent}
{slice @name=hidden | absent}
{slice @name=class | custom-command}
{slice @name=name | settings}
{slice @name=variant | quiet}
{slice @name=href | }
{slice @name=icon | }
{slice @name=kind | normal}
{slice @name=direction | row}
{div @class=workspace | {section @class=properties @aria-label="Command properties" | {h2 | Properties}
{cem-field @label="label" @value="{$datadom.slices.label}" @slice=label @slice-event=input @slice-value="$target.value"}
{cem-field @label="class" @value="{$datadom.slices.class}" @slice=class @slice-event=input @slice-value="$target.value"}
{cem-field @label="name" @value="{$datadom.slices.name}" @slice=name @slice-event=input @slice-value="$target.value"}
{cem-field @label="variant" @value="{$datadom.slices.variant}" @slice=variant @slice-event=input @slice-value="$target.value"}
{cem-field @label="href" @value="{$datadom.slices.href}" @slice=href @slice-event=input @slice-value="$target.value"}
{cem-field @label="icon" @value="{$datadom.slices.icon}" @slice=icon @slice-event=input @slice-value="$target.value"}
{div @class=property-groups |
{fieldset @class=property-group @role=radiogroup @aria-labelledby=icon-button-direction @slice=direction @slice-event=change @slice-value="$target.value" | {legend @id=icon-button-direction | direction} {div @class=property-options |
{cem-radio @name=icon-button-direction @value=row @checked=true | row}
{cem-radio @name=icon-button-direction @value=column | column}
}}

{fieldset @class=property-group @role=radiogroup @aria-labelledby=icon-button-kind @slice=kind @slice-event=change @slice-value="$target.value" | {legend @id=icon-button-kind | kind} {div @class=property-options |
{cem-radio @name=icon-button-kind @value=normal @checked=true | normal}
{cem-radio @name=icon-button-kind @value=primary | primary}
{cem-radio @name=icon-button-kind @value=secondary | secondary}
{cem-radio @name=icon-button-kind @value=alert | alert}
{cem-radio @name=icon-button-kind @value=blend | blend}
}}

{fieldset @class=property-group @role=radiogroup @aria-labelledby=icon-button-disabled @slice=disabled @slice-event=change @slice-value="$target.value" | {legend @id=icon-button-disabled | disabled} {div @class=property-options |
{cem-radio @name=icon-button-disabled @value=absent @checked=true | absent}
{cem-radio @name=icon-button-disabled @value=false | false}
{cem-radio @name=icon-button-disabled @value=true | true}
}}
{fieldset @class=property-group @role=radiogroup @aria-labelledby=icon-button-expanded @slice=expanded @slice-event=change @slice-value="$target.value" | {legend @id=icon-button-expanded | expanded} {div @class=property-options |
{cem-radio @name=icon-button-expanded @value=absent @checked=true | absent}
{cem-radio @name=icon-button-expanded @value=false | false}
{cem-radio @name=icon-button-expanded @value=true | true}
}}
{fieldset @class=property-group @role=radiogroup @aria-labelledby=icon-button-hidden @slice=hidden @slice-event=change @slice-value="$target.value" | {legend @id=icon-button-hidden | hidden} {div @class=property-options |
{cem-radio @name=icon-button-hidden @value=absent @checked=true | absent}
{cem-radio @name=icon-button-hidden @value=false | false}
{cem-radio @name=icon-button-hidden @value=true | true}
}}
}} {section @aria-label="Command preview" | {h2 | Preview} {div @class=preview |
{cem-icon-button @id=command-preview @href={if datadom.slices.href { datadom.slices.href } else { null }} @icon={if datadom.slices.icon { datadom.slices.icon } else { null }} @kind="{$datadom.slices.kind}" @direction="{$datadom.slices.direction}" @label="{$datadom.slices.label}" @class="{$datadom.slices.class}" @name="{$datadom.slices.name}" @variant="{$datadom.slices.variant}" @disabled={if datadom.slices.disabled == "absent" { null } else { datadom.slices.disabled }} @expanded={if datadom.slices.expanded == "absent" { null } else { datadom.slices.expanded }} @hidden={if datadom.slices.hidden == "absent" { null } else { datadom.slices.hidden }}}
} {p | Clear href to return to button mode. Clear icon to use name; the examples below also show an explicitly empty icon.}
{p | Disabled and hidden use attribute presence, including the text false. Expanded reports a disclosure state; the command does not open a popup itself. A click records its event without toggling a persistent selection.}
{p | Href switches to native navigation. Icon accepts an image URL, Font Awesome classes or a Material icon name and overrides name. An empty icon hides it. Label names icon-only controls; link text supplies the name when label is absent. Kind is a legacy compatibility value; all kinds use primary link colors. Buttons keep contextual colors.}
}}
</template></cem-element>
<h2>Attribute inventory</h2><ul><li data-command-attribute="class"><code>class</code></li>
<li data-command-attribute="disabled"><code>disabled</code></li>
<li data-command-attribute="expanded"><code>expanded</code></li>
<li data-command-attribute="hidden"><code>hidden</code></li>
<li data-command-attribute="label"><code>label</code></li>
<li data-command-attribute="name"><code>name</code></li>
<li data-command-attribute="href"><code>href</code></li>
<li data-command-attribute="icon"><code>icon</code></li>
<li data-command-attribute="kind"><code>kind</code></li>
<li data-command-attribute="direction"><code>direction</code></li>
<li data-command-attribute="variant"><code>variant</code></li></ul>
<cem-demo-element legend="Legacy icon links" data-covers="href icon kind direction"><template slot="source">
<cem-icon-button id="legacy-link-material" href="#legacy-link-target" icon="recycling">Recycle</cem-icon-button>
<cem-icon-button id="legacy-link-font" href="#legacy-link-target" icon="fas fa-cloud-upload-alt" kind="primary">Upload</cem-icon-button>
<cem-icon-button id="legacy-link-image" href="#legacy-link-target" icon="data:image/svg+xml,%3Csvg%20xmlns=%22http://www.w3.org/2000/svg%22%20viewBox=%220%200%2024%2024%22%3E%3Cpath%20fill=%22%23007880%22%20d=%22M12%202%2022%2012%2012%2022%202%2012Z%22/%3E%3C/svg%3E" direction="column">Image link</cem-icon-button>
<cem-icon-button id="legacy-link-disabled" href="#legacy-link-target" icon="shopping_cart" disabled="false">Disabled link</cem-icon-button>
<cem-icon-button href="#legacy-link-target" icon="">Text-only link</cem-icon-button>
<cem-icon-button href="#legacy-link-target" icon="shopping_cart" label="Open cart"></cem-icon-button>
<div id="legacy-link-target">Link destination</div>
</template></cem-demo-element>
<cem-demo-element legend="All implemented attributes" data-covers="label disabled expanded hidden class name variant"><template slot="source">
<cem-icon-button id="command-default"></cem-icon-button>
<cem-icon-button id="command-configured" label="Configured command" class="consumer-command" expanded="false" name="settings" variant="quiet"></cem-icon-button>
<cem-icon-button id="command-disabled" label="Disabled by presence" disabled="false"></cem-icon-button>
<cem-icon-button id="command-expanded" label="Expanded command" expanded="true"></cem-icon-button>
<cem-icon-button id="command-hidden" label="Hidden by presence" hidden="false"></cem-icon-button>
<cem-icon-button id="command-content" label="Projected command"><span>Projected content</span></cem-icon-button>
</template></cem-demo-element>
<cem-element><template type="text/cem-ml">
{cem-module-url @slice=sourceUrl @src="@epa-wg/cem-components/components/cem-icon-button"}
{cem:if @test="datadom.slices.sourceUrl" |
 {p | {a @href="{$datadom.slices.sourceUrl}" | Canonical XHTML}}
 {cem-demo-element @legend="Canonical icon-button source" @src="{$datadom.slices.sourceUrl}" @type=xml @demo=false}
}
</template></cem-element>
</main></cem-theme-switch></body></html>
