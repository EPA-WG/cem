<cem-gallery-page id="playground-theme" heading="cem-icon-button: Property playground">
<template>


<header><p>An icon button or navigation link with embedded cem-icon content and CEM action-theme states. Change its attributes and inspect the production source.</p><p><a href="./cem-icon-button-gallery.html">Full examples and variation matrix</a> · <a href="https://github.com/EPA-WG/cem/blob/develop/packages/cem-components/src/components/cem-icon-button/cem-icon-button.stories.ts">Automated stories</a></p></header>
<main>
<aside aria-label="Embedded icon and shared attributes">
<h2>Embedded cem-icon and shared attributes</h2>
<p><code>cem-icon-button</code> embeds <a href="./cem-icon-gallery.html"><code>cem-icon</code></a> inside a native button or link and loads it automatically. It relays <code>image</code>, <code>size</code>, <code>direction</code>, <code>align</code>, <code>label</code>, <code>aria-label</code>, <code>class</code>, <code>hidden</code>, and default-slot content. Unicode, emoji, image URLs and font glyphs use the same rendering as <code>cem-icon</code>.</p>
<p><strong>Attribute note:</strong> <code>label</code> supplies visible fallback text; projected content replaces it. For an icon-only control, use <code>aria-label</code> without <code>label</code>. <code>aria-label</code> names both the control and embedded glyph and takes precedence over the control’s <code>label</code> name.</p>
<p><code>image</code> selects the glyph. An explicitly empty source hides the glyph. Without a source, buttons show circle and links show no glyph. <code>size="small|medium|large|x-large|xx-large"</code> sets action control height and is forwarded unchanged to the icon. Small and large select their icon sizes; other values use the default icon size. Normal or absent size inherits control height. The inherited <code>--cem-icon-size</code>, <code>--cem-icon-size-small</code>, and <code>--cem-icon-size-large</code> tokens control glyph size. Row and column layouts work in both modes.</p>
<p><code>href</code>, <code>disabled</code>, <code>selected</code>, <code>selectable</code>, <code>pending</code>, <code>variant</code>, and activation remain owned by <code>cem-icon-button</code>. Present <code>href</code> selects a link; absent <code>href</code> selects a button.</p>
<p><code>align="start|center|end"</code> aligns content within available inline space and defaults to <code>center</code>. It works with both row and column layouts; start and end follow the text direction, including RTL. Give the host a width to see the alignment. The container owns sizing and placement.</p>
<h2>Action theme support</h2>
<p>Controls use the same action state model and theme tokens as <a href="./cem-action-gallery.html"><code>cem-action</code></a>: default, hover, active press, disabled, pending, selected and keyboard focus. Variant selects primary (default), explicit, contextual, alternate or destructive action colors in both modes. These states respond to all five CEM theme modes and inherited action-token overrides.</p>
<p><code>selected</code> keeps the theme’s selection stripe visible, including while disabled or pending. <code>selectable</code> exposes an unselected button choice. The containing application controls selection. <code>pending="true"</code> shows busy feedback and takes precedence over hover, press and disabled paint; <code>disabled</code> still prevents activation. Keyboard focus has an independent stripe. Contrast themes use action contours, reduced motion freezes pending animation, and forced colors use system-color indicators.</p>
</aside>

<li data-command-attribute="direction"><code>direction</code></li>
<li data-command-attribute="align"><code>align</code></li>
<li data-command-attribute="name"><code>name</code></li>
<li data-command-attribute="value"><code>value</code></li>
<li data-command-attribute="form"><code>form</code></li>
<li data-command-attribute="formaction"><code>formaction</code></li>
<li data-command-attribute="formmethod"><code>formmethod</code></li>
<li data-command-attribute="formenctype"><code>formenctype</code></li>
<li data-command-attribute="formtarget"><code>formtarget</code></li>
<li data-command-attribute="formnovalidate"><code>formnovalidate</code></li>
<li data-command-attribute="type"><code>type</code></li>
<li data-command-attribute="aria-current"><code>aria-current</code></li>
<li data-command-attribute="aria-expanded"><code>aria-expanded</code></li>
<li data-command-attribute="aria-controls"><code>aria-controls</code></li>
<li data-command-attribute="variant"><code>variant</code></li></ul>
<cem-demo-element type="cem-ml" legend="Content alignment" description="Start, center and end align along the inline axis in row and column layouts. The last two examples use RTL. Full-width hosts make the alignment visible." data-covers="align direction label"><template slot="source">
{div @style="display:grid;gap:var(--cem-gap-related)" |
    {cem-icon-button @image="★" @direction=row @align=start @label="row: start" @style="inline-size:100%"}
    {cem-icon-button @image="★" @direction=row @align=center @label="row: center" @style="inline-size:100%"}
    {cem-icon-button @image="★" @direction=row @align=end @label="row: end" @style="inline-size:100%"}
    {cem-icon-button @image="★" @direction=column @align=start @href="#icon-link-target" @label="column: start" @style="inline-size:100%"}
    {cem-icon-button @image="★" @direction=column @align=center @href="#icon-link-target" @label="column: center" @style="inline-size:100%"}
    {cem-icon-button @image="★" @direction=column @align=end @href="#icon-link-target" @label="column: end" @style="inline-size:100%"}
    {div @dir=rtl @style="display:grid;gap:var(--cem-gap-related)" |
        {cem-icon-button @image="★" @align=start @label="RTL: start" @style="inline-size:100%"}
        {cem-icon-button @image="★" @align=end @label="RTL: end" @style="inline-size:100%"}
    }
}
</template></cem-demo-element>
<cem-demo-element type="cem-ml" legend="Control and icon sizes" description="Size sets the same minimum control height as cem-action and is forwarded unchanged to cem-icon. Small and large also select the matching icon size; medium, x-large and xx-large use the default icon size. Normal and absent size inherit control height and use the default icon size. Content and the minimum hit area can make controls taller." data-covers="size"><template slot="source">
{div @data-cem-size=large |
    {cem-icon-button @image="★" @label="Inherited"}
    {cem-icon-button @image="★" @label="small" @size=small}
    {cem-icon-button @image="★" @label="medium" @size=medium}
    {cem-icon-button @image="★" @label="normal" @size=normal}
    {cem-icon-button @image="★" @label="large" @size=large}
    {cem-icon-button @image="★" @label="x-large" @size=x-large}
    {cem-icon-button @image="★" @label="xx-large" @size=xx-large}
    {cem-icon-button @image="★" @label="Inherited" @href="#icon-link-target"}
    {cem-icon-button @image="★" @label="small" @href="#icon-link-target" @size=small}
    {cem-icon-button @image="★" @label="medium" @href="#icon-link-target" @size=medium}
    {cem-icon-button @image="★" @label="normal" @href="#icon-link-target" @size=normal}
    {cem-icon-button @image="★" @label="large" @href="#icon-link-target" @size=large}
    {cem-icon-button @image="★" @label="x-large" @href="#icon-link-target" @size=x-large}
    {cem-icon-button @image="★" @label="xx-large" @href="#icon-link-target" @size=xx-large}
}
</template></cem-demo-element>
<cem-demo-element legend="Embedded icon attributes" description="Both command and link modes relay the cem-icon source, size, layout, visible label and accessible name. Projected content replaces the label fallback." data-covers="image size direction label aria-label"><template slot="source">
<cem-icon-button image="★" size="small" label="Favorite"></cem-icon-button>
<cem-icon-button image="😀" size="normal" label="Reaction" direction="column"></cem-icon-button>
<cem-icon-button image="favorite" size="large" aria-label="Favorite"></cem-icon-button>
<cem-icon-button href="#icon-link-target" image="★" size="large" direction="column" label="Fallback"><strong>Projected favorite</strong></cem-icon-button>
<cem-icon-button image="" label="Text without glyph"></cem-icon-button>
</template></cem-demo-element>
<cem-demo-element legend="Icon links" data-covers="href image variant direction"><template slot="source">
<cem-icon-button image="recycling" href="#icon-link-target">Recycle</cem-icon-button>
<cem-icon-button image="fas fa-cloud-upload-alt" href="#icon-link-target">Upload</cem-icon-button>
<cem-icon-button image="data:image/svg+xml,%3Csvg%20xmlns=%22http://www.w3.org/2000/svg%22%20viewBox=%220%200%2024%2024%22%3E%3Cpath%20fill=%22%23007880%22%20d=%22M12%202%2022%2012%2012%2022%202%2012Z%22/%3E%3C/svg%3E" href="#icon-link-target" direction="column">Image link</cem-icon-button>
<cem-icon-button image="shopping_cart" href="#icon-link-target" disabled="false">Disabled link</cem-icon-button>
<cem-icon-button image="" href="#icon-link-target">Text-only link</cem-icon-button>
<cem-icon-button image="shopping_cart" href="#icon-link-target" label="Open cart"></cem-icon-button>
<div id="icon-link-target">Link destination</div>
</template></cem-demo-element>
<cem-demo-element legend="Command buttons" description="Without href, the control is a native button. Type defaults to button, which does not submit a surrounding form. The default glyph is circle and the default accessible name is Icon action; supply aria-label for a named icon-only command."><template slot="source">
<cem-icon-button></cem-icon-button>
<form>
<cem-icon-button image="settings" aria-label="Open settings"></cem-icon-button>
</form>
</template></cem-demo-element>
<cem-demo-element legend="Command activation" description="Click the enabled command, or focus it and press Space or Enter. Each activation emits a click and records the component’s pressed event slice without changing the container-owned selected state. The containing example displays the last click."><template slot="source">
<cem-element><template type="text/cem-ml">
{slice @name=activation | None}
{cem-icon-button @image=check @label="Run command" @slice=activation @slice-event=click @slice-value="$event.type"}
{p @role=status | Last activation: {$datadom.slices.activation}}
</template></cem-element>
</template></cem-demo-element>
<cem-demo-element legend="Navigation links" description="Present href selects a native link. Click or Enter follows its URL. Fragments target this page, relative URLs use the document base, absolute URLs navigate to another site, and an empty href navigates to the current document. Text supplies the accessible name when label and aria-label are absent." data-covers="href"><template slot="source">
<cem-icon-button href="#icon-link-target" image="arrow_downward">Jump to destination</cem-icon-button>
<cem-icon-button href="./cem-icon.html" image="open_in_new">Icon playground</cem-icon-button>
<cem-icon-button href="https://github.com/EPA-WG/cem" image="open_in_new">CEM repository</cem-icon-button>
<cem-icon-button href="">Current document</cem-icon-button>
</template></cem-demo-element>
<cem-demo-element legend="Disabled buttons" description="Disabled uses attribute presence: disabled, disabled=false and disabled=true all prevent activation and remove the native button from the tab sequence. Remove the attribute to enable the command." data-covers="disabled"><template slot="source">
<cem-icon-button image="check" label="Enabled command"></cem-icon-button>
<cem-icon-button image="check" label="Disabled command" disabled></cem-icon-button>
<cem-icon-button image="check" label="Disabled with false" disabled="false"></cem-icon-button>
<cem-icon-button image="check" label="Disabled with true" disabled="true"></cem-icon-button>
</template></cem-demo-element>
<cem-demo-element legend="Disabled links" description="A disabled link retains its link role and aria-disabled=true, omits its native href and activation binding, and leaves the tab sequence. All three disabled values below have the same effect. Removing disabled restores the authored destination." data-covers="href disabled"><template slot="source">
<cem-icon-button href="#icon-link-target" image="shopping_cart">Enabled link</cem-icon-button>
<cem-icon-button href="#icon-link-target" image="shopping_cart" disabled>Disabled link</cem-icon-button>
<cem-icon-button href="#icon-link-target" image="shopping_cart" disabled="false">Disabled with false</cem-icon-button>
<cem-icon-button href="#icon-link-target" image="shopping_cart" disabled="true">Disabled with true</cem-icon-button>
</template></cem-demo-element>
<cem-demo-element legend="Selection" description="Selected is controlled by the containing application and uses presence: selected=false is still selected. Buttons expose aria-pressed=true; selectable buttons without selected expose aria-pressed=false. Selected links retain navigation semantics and expose aria-current=true. The selection stripe stays visible during hover, press, focus, disabled and pending states; clicks do not toggle selected." data-covers="selected selectable"><template slot="source">
<cem-icon-button image="star" label="Ordinary command"></cem-icon-button>
<cem-icon-button image="star" label="Unselected choice" selectable></cem-icon-button>
<cem-icon-button image="star" label="Selectable by presence" selectable="false"></cem-icon-button>
<cem-icon-button image="star" label="Selected choice" selected></cem-icon-button>
<cem-icon-button image="star" label="Selected with false" selected="false"></cem-icon-button>
<cem-icon-button image="star" label="Selected with true" selected="true"></cem-icon-button>
<cem-icon-button image="star" label="Disabled selected choice" selected disabled></cem-icon-button>
<cem-icon-button href="#icon-link-target" image="home">Unselected link</cem-icon-button>
<cem-icon-button href="#icon-link-target" image="home" selected>Current link</cem-icon-button>
<cem-icon-button href="#icon-link-target" image="home" selected="false">Current link with false</cem-icon-button>
<cem-icon-button href="#icon-link-target" image="home" selected disabled>Disabled current link</cem-icon-button>
</template></cem-demo-element>
<cem-demo-element legend="Pending actions" description="Pending=true exposes aria-busy=true and uses the action theme’s animated pending treatment. Pending=false or removing pending restores the current interaction colors. Pending remains visible when disabled and preserves selection; use disabled to prevent activation. Reduced motion freezes the animation, and forced colors use a static system-color indicator." data-covers="pending"><template slot="source">
<cem-icon-button image="sync" label="Ready command" pending="false"></cem-icon-button>
<cem-icon-button image="sync" label="Pending command" pending="true"></cem-icon-button>
<cem-icon-button image="sync" label="Disabled pending command" pending="true" disabled></cem-icon-button>
<cem-icon-button image="sync" label="Selected pending command" pending="true" selected></cem-icon-button>
<cem-icon-button image="sync" label="Selected disabled pending command" pending="true" selected disabled></cem-icon-button>
<cem-icon-button href="#icon-link-target" image="sync" pending="false">Ready link</cem-icon-button>
<cem-icon-button href="#icon-link-target" image="sync" pending="true">Pending link</cem-icon-button>
<cem-icon-button href="#icon-link-target" image="sync" pending="true" disabled>Disabled pending link</cem-icon-button>
<cem-icon-button href="#icon-link-target" image="sync" pending="true" selected>Current pending link</cem-icon-button>
<cem-icon-button href="#icon-link-target" image="sync" pending="true" selected disabled>Disabled current pending link</cem-icon-button>
</template></cem-demo-element>
<cem-demo-element legend="Action variants" description="Variant selects the same action intent as cem-action: primary (default), explicit, contextual, alternate or destructive. It controls default, hover, active, disabled and pending paint in both button and link modes; selected and keyboard-focus stripes remain independent." data-covers="variant"><template slot="source">
<cem-icon-button image="settings" label="Default variant"></cem-icon-button>
<cem-icon-button image="settings" label="primary" variant="primary"></cem-icon-button>
<cem-icon-button href="#icon-link-target" image="settings" variant="primary">primary link</cem-icon-button>
<cem-icon-button image="settings" label="explicit" variant="explicit"></cem-icon-button>
<cem-icon-button href="#icon-link-target" image="settings" variant="explicit">explicit link</cem-icon-button>
<cem-icon-button image="settings" label="contextual" variant="contextual"></cem-icon-button>
<cem-icon-button href="#icon-link-target" image="settings" variant="contextual">contextual link</cem-icon-button>
<cem-icon-button image="settings" label="alternate" variant="alternate"></cem-icon-button>
<cem-icon-button href="#icon-link-target" image="settings" variant="alternate">alternate link</cem-icon-button>
<cem-icon-button image="settings" label="destructive" variant="destructive"></cem-icon-button>
<cem-icon-button href="#icon-link-target" image="settings" variant="destructive">destructive link</cem-icon-button>
</template></cem-demo-element>
<cem-demo-element legend="Button types" description="Type defaults to button. Submit participates in native validation and submits the form; reset restores the initial field value. These are the same native button behaviors as cem-action. Submit opens this page in a new tab." data-covers="type name value"><template slot="source">
<form id="icon-button-example-form" method="get" target="_blank">
<label>Example title <input name="title" value="Initial title" required></label>
<cem-icon-button image="check" label="Submit" type="submit" name="intent" value="save"></cem-icon-button>
<cem-icon-button image="undo" label="Reset" type="reset" variant="explicit"></cem-icon-button>
<cem-icon-button image="settings" label="Command" type="button" variant="contextual"></cem-icon-button>
</form>
</template></cem-demo-element>
<cem-demo-element legend="External form ownership" description="Form associates the native button with a form elsewhere in the document. This submitter uses the Example title form above. Name and value identify the submitter in form data; they do not select the image." data-covers="form name value"><template slot="source">
<cem-icon-button image="send" label="Submit example form" type="submit" form="icon-button-example-form" name="intent" value="external"></cem-icon-button>
</template></cem-demo-element>
<cem-demo-element legend="Submit overrides" description="Formaction, formmethod, formenctype and formtarget override the form settings for this submitter. Formnovalidate uses presence to bypass native validation. Button-only form attributes do not apply in href link mode." data-covers="formaction formmethod formenctype formtarget formnovalidate"><template slot="source">
<cem-icon-button image="send" label="Submit without validation" type="submit" form="icon-button-example-form" name="intent" value="override" formaction="#icon-button-example-form" formmethod="get" formenctype="application/x-www-form-urlencoded" formtarget="_blank" formnovalidate></cem-icon-button>
<cem-icon-button image="send" label="Bypass by presence" type="submit" form="icon-button-example-form" formnovalidate="false" variant="explicit"></cem-icon-button>
</template></cem-demo-element>
<cem-demo-element legend="Action bends" description="The cem-bend-sharp, cem-bend-smooth and cem-bend-round classes use the same theme radius settings as cem-action. They apply to both native control modes. Size sets action control height and is also forwarded to the embedded icon." data-covers="class"><template slot="source">
<cem-icon-button image="star" label="Sharp" class="cem-bend-sharp"></cem-icon-button>
<cem-icon-button image="star" label="Smooth" class="cem-bend-smooth"></cem-icon-button>
<cem-icon-button image="star" label="Round" class="cem-bend-round"></cem-icon-button>
<cem-icon-button href="#icon-link-target" image="star" class="cem-bend-sharp">Sharp link</cem-icon-button>
<cem-icon-button href="#icon-link-target" image="star" class="cem-bend-smooth">Smooth link</cem-icon-button>
<cem-icon-button href="#icon-link-target" image="star" class="cem-bend-round">Round link</cem-icon-button>
</template></cem-demo-element>
<cem-demo-element legend="Host classes" description="Class stays on the outer component and is relayed to the embedded cem-icon. Use it to apply application styles; the native control retains its own component and variant classes." data-covers="class"><template slot="source">
<cem-icon-button image="settings" label="Classed button" class="consumer-command"></cem-icon-button>
<cem-icon-button href="#icon-link-target" image="settings" class="consumer-command">Classed link</cem-icon-button>
</template></cem-demo-element>
<cem-demo-element legend="Visibility" description="Hidden applies to the host and embedded icon. Its presence hides the whole control, including hidden=false and hidden=true. Remove hidden to show it again. The visible controls show the absent-attribute case." data-covers="hidden"><template slot="source">
<cem-icon-button image="visibility" label="Visible button"></cem-icon-button>
<cem-icon-button image="visibility" label="Hidden button" hidden></cem-icon-button>
<cem-icon-button image="visibility" label="Hidden button with false" hidden="false"></cem-icon-button>
<cem-icon-button image="visibility" label="Hidden button with true" hidden="true"></cem-icon-button>
<cem-icon-button href="#icon-link-target" image="visibility">Visible link</cem-icon-button>
<cem-icon-button href="#icon-link-target" image="visibility" hidden>Hidden link</cem-icon-button>
<cem-icon-button href="#icon-link-target" image="visibility" hidden="false">Hidden link with false</cem-icon-button>
<cem-icon-button href="#icon-link-target" image="visibility" hidden="true">Hidden link with true</cem-icon-button>
</template></cem-demo-element>
<cem-element><template type="text/cem-ml">
{cem-module-url @slice=sourceUrl @src="@epa-wg/cem-components/components/cem-icon-button/cem-icon-button.xhtml"}
{cem:if @test="datadom.slices.sourceUrl" |
 {p | {a @href="{$datadom.slices.sourceUrl}" | Canonical XHTML}}
 {cem-demo-element @legend="Canonical icon-button source" @src="{$datadom.slices.sourceUrl}" @type=xml @demo=false}
}
</template></cem-element>
</main></template>
</cem-gallery-page>
</body></html>
