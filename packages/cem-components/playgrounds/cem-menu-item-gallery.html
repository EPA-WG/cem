<template>

<header>
<p class="component-description">A command with the menuitem role, disabled state, and disclosure-state reporting. It complements <a href="./cem-action-gallery.html"><code>cem-action</code></a> and <a href="./cem-icon-button-gallery.html"><code>cem-icon-button</code></a>; the containing menu owns navigation, focus, and any expanded content.</p>
<p><a href="./cem-menu-item.html">Property playground</a> · <a href="https://github.com/EPA-WG/cem/blob/develop/packages/cem-components/src/components/cem-menu-item/cem-menu-item.stories.ts">Automated stories</a></p></header><main>
<style>[data-gallery-theme] { padding: var(--cem-dim-large); background-color: var(--cem-palette-comfort); color: var(--cem-palette-comfort-text); } .examples { display: grid; gap: var(--cem-dim-large); grid-template-columns: repeat(auto-fit, minmax(min(100%, 18rem), 1fr)); } cem-demo-element { display: block; margin-block: var(--cem-dim-large); }</style><p>Hover each enabled control, hold a pointer press, and use Tab for keyboard focus. States below are real component attributes. The five theme rows stay fixed so you can compare the same states side by side.</p>
<p>Disabled and hidden use presence. Expanded reports disclosure state; the containing menu or disclosure owns navigation and open content. Clicks record activation without toggling selection.</p><h2>Public attributes and slots</h2><ul><li data-gallery-attribute="href"><code>href</code></li><li data-gallery-attribute="aria-label"><code>aria-label</code></li></ul><p><code>href</code> creates a leaf navigation anchor. <code>aria-label</code> names the control separately. The <code>submenu</code> slot accepts a nested <a href="./cem-menu-gallery.html">cem-menu</a>; owners remain buttons. Use root <code>keyboard="menu"</code> to enable popup interaction. A <a href="./cem-dropdown-gallery.html">cem-dropdown</a> can wrap a full menu.</p><cem-demo-element legend="Leaf navigation" description="Leaf href creates a native link; disabled links cannot activate."><template slot="source"><cem-menu-item href="#help" label="Help"></cem-menu-item><cem-menu-item href="#blocked" disabled label="Unavailable"></cem-menu-item></template></cem-demo-element><ul><li data-gallery-attribute="label"><code>label</code></li>
<li data-gallery-attribute="disabled"><code>disabled</code></li>
<li data-gallery-attribute="expanded"><code>expanded</code></li>
<li data-gallery-attribute="hidden"><code>hidden</code></li>
<li data-gallery-attribute="class"><code>class</code></li></ul>
<p><strong>Slots:</strong> The default slot replaces fallback command text.</p>
<cem-demo-element legend="All implemented attributes" data-covers="label disabled expanded hidden class"><template slot="source">
<cem-menu-item></cem-menu-item>

<cem-menu-item label="Hidden by presence" hidden="false"></cem-menu-item>
<cem-menu-item label="Projected command"><span>Projected content</span></cem-menu-item>
</template></cem-demo-element>
