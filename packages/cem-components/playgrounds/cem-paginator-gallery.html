<cem-gallery-page id="playground-theme" heading="cem-paginator: Full examples and variation matrix">
<template><p class="component-description">Native pagination controls emit cem-page for application-owned data. Page-size changes preserve the first visible item; unavailable boundary actions retain focus. Related: <a href="./cem-expansion-gallery.html">cem-expansion</a> · <a href="./cem-table-gallery.html">cem-table</a> · <a href="./cem-sort-header-gallery.html">cem-sort-header</a>.</p><p><a href="./cem-paginator-gallery.html">Full examples and variation matrix</a> · <a href="./cem-paginator.html">Property playground</a> · <a href="https://github.com/EPA-WG/cem/blob/develop/packages/cem-components/src/components/cem-paginator/cem-paginator.stories.ts">Automated stories</a></p><main><h2>Public attributes and slots</h2><table><caption>Public attribute inventory</caption><thead><tr><th>Attribute</th><th>Contract</th></tr></thead><tbody><tr data-gallery-attribute="label"><th><code>label</code></th><td>Visible or accessible owner name; component defaults apply when omitted.</td></tr><tr data-gallery-attribute="name"><th><code>name</code></th><td>Application identity included in the component event.</td></tr><tr data-gallery-attribute="length"><th><code>length</code></th><td>Finite non-negative integer item count; invalid values normalize to zero without rewriting attributes.</td></tr><tr data-gallery-attribute="page-index"><th><code>page-index</code></th><td>Zero-based finite non-negative integer, clamped to the last page; defaults to zero.</td></tr><tr data-gallery-attribute="page-size"><th><code>page-size</code></th><td>Finite positive integer; invalid values normalize to 50. Fractions are floored; values below one use the fallback.</td></tr><tr data-gallery-attribute="page-size-options"><th><code>page-size-options</code></th><td>Whitespace-separated positive choices, floored, sorted and de-duplicated; always includes the current normalized page size.</td></tr><tr data-gallery-attribute="items-per-page-label"><th><code>items-per-page-label</code></th><td>Visible label for the native select; defaults to Items per page.</td></tr><tr data-gallery-attribute="first-page-label"><th><code>first-page-label</code></th><td>Accessible first-action label; defaults to First page.</td></tr><tr data-gallery-attribute="previous-page-label"><th><code>previous-page-label</code></th><td>Accessible previous-action label; defaults to Previous page.</td></tr><tr data-gallery-attribute="next-page-label"><th><code>next-page-label</code></th><td>Accessible next-action label; defaults to Next page.</td></tr><tr data-gallery-attribute="last-page-label"><th><code>last-page-label</code></th><td>Accessible last-action label; defaults to Last page.</td></tr><tr data-gallery-attribute="of-label"><th><code>of-label</code></th><td>Localized connector in the numeric range; defaults to of.</td></tr><tr data-gallery-attribute="show-first-last"><th><code>show-first-last</code></th><td>Presence renders first and last actions.</td></tr><tr data-gallery-attribute="hide-page-size"><th><code>hide-page-size</code></th><td>Presence omits the native page-size field.</td></tr><tr data-gallery-attribute="disabled"><th><code>disabled</code></th><td>Presence disables native user controls; programmatic state remains available.</td></tr><tr data-gallery-attribute="class"><th><code>class</code></th><td>Consumer host class; component-owned hooks use public parts.</td></tr><tr data-gallery-attribute="hidden"><th><code>hidden</code></th><td>Native host visibility; until-found retains browser semantics.</td></tr><tr data-gallery-attribute="dir"><th><code>dir</code></th><td>Inherited native text direction: ltr or rtl.</td></tr></tbody></table><p>No content slots. Applications consume cem-page to load the requested range; the polite status describes the requested numeric range only. Boolean attributes use presence, including empty and false-valued spellings. Author changes emit no component events.</p><section aria-label="Theme variation matrix"><h2>Five theme modes</h2><div class="cem-theme-light" data-gallery-theme="light"><cem-demo-element legend="light variation matrix" description="Compare inherited theme tokens and native semantics."><template slot="source"><cem-paginator length="120" page-size="25" page-size-options="10 25 50 100" ></cem-paginator></template></cem-demo-element>
</div><div class="cem-theme-dark" data-gallery-theme="dark"><cem-demo-element legend="dark variation matrix" description="Compare inherited theme tokens and native semantics."><template slot="source"><cem-paginator length="120" page-size="25" page-size-options="10 25 50 100" ></cem-paginator></template></cem-demo-element>
</div><div class="cem-theme-contrast-light" data-gallery-theme="contrast-light"><cem-demo-element legend="contrast-light variation matrix" description="Compare inherited theme tokens and native semantics."><template slot="source"><cem-paginator length="120" page-size="25" page-size-options="10 25 50 100" ></cem-paginator></template></cem-demo-element>
</div><div class="cem-theme-contrast-dark" data-gallery-theme="contrast-dark"><cem-demo-element legend="contrast-dark variation matrix" description="Compare inherited theme tokens and native semantics."><template slot="source"><cem-paginator length="120" page-size="25" page-size-options="10 25 50 100" ></cem-paginator></template></cem-demo-element>
</div><div class="cem-theme-native" data-gallery-theme="native"><cem-demo-element legend="native variation matrix" description="Compare inherited theme tokens and native semantics."><template slot="source"><cem-paginator length="120" page-size="25" page-size-options="10 25 50 100" ></cem-paginator></template></cem-demo-element>
</div></section><cem-demo-element legend="Presence states" description="Empty and false-valued attributes are present."><template slot="source"><cem-paginator length="120" page-size="25" page-size-options="10 25 50 100" show-first-last="" hide-page-size="" disabled=""></cem-paginator><cem-paginator length="120" page-size="25" page-size-options="10 25 50 100" show-first-last="false" hide-page-size="false" disabled="false"></cem-paginator></template></cem-demo-element>
<cem-demo-element legend="Empty and invalid ranges" description="Normalization is render-only until a successful user action."><template slot="source"><cem-paginator length="0"></cem-paginator><cem-paginator length="invalid" page-size="0.5" page-index="-4"></cem-paginator></template></cem-demo-element>
<cem-demo-element legend="Direction and hidden" description="Native direction and visibility apply to the complete component."><template slot="source"><cem-paginator length="120" page-size="25" page-size-options="10 25 50 100" dir="rtl"></cem-paginator><cem-paginator length="120" page-size="25" page-size-options="10 25 50 100" hidden></cem-paginator></template></cem-demo-element>
