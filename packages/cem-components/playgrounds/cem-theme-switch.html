<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>cem-theme-switch — property playground</title>
    <script type="importmap">{
    "imports": {
        "@epa-wg/cem-elements": "../../cem-elements/dist/index.js",
        "@epa-wg/cem-demo-element": "../../cem-demo-element/dist/index.js",
        "@epa-wg/cem-ml/wasm": "../../cem-ml-npm/dist/wasm/browser/cem_ml.js",
        "@epa-wg/cem-theme/styles.css": "../../cem-theme/dist/lib/css/cem-combined.css",
        "@epa-wg/cem-components/styles.css": "../dist/styles.css",
        "@epa-wg/cem-components/action-demo": "./cem-action-gallery.html",
        "@epa-wg/cem-components/action-playground": "./cem-action.html",
        "@epa-wg/cem-components/theme-switch-playground": "./cem-theme-switch.html",
        "@epa-wg/cem-components/components/": "../src/components/",
        "@epa-wg/cem-components/playgrounds/": "./"
    }
}</script>
    <link rel="stylesheet" href="../../cem-theme/dist/lib/css/cem-combined.css">
    <script type="module">
        import { installCemElementRuntime } from '@epa-wg/cem-elements';
        import '@epa-wg/cem-demo-element';
        installCemElementRuntime(window, { processingPoolPolicy: { queueSize: 512 } });
    </script>
    <style>
        body { margin: 0; font-family: system-ui, sans-serif; }
        cem-demo-element { display: block; margin-block: var(--cem-dim-large); }
    </style>
</head>
<body>
<cem-element hidden><template type="text/cem-ml">
{cem-element @tag=cem-option @src="@epa-wg/cem-components/components/cem-option/cem-option.xhtml#cem-option"}
{cem-element @tag=cem-option-group @src="@epa-wg/cem-components/components/cem-option-group/cem-option-group.xhtml#cem-option-group"}
{cem-element @tag=cem-badge @src="@epa-wg/cem-components/components/cem-badge/cem-badge.xhtml#cem-badge"}
{cem-element @tag=cem-avatar @src="@epa-wg/cem-components/components/cem-avatar/cem-avatar.xhtml#cem-avatar"}
{cem-element @tag=cem-media-preview @src="@epa-wg/cem-components/components/cem-media-preview/cem-media-preview.xhtml#cem-media-preview"}
{cem-element @tag=cem-tree-item @src="@epa-wg/cem-components/components/cem-tree-item/cem-tree-item.xhtml#cem-tree-item"}
{cem-element @tag=cem-app-bar @src="@epa-wg/cem-components/components/cem-app-bar/cem-app-bar.xhtml#cem-app-bar"}
{cem-element @tag=cem-tab @src="@epa-wg/cem-components/components/cem-tab/cem-tab.xhtml#cem-tab"}
{cem-element @tag=cem-step @src="@epa-wg/cem-components/components/cem-step/cem-step.xhtml#cem-step"}

{cem-element @tag=cem-toast @src="@epa-wg/cem-components/components/cem-toast/cem-toast.xhtml#cem-toast"}
{cem-element @tag=cem-progress @src="@epa-wg/cem-components/components/cem-progress/cem-progress.xhtml#cem-progress"}
{cem-element @tag=cem-progress-spinner @capability=progress-status @src="@epa-wg/cem-components/components/cem-progress-spinner/cem-progress-spinner.xhtml#cem-progress-spinner"}
{cem-element @tag=cem-skeleton @src="@epa-wg/cem-components/components/cem-skeleton/cem-skeleton.xhtml#cem-skeleton"}
{cem-element @tag=cem-alert @src="@epa-wg/cem-components/components/cem-alert/cem-alert.xhtml#cem-alert"}

{cem-element @tag=cem-gallery-page @src="@epa-wg/cem-components/playgrounds/cem-gallery-page.xhtml#cem-gallery-page"}

{cem-element @tag=cem-field @capability=form-control @src="@epa-wg/cem-components/components/cem-field/cem-field.xhtml#cem-field"}

{cem-element @tag=cem-text-field @capability=form-control @src="@epa-wg/cem-components/components/cem-text-field/cem-text-field.xhtml#cem-text-field"}


{cem-element @tag=cem-theme-switch @src="@epa-wg/cem-components/components/cem-theme-switch/cem-theme-switch.xhtml#cem-theme-switch"}

</template>
</cem-element>

<cem-gallery-page id="playground-theme" heading="cem-theme-switch: Property playground">
<template>


<header><p><a href="./cem-theme-switch-gallery.html">Full examples and variation matrix</a> · <a href="https://github.com/EPA-WG/cem/blob/develop/packages/cem-components/src/components/cem-theme-switch/cem-theme-switch.stories.ts">Automated stories</a></p></header>
<main>
<p>Use the ◐ contextual icon button (tooltip: Change theme) to choose Light, Dark, Contrast light, Contrast dark or System. Light is the default.</p>
<p>The navigation menu saves the page theme. The independent theme switch below saves its example theme under a separate key; its current menu action has selected styling.</p>
<cem-theme-switch storage-key="playground-theme-mode" mode="light">
<label>Try keeping an edited value while switching themes: <input id="retained-value" value="Draft"></label>
</cem-theme-switch>
<p><a href="./cem-action.html">Full demonstration with the action playground</a></p>
<cem-element>
<template type="text/cem-ml">
{cem-module-url @slice=sourceUrl @src="@epa-wg/cem-components/components/cem-theme-switch/cem-theme-switch.xhtml"}
{cem:if @test="datadom.slices.sourceUrl" |
    {p | {a @href="{$datadom.slices.sourceUrl}" | Open canonical XHTML}}
    {cem-demo-element @legend="Canonical theme switch source" @src="{$datadom.slices.sourceUrl}" @type=xml @demo=false}
}
</template>
</cem-element>
</main>

</template>
</cem-gallery-page>
</body>
</html>
