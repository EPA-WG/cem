<cem-gallery-page heading="cem-recovery-status: Property playground"><template><p>Advisory recovery metadata with an accessible disclosure. Use <a href="./cem-alert-gallery.html">cem-alert</a> for application feedback and <a href="./cem-progress-gallery.html">cem-progress</a> for measured work. This component never reads credentials or starts recovery.</p><p><a href="./cem-recovery-status-gallery.html">Full examples and variation matrix</a> · <a href="./cem-recovery-status.html">Property playground</a> · <a href="https://github.com/EPA-WG/cem/blob/develop/packages/cem-components/src/components/cem-recovery-status/cem-recovery-status.stories.ts">Automated stories</a></p><main><p>These are simulated host observations. Counts must be nonnegative integers. State and reason are independent so refusal combinations can be inspected. Unknown states/reasons have a safe unavailable fallback. Hidden is a presence boolean. Open the disclosure by keyboard or pointer; status updates retain its state.</p><cem-element class="properties"><template type="text/cem-ml">{slice @name=state | unconfigured}
