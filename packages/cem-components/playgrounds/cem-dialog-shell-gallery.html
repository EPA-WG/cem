<cem-gallery-page id="playground-theme" heading="cem-dialog-shell: Full examples and variation matrix">
<template><p class="component-description">A compatibility tag using the same native surface contract as <a href="./cem-dialog-gallery.html">cem-dialog</a>, including explicit modal mode and native forms.</p>
<p><a href="./cem-dialog-shell.html">Property playground</a> · <a href="https://github.com/EPA-WG/cem/blob/develop/packages/cem-components/src/components/cem-dialog-shell/cem-dialog-shell.stories.ts">Automated stories</a></p><main><h2>Public attributes and slots</h2><ul><li data-gallery-attribute="trigger-for"><code>trigger-for</code></li><li data-gallery-attribute="show-delay"><code>show-delay</code></li><li data-gallery-attribute="hide-delay"><code>hide-delay</code></li><li data-gallery-attribute="placement"><code>placement</code></li><li data-gallery-attribute="anchor"><code>anchor</code></li><li data-gallery-attribute="boundary"><code>boundary</code></li><li data-gallery-attribute="fallback"><code>fallback</code></li><li data-gallery-attribute="overflow"><code>overflow</code></li><li data-gallery-attribute="anchor-lost"><code>anchor-lost</code></li><li data-gallery-attribute="surface-id"><code>surface-id</code></li><li data-gallery-attribute="hidden"><code>hidden</code></li><li data-gallery-attribute="class"><code>class</code></li><li data-gallery-attribute="dir"><code>dir</code></li><li data-gallery-attribute="label"><code>label</code></li><li data-gallery-attribute="trigger"><code>trigger</code></li><li data-gallery-attribute="trigger-aria-label"><code>trigger-aria-label</code></li><li data-gallery-attribute="trigger-disabled"><code>trigger-disabled</code></li><li data-gallery-attribute="close-label"><code>close-label</code></li><li data-gallery-attribute="mode"><code>mode</code></li><li data-gallery-attribute="popover"><code>popover</code></li><li data-gallery-attribute="closedby"><code>closedby</code></li><li data-gallery-attribute="default-open"><code>default-open</code></li><li data-gallery-attribute="materialize"><code>materialize</code></li><li data-gallery-attribute="focus-target"><code>focus-target</code></li><li data-gallery-attribute="return-focus"><code>return-focus</code></li><li data-gallery-attribute="context-change"><code>context-change</code></li><li data-gallery-attribute="aria-label"><code>aria-label</code></li><li data-gallery-attribute="aria-labelledby"><code>aria-labelledby</code></li><li data-gallery-attribute="aria-describedby"><code>aria-describedby</code></li></ul><p>Slots: <code>trigger</code> supplies one native control or control provider; <code>label</code> replaces visible fallback text. The default body is eager; <code>body</code> can supply an inert template and <code>close</code> replaces the generated close control.</p><p>Use Tab, Escape, pointer hover and native button activation. Five fixed theme rows compare supported states. Dialog modality is explicit; tooltip hover delays apply only to pointer interest. Disabled flags use presence, including the text false. Unsupported invalid, readonly and selected task states are not synthesized.</p><section data-gallery-theme="light" class="cem-theme-light"><h2>light</h2><cem-dialog-shell label="Nonmodal task" trigger="Nonmodal" close-label="Done" ><label>Draft <input autofocus value="Editable"></label></cem-dialog-shell> <cem-dialog-shell label="Modal task" trigger="Modal" close-label="Done" mode="modal"><label>Draft <input autofocus value="Editable"></label></cem-dialog-shell> <cem-dialog-shell label="Disabled task" trigger="Disabled" close-label="Done" trigger-disabled><label>Draft <input autofocus value="Editable"></label></cem-dialog-shell> </section><section data-gallery-theme="dark" class="cem-theme-dark"><h2>dark</h2><cem-dialog-shell label="Nonmodal task" trigger="Nonmodal" close-label="Done" ><label>Draft <input autofocus value="Editable"></label></cem-dialog-shell> <cem-dialog-shell label="Modal task" trigger="Modal" close-label="Done" mode="modal"><label>Draft <input autofocus value="Editable"></label></cem-dialog-shell> <cem-dialog-shell label="Disabled task" trigger="Disabled" close-label="Done" trigger-disabled><label>Draft <input autofocus value="Editable"></label></cem-dialog-shell> </section><section data-gallery-theme="contrast-light" class="cem-theme-contrast-light"><h2>contrast-light</h2><cem-dialog-shell label="Nonmodal task" trigger="Nonmodal" close-label="Done" ><label>Draft <input autofocus value="Editable"></label></cem-dialog-shell> <cem-dialog-shell label="Modal task" trigger="Modal" close-label="Done" mode="modal"><label>Draft <input autofocus value="Editable"></label></cem-dialog-shell> <cem-dialog-shell label="Disabled task" trigger="Disabled" close-label="Done" trigger-disabled><label>Draft <input autofocus value="Editable"></label></cem-dialog-shell> </section><section data-gallery-theme="contrast-dark" class="cem-theme-contrast-dark"><h2>contrast-dark</h2><cem-dialog-shell label="Nonmodal task" trigger="Nonmodal" close-label="Done" ><label>Draft <input autofocus value="Editable"></label></cem-dialog-shell> <cem-dialog-shell label="Modal task" trigger="Modal" close-label="Done" mode="modal"><label>Draft <input autofocus value="Editable"></label></cem-dialog-shell> <cem-dialog-shell label="Disabled task" trigger="Disabled" close-label="Done" trigger-disabled><label>Draft <input autofocus value="Editable"></label></cem-dialog-shell> </section><section data-gallery-theme="native" class="cem-theme-native"><h2>native</h2><cem-dialog-shell label="Nonmodal task" trigger="Nonmodal" close-label="Done" ><label>Draft <input autofocus value="Editable"></label></cem-dialog-shell> <cem-dialog-shell label="Modal task" trigger="Modal" close-label="Done" mode="modal"><label>Draft <input autofocus value="Editable"></label></cem-dialog-shell> <cem-dialog-shell label="Disabled task" trigger="Disabled" close-label="Done" trigger-disabled><label>Draft <input autofocus value="Editable"></label></cem-dialog-shell> </section><cem-demo-element legend="Visible label, projected heading and accessible name" description="Projected labels replace visible fallback text; aria-label can name the task separately."><template slot="source"><cem-dialog-shell label="Visible label" aria-label="Accessible task" trigger="Named task" close-label="Done"><p>Native task content.</p></cem-dialog-shell><cem-dialog-shell label="Fallback" trigger="Projected heading" close-label="Done"><strong slot="label">Projected heading</strong><p>Task body.</p></cem-dialog-shell></template></cem-demo-element>
<cem-demo-element legend="Native form validation and result" description="A modal native dialog preserves method=dialog, validation and return values."><template slot="source"><cem-dialog-shell mode="modal" label="Confirm details" trigger="Confirm details" close-label="Cancel"><form method="dialog"><label>Required name <input name="name" required autofocus></label><button type="submit" value="saved">Save</button></form></cem-dialog-shell></template></cem-demo-element>
<cem-demo-element legend="Retained and disposable bodies" description="An inert payload envelope contains the designated body template. Retain keeps the draft; dispose remounts it."><template slot="source"><cem-dialog-shell label="retain task" trigger="retain" close-label="Close" materialize="retain"><template><template slot="body"><label>Draft <input autofocus value="Initial"></label></template></template></cem-dialog-shell><cem-dialog-shell label="dispose task" trigger="dispose" close-label="Close" materialize="dispose"><template><template slot="body"><label>Draft <input autofocus value="Initial"></label></template></template></cem-dialog-shell></template></cem-demo-element>
<cem-demo-element legend="Slotted launcher and close" description="Explicit controls replace label-generated buttons without a wrapper."><template slot="source"><cem-dialog-shell label="Slotted task" trigger="Replaced" close-label="Replaced"><button slot="trigger" type="button">Custom launcher</button><p>Content</p><button slot="close" type="button">Custom close</button></cem-dialog-shell></template></cem-demo-element>
<cem-demo-element legend="External trigger and workflow return" description="Return focus is independent of the geometry anchor."><template slot="source"><div interaction-scope><button type="button" interaction-name="launcher">Open external task</button><button type="button" interaction-name="workflow">Workflow return</button><cem-dialog-shell label="External task" trigger-for="@launcher" return-focus="@workflow" close-label="Done"><input autofocus aria-label="Value"></cem-dialog-shell></div></template></cem-demo-element>
<cem-demo-element legend="Native command and popover visibility" description="surface-id names the actual native owner; popover visibility is independent of dialog.open."><template slot="source"><button type="button" commandfor="cem-dialog-shell-native-owner" command="--cem-show">Native command</button><cem-dialog-shell label="Native popover task" surface-id="cem-dialog-shell-native-owner" popover="manual" close-label="Done"><input autofocus aria-label="Value"></cem-dialog-shell></template></cem-demo-element>
<cem-demo-element legend="Nested menu task handoff" description="Preparation retains the menu; task exit returns to the outer menu launcher."><template slot="source"><cem-dropdown label="Task menu" open="false"><cem-menu keyboard="menu" direction="column"><cem-menu-item label="More"><cem-menu slot="submenu"><cem-action label="Open task" commandfor="cem-dialog-shell-menu-task" command="--cem-show"></cem-action></cem-menu></cem-menu-item></cem-menu></cem-dropdown><cem-dialog-shell surface-id="cem-dialog-shell-menu-task" label="Menu task" close-label="Done"><input autofocus aria-label="Task entry"></cem-dialog-shell></template></cem-demo-element>
</main></template>
