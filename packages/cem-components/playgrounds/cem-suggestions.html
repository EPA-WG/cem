<main>
<p>Suggestions attach to the existing editor in <a href="cem-field-gallery.html">cem-field</a> or <a href="cem-text-field-gallery.html">cem-text-field</a>. The field keeps its label, help, validation and form value; the attachment owns the suggestion list.</p><p><a href="cem-suggestions-gallery.html">Full examples and variation matrix</a> · <a href="../src/components/cem-suggestions/cem-suggestions.stories.ts">Automated stories</a></p><cem-element><template type="text/cem-ml">
{slice @name=filter | contains}{slice @name=filterBy | label}{slice @name=sourceState | ready}{slice @name=selection | optional}{slice @name=fieldState | default}
{fieldset @role=radiogroup @aria-label="Filter" @slice=filter @slice-event=change @slice-value="$target.value" | {legend | Filter}{cem-radio @name="suggestions-filter" @value="contains" @checked=true | contains}{cem-radio @name="suggestions-filter" @value="prefix" | prefix}{cem-radio @name="suggestions-filter" @value="none" | none}}
{fieldset @role=radiogroup @aria-label="Filter by" @slice=filterBy @slice-event=change @slice-value="$target.value" | {legend | Filter by}{cem-radio @name="suggestions-filterBy" @value="label" @checked=true | label}{cem-radio @name="suggestions-filterBy" @value="value" | value}{cem-radio @name="suggestions-filterBy" @value="label value" | label value}}
{fieldset @role=radiogroup @aria-label="Source state" @slice=sourceState @slice-event=change @slice-value="$target.value" | {legend | Source state}{cem-radio @name="suggestions-sourceState" @value="ready" @checked=true | ready}{cem-radio @name="suggestions-sourceState" @value="pending" | pending}{cem-radio @name="suggestions-sourceState" @value="failed" | failed}}
{fieldset @role=radiogroup @aria-label="Selection requirement" @slice=selection @slice-event=change @slice-value="$target.value" | {legend | Selection requirement}{cem-radio @name="suggestions-selection" @value="optional" @checked=true | optional}{cem-radio @name="suggestions-selection" @value="required" | required}}
{fieldset @role=radiogroup @aria-label="Field state" @slice=fieldState @slice-event=change @slice-value="$target.value" | {legend | Field state}{cem-radio @name="suggestions-fieldState" @value="default" @checked=true | default}{cem-radio @name="suggestions-fieldState" @value="disabled" | disabled}{cem-radio @name="suggestions-fieldState" @value="readonly" | readonly}{cem-radio @name="suggestions-fieldState" @value="invalid" | invalid}}
{slice @name=label | Suggestions}{cem-text-field @label="Listbox name" @value="{$datadom.slices.label}" @slice=label @slice-event=input @slice-value="$target.value"}
{slice @name=selectionMessage | Choose a suggestion.}{cem-text-field @label="Selection error" @value="{$datadom.slices.selectionMessage}" @slice=selectionMessage @slice-event=input @slice-value="$target.value"}
{slice @name=optionsError | }{cem-text-field @label="Failure detail" @value="{$datadom.slices.optionsError}" @slice=optionsError @slice-event=input @slice-value="$target.value"}
{slice @name=pendingMessage | Loading suggestions.}{cem-text-field @label="Pending message" @value="{$datadom.slices.pendingMessage}" @slice=pendingMessage @slice-event=input @slice-value="$target.value"}
{slice @name=failureMessage | Suggestions are unavailable.}{cem-text-field @label="Failure message" @value="{$datadom.slices.failureMessage}" @slice=failureMessage @slice-event=input @slice-value="$target.value"}
{slice @name=emptyMessage | No suggestions available.}{cem-text-field @label="Empty message" @value="{$datadom.slices.emptyMessage}" @slice=emptyMessage @slice-event=input @slice-value="$target.value"}
{slice @name=singleMessage | 1 suggestion available.}{cem-text-field @label="Single message" @value="{$datadom.slices.singleMessage}" @slice=singleMessage @slice-event=input @slice-value="$target.value"}
{slice @name=multipleMessage | %count suggestions available.}{cem-text-field @label="Multiple message" @value="{$datadom.slices.multipleMessage}" @slice=multipleMessage @slice-event=input @slice-value="$target.value"}
{form | {cem-suggestions @label="{$datadom.slices.label}" @filter="{$datadom.slices.filter}" @filter-by={if datadom.slices.filter == "none" {null} else {datadom.slices.filterBy}} @options-state="{$datadom.slices.sourceState}" @require-selection={if datadom.slices.selection == "required" {true} else {null}} @selection-message="{$datadom.slices.selectionMessage}" @options-error="{$datadom.slices.optionsError}" @pending-message="{$datadom.slices.pendingMessage}" @failure-message="{$datadom.slices.failureMessage}" @empty-message="{$datadom.slices.emptyMessage}" @single-message="{$datadom.slices.singleMessage}" @multiple-message="{$datadom.slices.multipleMessage}" |
{template | {cem-field @slot=editor @name=letter @label=Letter @disabled={if datadom.slices.fieldState == "disabled" {true} else {null}} @readonly={if datadom.slices.fieldState == "readonly" {true} else {null}} @invalid={if datadom.slices.fieldState == "invalid" {true} else {null}} | {span @slot=help | Type to filter; use Arrow keys and Enter to commit.}} {template @slot=options | {option @value=a @label=Alpha | Alpha}{option @value=b @label=Beta | Beta}}}}
{cem-action @type=reset | Reset}}
</template></cem-element><table><caption>Local suggestion profiles</caption><tr><th>Input</th><th>Behavior</th></tr>
<tr><td data-gallery-attribute="profile">profile</td><td>listbox (default): custom text-input list. native-datalist: browser-owned choices for text/search/tel/url/single-email/number; omit filtering, selection-proof and label-template controls.</td></tr>
<tr><td data-gallery-attribute="label">label</td><td>Listbox accessible name; default Suggestions. The projected field owns its visible label and help.</td></tr>
<tr><td>filter / filter-by</td><td>contains (default), prefix, none. label (default), value, or label value; omit filter-by with none.</td></tr>
<tr><td>require-selection / selection-message</td><td>Require a committed native row; selection-message localizes the field-owned validity contribution.</td></tr>
<tr><td>options-state / options-error</td><td>ready, pending, failed; plain-text failure override. Pending/failed results cannot commit old rows.</td></tr>
<tr><td><span data-gallery-attribute="pending-message">pending-message</span>, <span data-gallery-attribute="failure-message">failure-message</span>, <span data-gallery-attribute="empty-message">empty-message</span>, <span data-gallery-attribute="single-message">single-message</span>, <span data-gallery-attribute="multiple-message">multiple-message</span></td><td>Localized status text. %count substitutes the eligible count in the multiple message.</td></tr>
<tr><td>editor, options, option, group-label slots</td><td>One direct native field; inert source options; optional isolated text/cem-ml label templates with native suggestion/group parameters.</td></tr>
<tr><td>options / editor-for and revision inputs</td><td>Native host integration only. Explicit references need fresh host grants and conflict with equivalent local slots. No URL/JSON input shortcut.</td></tr>
<tr><td>disabled, readonly, required, name, value, help, validation</td><td>These belong to the field. Attribute presence includes the text false.</td></tr><tr><td><span data-gallery-attribute="hidden">hidden</span>, <span data-gallery-attribute="class">class</span></td><td>Standard host visibility and consumer styling membership.</td></tr></table>
<cem-element><template type="text/cem-ml">
{fieldset | {legend | Native numeric suggestions (browser support varies)}
  {form | {cem-suggestions @profile=native-datalist |
    {template | {cem-field @slot=editor @type=number @name=quantity @label=Quantity @min=0 @max=3 @step=1}
      {template @slot=options | {option @value=1 @label=One}{option @value=2 @label=Two}{option @value=3 @label=Three}}}
  }}
  {p | The native input keeps numeric values and constraints. The browser owns the picker and filtering; this example does not require a suggestion selection.}
}
