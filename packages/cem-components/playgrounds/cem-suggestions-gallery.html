<cem-gallery-page heading="cem-suggestions — Full examples and variation matrix">
<template>
<main>
<p>Suggestions attach to the existing editor in <a href="cem-field-gallery.html">cem-field</a> or <a href="cem-text-field-gallery.html">cem-text-field</a>. The field keeps its label, help, validation and form value; the attachment owns the suggestion list.</p><p><a href="./cem-suggestions.html">Suggestions property playground and source</a> · <a href="../src/components/cem-suggestions/cem-suggestions.stories.ts">Automated stories</a></p><table><caption>First local profile</caption><tr><th>Input</th><th>Behavior</th></tr>
<tr><td data-gallery-attribute="profile">profile</td><td>listbox (default) provides the custom list; native-datalist delegates the popup to the browser.</td></tr>
<tr><td data-gallery-attribute="label">label</td><td>Listbox accessible name; default Suggestions. The projected field owns its visible label and help.</td></tr>
<tr><td>filter / filter-by</td><td>contains (default), prefix, none. label (default), value, or label value; omit filter-by with none.</td></tr>
<tr><td>require-selection / selection-message</td><td>Require a committed native row; selection-message localizes the field-owned validity contribution.</td></tr>
<tr><td>options-state / options-error</td><td>ready, pending, failed; plain-text failure override. Pending/failed results cannot commit old rows.</td></tr>
<tr><td><span data-gallery-attribute="pending-message">pending-message</span>, <span data-gallery-attribute="failure-message">failure-message</span>, <span data-gallery-attribute="empty-message">empty-message</span>, <span data-gallery-attribute="single-message">single-message</span>, <span data-gallery-attribute="multiple-message">multiple-message</span></td><td>Localized status text. %count substitutes the eligible count in the multiple message.</td></tr>
<tr><td>editor, options, option, group-label slots</td><td>One direct native field; inert source options; optional isolated text/cem-ml label templates with native suggestion/group parameters.</td></tr>
<tr><td>options / editor-for and revision inputs</td><td>Native host integration only. Explicit references need fresh host grants and conflict with equivalent local slots. No URL/JSON input shortcut.</td></tr>
<tr><td>disabled, readonly, required, name, value, help, validation</td><td>These belong to the field. Attribute presence includes the text false.</td></tr><tr><td><span data-gallery-attribute="hidden">hidden</span>, <span data-gallery-attribute="class">class</span></td><td>Standard host visibility and consumer styling membership.</td></tr></table><cem-demo-element legend="cem-field form integration" description="Focus opens available suggestions. Arrow keys preview, Enter commits, Escape dismisses. Tab and blur do not commit."><template slot="source"><form><cem-suggestions ><template><cem-field slot="editor" name="letter" label="Letter" ><span slot="help">Choose a letter or type your own value.</span></cem-field><template slot="options"><optgroup label="Letters"><option value="a" label="Alpha">Alpha</option><option value="b" label="Beta">Beta</option><option value="g" disabled>Gamma</option></optgroup></template></template></cem-suggestions><cem-action type="reset">Reset</cem-action></form></template></cem-demo-element>
<cem-demo-element legend="cem-text-field form integration" description="Focus opens available suggestions. Arrow keys preview, Enter commits, Escape dismisses. Tab and blur do not commit."><template slot="source"><form><cem-suggestions ><template><cem-text-field slot="editor" name="letter" label="Letter" ><span slot="help">Choose a letter or type your own value.</span></cem-text-field><template slot="options"><optgroup label="Letters"><option value="a" label="Alpha">Alpha</option><option value="b" label="Beta">Beta</option><option value="g" disabled>Gamma</option></optgroup></template></template></cem-suggestions><cem-action type="reset">Reset</cem-action></form></template></cem-demo-element>
<cem-demo-element legend="Native custom labels" description="Templates receive native row/group nodes. Stored-value hints remain visible inside the owned row."><template slot="source"><cem-suggestions ><template><cem-text-field slot="editor" name="letter" label="Letter" ><span slot="help">Choose a letter or type your own value.</span></cem-text-field><template slot="options"><optgroup label="Letters"><option value="a" label="Alpha">Alpha</option><option value="b" label="Beta">Beta</option><option value="g" disabled>Gamma</option></optgroup></template><template slot="option" type="text/cem-ml">{strong | {$suggestion.dom:attribute("label").value}}</template><template slot="group-label" type="text/cem-ml">{em | {$group.dom:attribute("label").value}}</template></template></cem-suggestions></template></cem-demo-element>

<h2>Audited source examples</h2>
<p>These seven legends map the pinned autocomplete examples to the adopted field attachment. Numeric editing is shown without suggestions; numeric selection awaits an additional native profile. Static material parity markers do not establish these interactions.</p>
<table><caption>Source-intent coverage</caption><tr><th>Source legend</th><th>Current coverage</th></tr>
<tr><td>No value</td><td>Empty labeled field, ordinary editing without a popup.</td></tr>
<tr><td>No value with placeholder</td><td>Native number field and placeholder; no suggestion set.</td></tr>
<tr><td>Value defined</td><td>Initial abc; edits, including empty, survive attachment rerenders.</td></tr>
<tr><td>No initial value with placeholder</td><td>Explicit data values with emoji labels; commit stores apple.</td></tr>
<tr><td>Number, No initial value without placeholder</td><td>Native numeric editing only. Suggestion commits of 1/2/3 with word labels remain deferred.</td></tr>
<tr><td>Options text as value</td><td>Native missing-value fallback collapses ASCII text whitespace.</td></tr>
<tr><td>Options Grouping</td><td>Group labels and filtering; empty groups hide.</td></tr></table>
<cem-demo-element legend="No value" description="The field owns normal editing and its label without a suggestion list."><template slot="source"><form><cem-field name="choice" label="Empty field"></cem-field></form></template></cem-demo-element>
<cem-demo-element legend="No value with placeholder" description="Native number editing preserves the placeholder; this sample has no suggestions."><template slot="source"><form><cem-field name="choice" type="number" label="Number" placeholder="Enter a number"></cem-field></form></template></cem-demo-element>
<cem-demo-element legend="Value defined" description="Edit abc, including clearing it. Attachment rerenders preserve the field's current value."><template slot="source"><form><cem-suggestions><template><cem-text-field slot="editor" name="choice" label="Initial value" value="abc"></cem-text-field><template slot="options"><option value="abc">abc</option><option value="abcd">abcd</option></template></template></cem-suggestions></form></template></cem-demo-element>
<cem-demo-element legend="No initial value with placeholder" description="The emoji label and stored value differ. Selecting Apple commits apple to the original field."><template slot="source"><form><cem-suggestions><template><cem-field slot="editor" name="choice" label="Fruit" placeholder="Choose a fruit"></cem-field><template slot="options"><data value="apple">🍎 Apple</data><data value="strawberry">🍓 Strawberry</data><data value="pear">🍐 Pear</data></template></template></cem-suggestions></form></template></cem-demo-element>
<cem-demo-element legend="Number, No initial value without placeholder" description="Numeric suggestion selection is deferred. This demonstrates only native numeric field editing, without an autocomplete attachment."><template slot="source"><form><cem-field name="choice" type="number" label="Number" min="1" max="3" step="1"></cem-field></form></template></cem-demo-element>
<cem-demo-element legend="Options text as value" description="Without an explicit value, native option text is the stored value after ASCII whitespace collapse."><template slot="source"><form><cem-suggestions><template><cem-text-field slot="editor" name="choice" label="Text value"></cem-text-field><template slot="options"><option>  Apple   pie  </option><option> Pear </option></template></template></cem-suggestions></form></template></cem-demo-element>
<cem-demo-element legend="Options Grouping" description="Filtering matches rows within each group and hides groups with no matching rows."><template slot="source"><form><cem-suggestions filter="prefix"><template><cem-field slot="editor" name="choice" label="Grouped fruit"></cem-field><template slot="options"><optgroup label="Orchard"><option value="apple">Apple</option><option value="pear">Pear</option></optgroup><optgroup label="Berries"><option value="strawberry">Strawberry</option><option value="blueberry">Blueberry</option></optgroup></template></template></cem-suggestions></form></template></cem-demo-element>
<cem-demo-element legend="Native option value and label edges" description="An empty explicit value remains empty. An explicit label differs from stored text, and non-ASCII spacing is preserved."><template slot="source"><form><cem-suggestions filter="none"><template><cem-text-field slot="editor" name="choice" label="Native edges"></cem-text-field><template slot="options"><option value="" label="Clear">Ignored text</option><option label="Display name">  stored   text  </option><option value="explicit" label="Explicit label">Different text</option><option> A&nbsp;B </option></template></template></cem-suggestions></form></template></cem-demo-element>
