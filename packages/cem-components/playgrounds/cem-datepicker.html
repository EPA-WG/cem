<template><p class="component-description">A single-date calendar around your native text input. The input owns labels, validation, reset and form submission; the modal calendar drafts a date until Apply. Use <a href="./cem-field-gallery.html">cem-field</a> for general text and <a href="./cem-autocomplete-gallery.html">cem-autocomplete</a> for suggested values.</p><p><a href="./cem-datepicker-gallery.html">Full examples and variation matrix</a> · <a href="./cem-datepicker.html">Property playground</a> · <a href="https://github.com/EPA-WG/cem/blob/develop/packages/cem-components/src/components/cem-datepicker/cem-datepicker.stories.ts">Automated stories</a></p><main><p>Use YYYY-MM-DD. ArrowDown opens the calendar. Arrows, Home/End and PageUp/PageDown navigate; Shift or Alt with PageUp/PageDown changes year. Enter or Space drafts a date. Apply commits, and Cancel or Escape restores focus without changing the input.</p><cem-element class="properties"><template type="text/cem-ml">
