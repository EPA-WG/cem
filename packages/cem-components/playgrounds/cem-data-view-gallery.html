{cem-element @tag=cem-data-view @src="@epa-wg/cem-components/components/cem-data-view/cem-data-view.xhtml#cem-data-view"}

<cem-gallery-page heading="cem-data-view: Full examples and variation matrix"><template>
<p class="component-description">Native JSON and CSV become bounded tables or structural text. This data preview complements the authored <a href="./cem-table-gallery.html">cem-table</a> wrapper and the editable <a href="./cem-source-editor-gallery.html">cem-source-editor</a>.</p>
<p><a href="./cem-data-view.html">Property playground</a> · <a href="https://github.com/EPA-WG/cem/blob/develop/packages/cem-components/src/components/cem-data-view/cem-data-view.stories.ts">Automated stories</a></p>
<p><code>value</code> supplies original text; <code>format="json|csv"</code> selects the native importer. <code>label</code> is visible fallback text, a label slot replaces it, and <code>aria-label</code> can name the view independently. The viewer is passive: disabled, invalid, pending, readonly and selected are not viewer states. Empty data and native errors are shown explicitly.</p>
<h2>Public attributes and slots</h2>
<table><caption>Public attribute inventory</caption><thead><tr><th>Attribute</th><th>Contract</th></tr></thead><tbody>
<tr data-gallery-attribute="value"><th>value</th><td>Original source text; empty by default. JSON and CSV are imported natively.</td></tr>
<tr data-gallery-attribute="format"><th>format</th><td>json by default; csv explicitly selects the CSV importer. Unsupported values show an error.</td></tr>
<tr data-gallery-attribute="label"><th>label</th><td>Visible caption or structural heading; Data by default. The label slot replaces this fallback.</td></tr>
<tr data-gallery-attribute="aria-label"><th>aria-label</th><td>Optional independent accessible name.</td></tr>
<tr data-gallery-attribute="data-cem-density"><th>data-cem-density</th><td>Inherited compact or super-compact theme profile; default retains normal dimensions.</td></tr>
<tr data-gallery-attribute="class"><th>class</th><td>Inherited theme classes and ordinary host styling.</td></tr>
<tr data-gallery-attribute="hidden"><th>hidden</th><td>Presence hides the complete passive view; until-found retains native semantics.</td></tr>
</tbody></table>
<main>
<cem-demo-element legend="Typed JSON values" description="Object and primitive rows share a column union. Null, an empty string, an absent cell and empty containers stay distinct."><template>
<cem-data-view label="Typed values" data-cem-density="super-compact" value='[{"name":"","value":null},{"name":"Ada"},3,false,[],{}]'></cem-data-view>
</template></cem-demo-element>
<cem-demo-element legend="Quoted CSV" description="The native CSV importer preserves a quoted comma and embedded newline; JavaScript does not parse the document."><template>
<cem-data-view format="csv" label="People" data-cem-density="super-compact" value='name,note
Ada,"first, second"
Bob,"line one
line two"'></cem-data-view>
</template></cem-demo-element>
<cem-demo-element legend="Nested and empty structure" description="Objects use a bounded structural projection. Empty containers and scalar roots are explicit."><template>
<cem-data-view label="Nested record" data-cem-density="super-compact" value='{"name":"Ada","address":{"city":"Amsterdam"},"empty":[],"nothing":null}'></cem-data-view>
<cem-data-view label="Empty collection" value="[]"></cem-data-view>
<cem-data-view hidden label="Hidden collection" value="[]"></cem-data-view>
</template></cem-demo-element>
<cem-demo-element legend="Visible and accessible labels" description="Projected markup replaces the visible fallback while aria-label independently names the table."><template>
<cem-data-view label="Fallback label" aria-label="Source measurements" value='[{"value":7}]'><strong slot="label">Measurements</strong></cem-data-view>
</template></cem-demo-element>
<cem-demo-element legend="Malformed and unsupported input" description="Native diagnostics remain visible and source text is never executed as markup."><template>
<cem-data-view label="Malformed JSON" value="["></cem-data-view>
<cem-data-view label="Unsupported format" format="xml" value="&lt;root/&gt;"></cem-data-view>
</template></cem-demo-element>
<cem-demo-element legend="Bounded nested structure" description="Four nested levels retain a visible depth-limit notice; the original project resource is unchanged."><template>
<cem-data-view label="Depth limit" value='{"a":{"b":{"c":{"d":{"hidden":"Beyond preview depth"}}}}}'></cem-data-view>
</template></cem-demo-element>
<section><h2>Theme and density matrix</h2><p>Rows use normal, compact and paragraph-line profiles. Text wraps at narrow widths and zoom; no extra vertical row padding or gaps are added in the desktop paragraph-line profile. Touch and hybrid devices retain larger dimensions. The passive data view has no hover, press or selection commands; keyboard focus belongs to its scroll region.</p>
<cem-demo-element legend="light density comparison" description="One native source in each inherited density profile; these fixed example themes remain independent of the page theme."><template>
<div class="cem-theme-light" data-gallery-theme="light">
<cem-data-view label="Default" value='[{"name":"Ada","count":3},{"name":"Bob","count":7}]'></cem-data-view>
<cem-data-view label="Compact" data-cem-density="compact" value='[{"name":"Ada","count":3},{"name":"Bob","count":7}]'></cem-data-view>
<cem-data-view label="Paragraph lines" data-cem-density="super-compact" value='[{"name":"Ada","count":3},{"name":"Bob","count":7}]'></cem-data-view>
</div>
</template></cem-demo-element>
<cem-demo-element legend="dark density comparison" description="One native source in each inherited density profile; these fixed example themes remain independent of the page theme."><template>
<div class="cem-theme-dark" data-gallery-theme="dark">
<cem-data-view label="Default" value='[{"name":"Ada","count":3},{"name":"Bob","count":7}]'></cem-data-view>
<cem-data-view label="Compact" data-cem-density="compact" value='[{"name":"Ada","count":3},{"name":"Bob","count":7}]'></cem-data-view>
<cem-data-view label="Paragraph lines" data-cem-density="super-compact" value='[{"name":"Ada","count":3},{"name":"Bob","count":7}]'></cem-data-view>
</div>
</template></cem-demo-element>
<cem-demo-element legend="contrast-light density comparison" description="One native source in each inherited density profile; these fixed example themes remain independent of the page theme."><template>
<div class="cem-theme-contrast-light" data-gallery-theme="contrast-light">
<cem-data-view label="Default" value='[{"name":"Ada","count":3},{"name":"Bob","count":7}]'></cem-data-view>
<cem-data-view label="Compact" data-cem-density="compact" value='[{"name":"Ada","count":3},{"name":"Bob","count":7}]'></cem-data-view>
<cem-data-view label="Paragraph lines" data-cem-density="super-compact" value='[{"name":"Ada","count":3},{"name":"Bob","count":7}]'></cem-data-view>
</div>
</template></cem-demo-element>
<cem-demo-element legend="contrast-dark density comparison" description="One native source in each inherited density profile; these fixed example themes remain independent of the page theme."><template>
<div class="cem-theme-contrast-dark" data-gallery-theme="contrast-dark">
<cem-data-view label="Default" value='[{"name":"Ada","count":3},{"name":"Bob","count":7}]'></cem-data-view>
<cem-data-view label="Compact" data-cem-density="compact" value='[{"name":"Ada","count":3},{"name":"Bob","count":7}]'></cem-data-view>
<cem-data-view label="Paragraph lines" data-cem-density="super-compact" value='[{"name":"Ada","count":3},{"name":"Bob","count":7}]'></cem-data-view>
</div>
</template></cem-demo-element>
<cem-demo-element legend="native density comparison" description="One native source in each inherited density profile; these fixed example themes remain independent of the page theme."><template>
<div class="cem-theme-native" data-gallery-theme="native">
<cem-data-view label="Default" value='[{"name":"Ada","count":3},{"name":"Bob","count":7}]'></cem-data-view>
<cem-data-view label="Compact" data-cem-density="compact" value='[{"name":"Ada","count":3},{"name":"Bob","count":7}]'></cem-data-view>
<cem-data-view label="Paragraph lines" data-cem-density="super-compact" value='[{"name":"Ada","count":3},{"name":"Bob","count":7}]'></cem-data-view>
</div>
</template></cem-demo-element>
</section><p>Preview bounds are 65,536 Unicode characters before import, 100 rows, 32 columns/properties, four nested levels and 2,048 scalar characters. Every truncation is labeled. Open the property playground to edit source and observe errors; use the automated stories for all bound cases.</p></main></template></cem-gallery-page></body></html>
