<!doctype html>
<html lang="en" dir="ltr">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Menu keyboard navigation</title>
    <script type="importmap">{
    "imports": {
        "@epa-wg/cem-elements": "../../cem-elements/dist/index.js",
        "@epa-wg/cem-demo-element": "../../cem-demo-element/dist/index.js",
        "@epa-wg/cem-ml/wasm": "../../cem-ml-npm/dist/wasm/browser/cem_ml.js",
        "@epa-wg/cem-theme/styles.css": "../../cem-theme/dist/lib/css/cem-combined.css",
        "@epa-wg/cem-components/styles.css": "../dist/styles.css",
        "@epa-wg/cem-components/action-demo": "./cem-action-gallery.html",
        "@epa-wg/cem-components/action-playground": "./cem-action.html",
        "@epa-wg/cem-components/theme-switch-playground": "./cem-theme-switch.html",
        "@epa-wg/cem-components/components/": "../src/components/",
        "@epa-wg/cem-components/playgrounds/": "./"
    }
}</script>
    <link rel="stylesheet" href="../../cem-theme/dist/lib/css/cem-combined.css">
    <script type="module">
        import { installCemElementRuntime } from '@epa-wg/cem-elements';
        window.cemPlaygroundRuntime = installCemElementRuntime(window);
        document.addEventListener('click', event => {
            const item = event.target.closest('button[role=menuitem]');
            if (item && !event.defaultPrevented && !item.hasAttribute('aria-haspopup')) {
                document.querySelector('output').value = item.textContent;
            }
        });
    </script>
</head>
<body class="cem-theme-light" keynav>
<cem-element tag="cem-menu-item" capability="action-control" src="@epa-wg/cem-components/components/cem-menu-item/cem-menu-item.xhtml#cem-menu-item"></cem-element>
<cem-element tag="cem-menu" capability="composite-menu" src="@epa-wg/cem-components/components/cem-menu/cem-menu.xhtml#cem-menu"></cem-element>
<cem-element tag="cem-dropdown" capability="popup" src="@epa-wg/cem-components/components/cem-dropdown/cem-dropdown.xhtml#cem-dropdown"></cem-element>
<h1>Menu keyboard navigation</h1>
<section>
    <h2>Horizontal menubar</h2>
    <cem-menu direction="row" aria-label="Horizontal menubar">
        <cem-menu-item label="File">
            <cem-menu direction="column" aria-label="File" slot="submenu" id="horizontal-file">
                <cem-menu-item label="New"></cem-menu-item>
                <cem-menu-item label="Export">
                    <cem-menu direction="column" aria-label="Export" slot="submenu" id="horizontal-export">
                        <cem-menu-item label="PDF"></cem-menu-item>
                        <cem-menu-item label="SVG"></cem-menu-item>
                    </cem-menu>
                </cem-menu-item>
                <cem-menu-item label="Save"></cem-menu-item>
            </cem-menu>
        </cem-menu-item>
        <cem-menu-item label="Help"></cem-menu-item>
        <cem-menu-item label="Edit">
            <cem-menu direction="column" aria-label="Edit" slot="submenu" id="horizontal-edit">
                <cem-menu-item label="Copy"></cem-menu-item>
                <cem-menu-item label="Paste"></cem-menu-item>
            </cem-menu>
        </cem-menu-item>
        <cem-menu-item label="Unavailable" aria-disabled="true">
            <cem-menu direction="column" aria-label="Unavailable" slot="submenu" id="horizontal-unavailable">
                <cem-menu-item label="Print"></cem-menu-item>
            </cem-menu>
        </cem-menu-item>
        <cem-menu-item label="View">
            <cem-menu direction="column" aria-label="View" slot="submenu" id="horizontal-view">
                <cem-menu-item label="Zoom"></cem-menu-item>
            </cem-menu>
        </cem-menu-item>
    </cem-menu>
</section>
<section>
    <h2>Vertical menubar</h2>
    <cem-menu direction="column" aria-label="Vertical menubar">
        <cem-menu-item label="File">
            <cem-menu direction="column" aria-label="File" slot="submenu" id="vertical-file">
                <cem-menu-item label="New"></cem-menu-item>
                <cem-menu-item label="Export">
                    <cem-menu direction="column" aria-label="Export" slot="submenu" id="vertical-export">
                        <cem-menu-item label="PDF"></cem-menu-item>
                        <cem-menu-item label="SVG"></cem-menu-item>
                    </cem-menu>
                </cem-menu-item>
                <cem-menu-item label="Save"></cem-menu-item>
            </cem-menu>
        </cem-menu-item>
        <cem-menu-item label="Help"></cem-menu-item>
        <cem-menu-item label="Edit">
            <cem-menu direction="row" aria-label="Edit" slot="submenu" id="vertical-edit">
                <cem-menu-item label="Copy"></cem-menu-item>
                <cem-menu-item label="Paste"></cem-menu-item>
            </cem-menu>
        </cem-menu-item>
        <cem-menu-item label="Unavailable" aria-disabled="true">
            <cem-menu direction="column" aria-label="Unavailable" slot="submenu" id="vertical-unavailable">
                <cem-menu-item label="Print"></cem-menu-item>
            </cem-menu>
        </cem-menu-item>
        <cem-menu-item label="View">
            <cem-menu direction="column" aria-label="View" slot="submenu" id="vertical-view">
                <cem-menu-item label="Zoom"></cem-menu-item>
            </cem-menu>
        </cem-menu-item>
    </cem-menu>
</section>
<section>
    <h2>Standalone menu button</h2>
    <cem-dropdown id="actions" open="false" label="Options">
        <cem-menu direction="column" aria-label="Actions">
            <cem-menu-item label="Print"></cem-menu-item>
            <cem-menu-item label="Save"></cem-menu-item>
        </cem-menu>
    </cem-dropdown>
</section>
<output aria-live="polite"></output>
</body>
</html>
