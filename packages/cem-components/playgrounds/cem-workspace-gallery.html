<cem-gallery-page heading="cem-workspace: Full examples and variation matrix"><template><p class="component-description">A persistent workspace with project navigation, a current-file editor, preview and supporting tools. Compose <a href="./cem-tree-gallery.html">cem-tree</a>, <a href="./cem-tabs-gallery.html">cem-tabs</a> and <a href="./cem-media-preview-gallery.html">cem-media-preview</a> inside its named regions.</p><p><a href="./cem-workspace-gallery.html">Full examples and variation matrix</a> · <a href="./cem-workspace.html">Property playground</a> · <a href="https://github.com/EPA-WG/cem/blob/develop/packages/cem-components/src/components/cem-workspace/cem-workspace.stories.ts">Automated stories</a></p><main><h2>Public attributes and slots</h2><table><caption>Public attribute inventory</caption><thead><tr><th>Attribute</th><th>Contract</th></tr></thead><tbody><tr data-gallery-attribute="appearance"><th>appearance</th><td>surface (default) keeps insets and pane gaps; flush removes them while retaining compact region headings and navigation actions.</td></tr><tr data-gallery-attribute="layout"><th><code>layout</code></th><td>workbench (default) shows four regions; browser shows navigation and contents; project shows navigation, editor and independent preview.</td></tr><tr data-gallery-attribute="label"><th><code>label</code></th><td>Names the complete workspace; aria-label can name it independently.</td></tr><tr data-gallery-attribute="aria-label"><th><code>aria-label</code></th><td>Overrides the accessible workspace name independently of its labels.</td></tr><tr data-gallery-attribute="navigation-label"><th><code>navigation-label</code></th><td>Project explorer by default.</td></tr><tr data-gallery-attribute="editor-label"><th><code>editor-label</code></th><td>Current file editor by default.</td></tr><tr data-gallery-attribute="preview-label"><th><code>preview-label</code></th><td>Preview by default.</td></tr><tr data-gallery-attribute="tools-label"><th><code>tools-label</code></th><td>Commands and diagnostics by default.</td></tr><tr data-gallery-attribute="fit"><th><code>fit</code></th><td>content (default) uses natural height; fill uses a bounded parent at large container widths.</td></tr><tr data-gallery-attribute="class"><th><code>class</code></th><td>Consumer styling class; layout and paint remain theme-owned.</td></tr><tr data-gallery-attribute="hidden"><th><code>hidden</code></th><td>Native presence-based host visibility, preserving hidden=until-found.</td></tr><tr data-gallery-attribute="dir"><th><code>dir</code></th><td>Inherited ltr/rtl flow.</td></tr></tbody></table><p>Named content slots: navigation, editor, preview and tools. Each region also accepts a matching -heading slot to replace its visible heading. Container widths below 840px stack regions; 840px adds a sidebar; 1200px places editor and preview side by side. DOM order and focus remain unchanged.</p><section aria-label="Theme variation matrix"><h2>Five theme modes</h2><div class="cem-theme-light" data-gallery-theme="light"><cem-demo-element legend="light workspace" description="Compare region labels, spacing, retained content and responsive layout."><template slot="source"><cem-workspace><nav slot="navigation" aria-label="Example files"><p>Project / templates</p><p>view.cemt</p></nav><label slot="editor">Current file <textarea rows="8">{section | Supplier availability}</textarea></label><article slot="preview"><h3>Supplier availability</h3><p>SKU-A — 7 — available</p></article><section slot="tools" aria-label="Example diagnostics">No diagnostics</section></cem-workspace></template></cem-demo-element></div><div class="cem-theme-dark" data-gallery-theme="dark"><cem-demo-element legend="dark workspace" description="Compare region labels, spacing, retained content and responsive layout."><template slot="source"><cem-workspace><nav slot="navigation" aria-label="Example files"><p>Project / templates</p><p>view.cemt</p></nav><label slot="editor">Current file <textarea rows="8">{section | Supplier availability}</textarea></label><article slot="preview"><h3>Supplier availability</h3><p>SKU-A — 7 — available</p></article><section slot="tools" aria-label="Example diagnostics">No diagnostics</section></cem-workspace></template></cem-demo-element></div><div class="cem-theme-contrast-light" data-gallery-theme="contrast-light"><cem-demo-element legend="contrast-light workspace" description="Compare region labels, spacing, retained content and responsive layout."><template slot="source"><cem-workspace><nav slot="navigation" aria-label="Example files"><p>Project / templates</p><p>view.cemt</p></nav><label slot="editor">Current file <textarea rows="8">{section | Supplier availability}</textarea></label><article slot="preview"><h3>Supplier availability</h3><p>SKU-A — 7 — available</p></article><section slot="tools" aria-label="Example diagnostics">No diagnostics</section></cem-workspace></template></cem-demo-element></div><div class="cem-theme-contrast-dark" data-gallery-theme="contrast-dark"><cem-demo-element legend="contrast-dark workspace" description="Compare region labels, spacing, retained content and responsive layout."><template slot="source"><cem-workspace><nav slot="navigation" aria-label="Example files"><p>Project / templates</p><p>view.cemt</p></nav><label slot="editor">Current file <textarea rows="8">{section | Supplier availability}</textarea></label><article slot="preview"><h3>Supplier availability</h3><p>SKU-A — 7 — available</p></article><section slot="tools" aria-label="Example diagnostics">No diagnostics</section></cem-workspace></template></cem-demo-element></div><div class="cem-theme-native" data-gallery-theme="native"><cem-demo-element legend="native workspace" description="Compare region labels, spacing, retained content and responsive layout."><template slot="source"><cem-workspace><nav slot="navigation" aria-label="Example files"><p>Project / templates</p><p>view.cemt</p></nav><label slot="editor">Current file <textarea rows="8">{section | Supplier availability}</textarea></label><article slot="preview"><h3>Supplier availability</h3><p>SKU-A — 7 — available</p></article><section slot="tools" aria-label="Example diagnostics">No diagnostics</section></cem-workspace></template></cem-demo-element></div></section><cem-demo-element legend="Accessible headings" description="Projected heading markup overrides visible fallback text; aria-label names the workspace separately."><template slot="source"><cem-workspace label="Authoring" aria-label="Supplier authoring workspace"><span slot="editor-heading">Source <strong>view.cemt</strong></span><nav slot="navigation">Files</nav><p slot="editor">Current source</p><p slot="preview">Rendered output</p><p slot="tools">Commands</p></cem-workspace></template></cem-demo-element><cem-demo-element legend="Bounded desktop workspace" description="Fill a definite parent height; regions scroll internally on wide containers and stack naturally below the semantic breakpoints."><template slot="source"><div style="block-size:70vb"><cem-workspace fit="fill"><nav slot="navigation">Files</nav><label slot="editor">Source <textarea rows="12">{h1 | Current file}</textarea></label><article slot="preview">Rendered output</article><section slot="tools">Commands and diagnostics</section></cem-workspace></div></template></cem-demo-element><cem-demo-element legend="Folder browser" description="Use layout=browser for a navigation column and one selected folder/file region. Preview and tools regions are omitted from the visible layout."><template slot="source"><cem-workspace layout="browser" navigation-label="Navigation" editor-label="Contents"><nav slot="navigation">Samples · Saved projects · Files</nav><article slot="editor"><h3>Project folder</h3><p>Files and subfolders are rendered from application data.</p></article></cem-workspace></template></cem-demo-element><cem-demo-element legend="Independent project preview" description="Project layout retains the source editor and build preview in separate regions, beside navigation on wide containers and stacked on narrow containers."><template slot="source"><div style="block-size:70vb"><cem-workspace layout="project" fit="fill"><nav slot="navigation">Project files and folders</nav><label slot="editor">Current source <textarea rows="8">{main | Editable document}</textarea></label><article slot="preview"><h3>Last successful build</h3><p>Preview selection is independent of the selected source file.</p></article></cem-workspace></div></template></cem-demo-element><cem-demo-element legend="Flush compact workspace" description="Use a shared compact theme with flush pane boundaries; navigation retains its heading and contextual actions."><template slot="source"><div data-cem-density="compact"><cem-workspace appearance="flush" layout="project"><nav slot="navigation" aria-label="Project panels">Projects · Structure · Output files</nav><p slot="editor">Selected project build or file editor</p><p slot="preview">Generated output</p></cem-workspace></div></template></cem-demo-element></main></template></cem-gallery-page></body></html>
