<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CEM release bundle playground</title>
<script type="importmap">{
    "imports": {
        "@epa-wg/cem-elements": "../../cem-elements/dist/index.js",
        "@epa-wg/cem-components": "../dist/lib/primitives.js",
        "@epa-wg/cem-demo-element": "../../cem-demo-element/dist/index.js",
        "@epa-wg/cem-ml/wasm": "../../cem-ml-npm/dist/wasm/browser/cem_ml.js",
        "@epa-wg/cem-theme/styles.css": "../../cem-theme/dist/lib/css/cem-combined.css",
        "@epa-wg/cem-components/styles.css": "../dist/styles.css",
        "@epa-wg/cem-components/components/cem-action": "../src/components/cem-action/cem-action.xhtml",
        "@epa-wg/cem-components/action-demo": "./cem-action-gallery.html",
        "@epa-wg/cem-components/action-playground": "./cem-action.html",
        "@epa-wg/cem-components/components/cem-theme-switch": "../src/components/cem-theme-switch/cem-theme-switch.xhtml",
        "@epa-wg/cem-components/theme-switch-playground": "./cem-theme-switch.html",
        "@epa-wg/cem-components/components/cem-select": "../src/components/cem-select/cem-select.xhtml",
        "@epa-wg/cem-components/components.xhtml": "../dist/components.xhtml",
        "@epa-wg/cem-components/components/cem-icon-button": "../src/components/cem-icon-button/cem-icon-button.xhtml",
        "@epa-wg/cem-components/components/cem-menu-item": "../src/components/cem-menu-item/cem-menu-item.xhtml",
        "@epa-wg/cem-components/components/cem-icon": "../src/components/cem-icon/cem-icon.xhtml",
        "@epa-wg/cem-components/components/cem-textarea": "../src/components/cem-textarea/cem-textarea.xhtml",
        "@epa-wg/cem-components/playgrounds/cem-gallery-nav.xhtml": "./cem-gallery-nav.xhtml"
    }
}</script>
<script type="module">
import { installCemElementRuntime } from '@epa-wg/cem-elements';
window.cemPlaygroundRuntime = installCemElementRuntime(window, { processingPoolPolicy: { queueSize: 512 } });
</script>
<style>body { margin: 0; font-family: system-ui, sans-serif; } #bundle-theme { padding: 2rem; min-height: 100vh; box-sizing: border-box; } main { display: grid; gap: 1.5rem; max-width: 40rem; } </style>
</head>
<body>
<cem-element hidden><template type="text/cem-ml">
{cem-module-url @slice=galleryNavUrl @src="@epa-wg/cem-components/playgrounds/cem-gallery-nav.xhtml"}
{cem:if @test="datadom.slices.galleryNavUrl" | {cem-element @tag=cem-gallery-nav @src="{$datadom.slices.galleryNavUrl}#cem-gallery-nav"}}

{cem-module-url @slice=bundleUrl @src="@epa-wg/cem-components/components.xhtml"}
{cem-module-url @slice=themeUrl @src="@epa-wg/cem-theme/styles.css"}
{cem:if @test="datadom.slices.themeUrl" | {link @rel=stylesheet @href="{$datadom.slices.themeUrl}"}}
{cem:if @test="datadom.slices.bundleUrl" |
  {cem-element @tag=cem-icon @src="{$datadom.slices.bundleUrl}#cem-icon"}
  {cem-element @tag=cem-icon-button @src="{$datadom.slices.bundleUrl}#cem-icon-button"}
  {cem-element @tag=cem-menu-item @src="{$datadom.slices.bundleUrl}#cem-menu-item"}
  {cem-element @tag=cem-field @capability=form-control @src="{$datadom.slices.bundleUrl}#cem-field"}
  {cem-element @tag=cem-textarea @capability=form-control @src="{$datadom.slices.bundleUrl}#cem-textarea"}
  {cem-element @tag=cem-text-field @capability=form-control @src="{$datadom.slices.bundleUrl}#cem-text-field"}
  {cem-element @tag=cem-action @src="{$datadom.slices.bundleUrl}#cem-action"}
  {cem-element @tag=cem-select @capability=choice-select @src="{$datadom.slices.bundleUrl}#cem-select"}
  {cem-element @tag=cem-theme-switch @src="{$datadom.slices.bundleUrl}#cem-theme-switch"}
}
</template></cem-element>
<cem-theme-switch id="bundle-theme" mode="light">
<cem-gallery-nav heading="CEM release bundle"></cem-gallery-nav>


<p>These components load from the generated <code>components.xhtml</code> through their template IDs.</p>
<main>
<cem-field id="bundle-field" label="Bundled field" value="Field value"></cem-field>
<cem-textarea id="bundle-textarea" label="Bundled notes" value="First line&#10;Second line"></cem-textarea>
<cem-text-field id="bundle-text-field" label="Bundled text field" value="Text value"></cem-text-field>
<cem-icon id="bundle-icon" image="★" aria-label="Bundled star"></cem-icon>
<cem-icon-button image="settings" id="bundle-icon-button" label="Bundled icon command"></cem-icon-button>
<cem-menu-item id="bundle-menu-item">Bundled menu command</cem-menu-item>
<cem-action id="bundle-action" label="Bundled action" size="large" selected selectable></cem-action>
<cem-select id="bundle-select" label="Bundled select" name="person" value="ada">
<cem-option value="ada">Ada</cem-option><cem-option value="grace">Grace</cem-option>
</cem-select>
<p><a href="./cem-action.html">Action properties</a> · <a href="./cem-select.html">Select properties</a></p>
<p>Individual definitions and their source playgrounds remain included. The bundle preserves each declaration's original resource base.</p>
</main>
</cem-theme-switch>
</body></html>
