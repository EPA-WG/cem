<template><p class="component-description">Native linear progress for known or unknown work. Presence of value selects determinate mode; the browser normalizes the range. Use <a href="./cem-progress-spinner-gallery.html">cem-progress-spinner</a> for a circular graphic.</p><p><a href="./cem-progress-gallery.html">Full examples and variation matrix</a> · <a href="./cem-progress.html">Property playground</a> · <a href="https://github.com/EPA-WG/cem/blob/develop/packages/cem-components/src/components/cem-progress/cem-progress.stories.ts">Automated stories</a></p><main><cem-element class="properties"><template type="text/cem-ml">{slice @name=label | Upload progress}{cem-field @label="label" @value="{$datadom.slices.label}" @slice=label @slice-event=input @slice-value="$target.value"}
{slice @name=class | }{cem-field @label="class" @value="{$datadom.slices.class}" @slice=class @slice-event=input @slice-value="$target.value"}
{slice @name=dir | ltr}{fieldset @role=group @aria-label="dir" @slice=dir @slice-event=change @slice-value="$target.value" | {legend | dir}{cem-radio @name="property-dir" @value="ltr" @label="ltr" @checked={if datadom.slices.dir == "ltr" {true} else {null}}}{cem-radio @name="property-dir" @value="rtl" @label="rtl" @checked={if datadom.slices.dir == "rtl" {true} else {null}}}}
{slice @name=hidden | absent}{fieldset @role=group @aria-label="hidden" @slice=hidden @slice-event=change @slice-value="$target.value" | {legend | hidden}{cem-radio @name="property-hidden" @value="absent" @label="absent" @checked={if datadom.slices.hidden == "absent" {true} else {null}}}{cem-radio @name="property-hidden" @value="present" @label="present" @checked={if datadom.slices.hidden == "present" {true} else {null}}}}
{slice @name=mode | indeterminate}{fieldset @role=group @aria-label="mode" @slice=mode @slice-event=change @slice-value="$target.value" | {legend | mode}{cem-radio @name="property-mode" @value="indeterminate" @label="indeterminate" @checked={if datadom.slices.mode == "indeterminate" {true} else {null}}}{cem-radio @name="property-mode" @value="determinate" @label="determinate" @checked={if datadom.slices.mode == "determinate" {true} else {null}}}}
{slice @name=value | 25}{cem-field @label="value" @value="{$datadom.slices.value}" @slice=value @slice-event=input @slice-value="$target.value"}
