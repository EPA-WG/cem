<cem-element xmlns="http://www.w3.org/1999/xhtml" tag="cem-gallery-nav">
  <!-- Shared documentation chrome with an interactive theme selector. -->
  <template id="cem-gallery-nav" type="text/cem-ml">
    {cem-element @tag=cem-icon-button @src="../src/components/cem-icon-button/cem-icon-button.xhtml#cem-icon-button"}
    {cem-element @tag=cem-theme-switch @src="../src/components/cem-theme-switch/cem-theme-switch.xhtml#cem-theme-switch"}
    {attribute @name=heading | Components}
    {attribute @name=index-href | ./index.html}
    {style @type="text/css" |```
      :scope { display: block; margin-block-end: var(--cem-dim-large); }
      [part~='navigation'] {
        display: flex;
        align-items: center;
        gap: var(--cem-gap-related);
        padding-block: var(--cem-dim-small);
        border-block-end: var(--cem-stroke-boundary) solid currentColor;
      }
      [part~='title'] {
        flex: 1;
        min-inline-size: 0;
        margin: 0;
        overflow-wrap: anywhere;
        font-family: var(--cem-typography-ui-font-family);
        font-size: var(--cem-typography-size-xl);
        font-weight: var(--cem-typography-heading-font-weight);
      }
    ```}
    {nav @part=navigation @aria-label="Gallery navigation" |
      {cem-icon-button @part=index @href="{$index-href}" @image="⌂" @variant=contextual @aria-label="Component playground" | Playground}
      {h1 @part=title | {$heading}}
      {cem-theme-switch @part=theme @storage-key={datadom.attributes.theme-storage-key ?? "cem-theme"} @value={datadom.attributes.theme-value}}
    }
  </template>
</cem-element>
