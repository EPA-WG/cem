<cem-gallery-page id="playground-theme" heading="cem-theme-switch: Full examples and variation matrix">
<template>

<header>
<p class="component-description">A theme selector for light, dark, native, and contrast modes that applies the chosen theme to its child content. Use it around components such as <a href="./cem-action-gallery.html"><code>cem-action</code></a>, <a href="./cem-field-gallery.html"><code>cem-field</code></a>, and <a href="./cem-select-gallery.html"><code>cem-select</code></a> to compare their themed appearance.</p>
<p><a href="./cem-theme-switch.html">Property playground</a> · <a href="https://github.com/EPA-WG/cem/blob/develop/packages/cem-components/src/components/cem-theme-switch/cem-theme-switch.stories.ts">Automated stories</a></p></header><main>
<style>[data-gallery-theme] { padding: var(--cem-dim-large); background-color: var(--cem-palette-comfort); color: var(--cem-palette-comfort-text); } .examples { display: grid; gap: var(--cem-dim-large); grid-template-columns: repeat(auto-fit, minmax(min(100%, 18rem), 1fr)); } cem-demo-element { display: block; margin-block: var(--cem-dim-large); }</style><p>Hover each enabled control, hold a pointer press, and use Tab for keyboard focus. States below are real component attributes. The five theme rows stay fixed so you can compare the same states side by side.</p>
<p>The contextual ◐ icon button opens a keyboard-accessible menu. Light is the default; each example uses its own storage key and restores its last selection on reload. Current menu choices use selected-action styling. Mode and contrast provide the initial choice; the default slot preserves child content while switching.</p><h2>Public attributes and slots</h2><ul><li data-gallery-attribute="mode"><code>mode</code></li>
<li data-gallery-attribute="contrast"><code>contrast</code></li>
<li data-gallery-attribute="storage-key"><code>storage-key</code></li>
<li data-gallery-attribute="value"><code>value</code></li>
<li data-gallery-attribute="theme-command"><code>theme-command</code></li>
<li data-gallery-attribute="hidden"><code>hidden</code></li>
<li data-gallery-attribute="class"><code>class</code></li></ul>
<p><strong>Slots:</strong> The default slot contains the content whose theme is controlled.</p>
<cem-demo-element legend="Default mode and projected content"><template slot="source">
<cem-theme-switch storage-key="default-theme"><p>Default slot content follows the selected theme.</p></cem-theme-switch>
</template></cem-demo-element>
<cem-demo-element legend="Saved selection and retained input"><template slot="source">
<cem-theme-switch storage-key="retained-theme" mode="dark" contrast="true" class="consumer-theme"><label>Retained value <input value="Draft"></label><p>Select another theme and reload: the selection is restored.</p></cem-theme-switch>
</template></cem-demo-element>
<cem-demo-element legend="Hidden by presence"><template slot="source">
<cem-theme-switch storage-key="hidden-theme" hidden="false"><p>Hidden by presence.</p></cem-theme-switch>
</template></cem-demo-element>
</main>
<section aria-label="Theme and state variation matrix">
<h2>Theme and state variation matrix</h2>
<section data-gallery-theme="light" class="cem-theme-light"><h2>light</h2><div class="examples"><article data-variation="Light"><h3>Light</h3><cem-theme-switch storage-key="light-Light" mode="light"><p>Projected content</p></cem-theme-switch></article>
<article data-variation="Dark"><h3>Dark</h3><cem-theme-switch storage-key="light-Dark" mode="dark"><p>Projected content</p></cem-theme-switch></article>
<article data-variation="Light contrast"><h3>Light contrast</h3><cem-theme-switch storage-key="light-Light-contrast" mode="light" contrast="true"><p>Projected content</p></cem-theme-switch></article>
<article data-variation="Dark contrast"><h3>Dark contrast</h3><cem-theme-switch storage-key="light-Dark-contrast" mode="dark" contrast="true"><p>Projected content</p></cem-theme-switch></article>
