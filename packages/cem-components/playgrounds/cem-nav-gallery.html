<template><p class="component-description">A navigation landmark with optional disclosure. Its links keep native navigation; use <a href="./cem-tabs-gallery.html">cem-tabs</a> to switch local views.</p><p><a href="./cem-nav-gallery.html">Full examples and variation matrix</a> · <a href="./cem-nav.html">Property playground</a> · <a href="https://github.com/EPA-WG/cem/blob/develop/packages/cem-components/src/components/cem-nav/cem-nav.stories.ts">Automated stories</a></p><main><h2>Public attributes and slots</h2><p>label (Navigation), aria-label, collapsible, expanded; the default slot accepts navigation-variant cem-icon-button links and ordinary native navigation content. Navigation controls keep their own native link semantics and aria-current values. Native aria-current and aria-disabled remain authored facts. Class, hidden and dir use native host behavior. Boolean attributes use presence, including empty and false-valued attributes.</p><table><caption>Public attribute inventory</caption><thead><tr><th>Attribute</th><th>Contract</th></tr></thead><tbody><tr data-gallery-attribute="label"><th><code>label</code></th><td>Visible disclosure/tab/workflow label or the default accessible name; a non-empty string.</td></tr><tr data-gallery-attribute="aria-label"><th><code>aria-label</code></th><td>Optional accessible-name override on the native semantic owner. Omit to use label.</td></tr><tr data-gallery-attribute="collapsible"><th><code>collapsible</code></th><td>Absent: passive navigation. Present: native disclosure and hidden/shown content.</td></tr><tr data-gallery-attribute="expanded"><th><code>expanded</code></th><td>Initial navigation disclosure state. Presence means open; native clicks retain local state.</td></tr><tr data-gallery-attribute="class"><th><code>class</code></th><td>Optional consumer styling classes on the host; public internal hooks use part.</td></tr><tr data-gallery-attribute="hidden"><th><code>hidden</code></th><td>Native host visibility; present removes the component from layout and keyboard navigation.</td></tr><tr data-gallery-attribute="dir"><th><code>dir</code></th><td>Native text direction: ltr or rtl, inherited when omitted.</td></tr></tbody></table><p>Tab through the padded navigation links and disclosure. Enter or Space toggles the disclosure; disabled icon links and buttons leave the tab order. Native aria-disabled links remain supported and discoverable. Collapsing retains the authored content.</p><section aria-label="Theme variation matrix"><h2>Five theme modes</h2><div class="cem-theme-light" data-gallery-theme="light"><cem-demo-element id="theme-light" legend="light variation matrix" description="Compare native hover, focus, activation and unavailable states."><template slot="source"><cem-nav label="Workspace navigation" collapsible expanded><cem-icon-button href="#overview" variant="navigation" align="start">Overview</cem-icon-button><cem-icon-button href="#current" variant="navigation" align="start" aria-current="page">Current page</cem-icon-button><cem-icon-button href="#unavailable" variant="navigation" align="start" disabled>Unavailable link</cem-icon-button><cem-icon-button variant="navigation" image="" align="start" disabled>Unavailable action</cem-icon-button></cem-nav><cem-nav label="Workspace navigation" ><cem-icon-button href="#overview" variant="navigation" align="start">Overview</cem-icon-button><cem-icon-button href="#current" variant="navigation" align="start" aria-current="page">Current page</cem-icon-button><cem-icon-button href="#unavailable" variant="navigation" align="start" disabled>Unavailable link</cem-icon-button><cem-icon-button variant="navigation" image="" align="start" disabled>Unavailable action</cem-icon-button></cem-nav></template></cem-demo-element>
