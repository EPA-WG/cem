<cem-gallery-page id="playground-theme" heading="cem-icon: Property playground">
<template>


    <header>
        <p class="component-description">A passive icon with optional adjacent content, supporting Unicode, image URLs,
            Font Awesome, and Material Icons. Use <a href="./cem-icon-button-gallery.html"><code>cem-icon-button</code></a>
            for an interactive icon command or link, and <a href="./cem-action-gallery.html"><code>cem-action</code></a>
            for a general action.</p>
        <p><a href="./cem-icon-gallery.html">Full examples and variation matrix</a> · <a
            href="https://github.com/EPA-WG/cem/blob/develop/packages/cem-components/src/components/cem-icon/cem-icon.stories.ts">Automated
            stories</a></p></header>
    <main>
        <cem-element>
            <template type="text/cem-ml">{slice @name=image | settings}
                {slice @name=imageMode | value}
                {slice @name=label | Settings}
                {slice @name=ariaLabel | Settings}
                {slice @name=size | normal}
                {slice @name=direction | row}
{slice @name=align | center}
                {slice @name=hidden | absent}
                {slice @name=class | consumer-icon}
                {div @class=workspace | {section @aria-label="Icon properties" | {h2 | Properties}
                {cem-field @label="image" @value="{$datadom.slices.image}" @slice=image @slice-event=input
                @slice-value="$target.value"}
                {cem-field @label="label" @value="{$datadom.slices.label}" @slice=label @slice-event=input
                @slice-value="$target.value"}
                {cem-field @label="aria-label" @value="{$datadom.slices.ariaLabel}" @slice=ariaLabel @slice-event=input
                @slice-value="$target.value"}
                {cem-field @label="class" @value="{$datadom.slices.class}" @slice=class @slice-event=input
                @slice-value="$target.value"}
                {fieldset @class=property-group @slice=imageMode @slice-event=change @slice-value="$target.value" |
                {legend | image-mode}{div @class=property-options |
                {cem-radio @name=icon-image-mode @value=value @checked=true | value}
                {cem-radio @name=icon-image-mode @value=empty | empty}
                {cem-radio @name=icon-image-mode @value=absent | absent}
                }}
                {fieldset @class=property-group @slice=size @slice-event=change @slice-value="$target.value" | {legend |
                size}{div @class=property-options |
                {cem-radio @name=icon-size @value=normal @checked=true | normal}
                {cem-radio @name=icon-size @value=small | small}
                {cem-radio @name=icon-size @value=large | large}
                }}
                {fieldset @class=property-group @slice=direction @slice-event=change @slice-value="$target.value" |
                {legend | direction}{div @class=property-options |
                {cem-radio @name=icon-direction @value=row @checked=true | row}
                {cem-radio @name=icon-direction @value=column | column}
                }}
                {fieldset @class=property-group @slice=align @slice-event=change @slice-value="$target.value" | {legend | align}{div @class=property-options |
                {cem-radio @name=icon-align @value=start | start}
                {cem-radio @name=icon-align @value=center @checked=true | center}
                {cem-radio @name=icon-align @value=end | end}
                }}

                {fieldset @class=property-group @slice=hidden @slice-event=change @slice-value="$target.value" | {legend
                | hidden}{div @class=property-options |
                {cem-radio @name=icon-hidden @value=absent @checked=true | absent}
                {cem-radio @name=icon-hidden @value=false | false}
                {cem-radio @name=icon-hidden @value=true | true}
                }}
                }{section @aria-label="Icon preview" | {h2 | Preview}{div @class=preview |
                {cem-icon @id=icon-preview @aria-label="{$datadom.slices.ariaLabel}" @label="{$datadom.slices.label}"
                @size="{$datadom.slices.size}" @direction="{$datadom.slices.direction}" @align="{$datadom.slices.align}" @style="inline-size:100%" @class="{$datadom.slices.class}"
                @hidden={if datadom.slices.hidden == "absent" { null } else { datadom.slices.hidden }} |
                {cem:if @test='datadom.slices.imageMode != "absent"' | {cem:attribute @name=image @value={if
                datadom.slices.imageMode == "empty" { "" } else { datadom.slices.image }}}}
                }
                }}}
            </template>
        </cem-element>
        <p><code>image</code> selects the glyph; an empty value hides it. Without <code>image</code>, the glyph is
            <code>circle</code>. Values shorter than three Unicode code points render as text; otherwise a slash selects
            an image, <code>fa-</code> selects Font Awesome, and other values select Material Icons. Font icons require
            the corresponding stylesheet, loaded by these demos.</p>
        <p><code>label</code> supplies visible fallback text (empty by default). Default-slot payload replaces it,
            preserving markup. Edit <code>label</code> above for live text; the examples below demonstrate
            rich slot content captured when each icon connects. <code>aria-label</code> names the glyph with one image role; otherwise the glyph is
            decorative. Migrate accessibility-only uses of <code>label</code> to <code>aria-label</code>. Default slot
            content remains accessible independently. Icons have no click, hover, focus, selected, or disabled behavior;
            the containing action owns interactive states. Color is inherited. Hidden uses attribute presence.</p>
        <p><a href="./cem-icon-gallery.html#legacy-use-cases">All seven legacy use-case groups</a>: direction, size,
            Unicode/emoji, Material Icons, Font Awesome families, module/external images, and color inheritance.</p>
        <p><code>align="start|center|end"</code> aligns content within available inline space and defaults to <code>center</code>. It works with both row and column layouts; start and end follow the text direction, including RTL. Give the host a width to see the alignment. The container owns sizing and placement.</p>
        <h2>Public attributes and slots</h2>
        <ul>
            <li data-gallery-attribute="image"><code>image</code></li>
            <li data-gallery-attribute="aria-label"><code>aria-label</code></li>
            <li data-gallery-attribute="label"><code>label</code></li>
            <li data-gallery-attribute="size"><code>size</code></li>
            <li data-gallery-attribute="direction"><code>direction</code></li>
            <li data-gallery-attribute="align"><code>align</code></li>
            <li data-gallery-attribute="hidden"><code>hidden</code></li>
            <li data-gallery-attribute="class"><code>class</code></li>
        </ul>
        <p><strong>Slots:</strong> Default slot overrides visible label fallback; direction arranges the icon and
            content in a row or column.</p>
<cem-demo-element type="cem-ml" legend="Content alignment" description="Start, center and end align along the inline axis in row and column layouts. The last two examples use RTL. Full-width hosts make the alignment visible." data-covers="align direction label"><template slot="source">
{div @style="display:grid;gap:var(--cem-gap-related)" |
    {cem-icon @image="★" @direction=row @align=start @label="row: start" @style="inline-size:100%"}
    {cem-icon @image="★" @direction=row @align=center @label="row: center" @style="inline-size:100%"}
    {cem-icon @image="★" @direction=row @align=end @label="row: end" @style="inline-size:100%"}
    {cem-icon @image="★" @direction=column @align=start @label="column: start" @style="inline-size:100%"}
    {cem-icon @image="★" @direction=column @align=center @label="column: center" @style="inline-size:100%"}
    {cem-icon @image="★" @direction=column @align=end @label="column: end" @style="inline-size:100%"}
    {div @dir=rtl @style="display:grid;gap:var(--cem-gap-related)" |
        {cem-icon @image="★" @align=start @label="RTL: start" @style="inline-size:100%"}
        {cem-icon @image="★" @align=end @label="RTL: end" @style="inline-size:100%"}
    }
}
</template></cem-demo-element>
<cem-demo-element legend="Sources, naming, sizes, and content"
                          data-covers="image label aria-label size direction hidden class">
            <template slot="source">
                <cem-icon id="icon-fallback" image="★" label="Favorite"></cem-icon>
                <cem-icon id="icon-override" image="★" label="Fallback"><a href="#details"><strong>Details</strong></a>
                </cem-icon>
                <cem-icon id="icon-label-only" image="" label="Text without glyph"></cem-icon>
                <cem-icon id="icon-default"></cem-icon>
                <cem-icon id="icon-material" image="settings" aria-label="Settings"></cem-icon>
                <cem-icon id="icon-unicode" image="★" aria-label="Favorite" size="small"></cem-icon>
                <cem-icon id="icon-emoji" image="😀" aria-label="Happy" size="large"></cem-icon>
                <cem-icon id="icon-fontawesome" image="fas fa-home" aria-label="Home"></cem-icon>
                <cem-icon id="icon-image"
                          image="data:image/svg+xml,%3Csvg%20xmlns=%22http://www.w3.org/2000/svg%22%20
                          viewBox=%220%200%2024%2024%22%3E%3Cpath%20
                          fill=%22%23007880%22%20d=%22M12%202%2022%2012%2012%2022%202%2012Z%22/%3E%3C/svg%3E"
                          aria-label="Diamond"></cem-icon>
                <cem-icon id="icon-content" image="check" direction="column" class="consumer-icon"><span>Complete</span>
                </cem-icon>
                <cem-icon id="icon-recycling" image="recycling" label="Recycle"></cem-icon>
                <cem-icon id="icon-empty" image=""><span>Content without icon</span></cem-icon>
                <cem-icon id="icon-hidden" image="settings" hidden="false"></cem-icon>
            </template>
        </cem-demo-element>
        <cem-element>
            <template type="text/cem-ml">
                {cem-module-url @slice=sourceUrl @src="@epa-wg/cem-components/components/cem-icon/cem-icon.xhtml"}
                {cem:if @test="datadom.slices.sourceUrl" |
                {p | {a @href="{$datadom.slices.sourceUrl}" | Canonical XHTML}}
                {cem-demo-element @legend="Canonical icon source" @src="{$datadom.slices.sourceUrl}" @type=xml
                @demo=false}
                }
            </template>
        </cem-element>
    </main>

</template>
</cem-gallery-page>
</body>
