<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>cem-element data slices demo</title>
    <link rel="stylesheet" href="./demo.css">
    <script type="module">
        import { installCemElementRuntime } from '../dist/index.js';
        installCemElementRuntime(window);
        window.addEventListener('click', (event) => {
            const trigger = event.target.closest('[data-dispatch-select]');
            if (!trigger) return;
            trigger.dispatchEvent(new CustomEvent('cem-select', { bubbles: true, detail: { id: 'demo' } }));
        });
    </script>
</head>
<body>
<nav class="page-nav"><a href="../index.html">cem-element demo</a><h1>Data slices and events</h1></nav>

<main>
    <html-demo-element legend="A. slice initialization, change on event"
                       description="initial value should be 0; + and - should change the number in input field">
        <template>
            <cem-element tag="cem-slice-field">
                    {attribute @name=label | Query}
                    {slice @name=query}
                    {slice @name=checked | false}
                    {slice @name=selected}
                    {slice @name=clickcount | 0}
                    {slice @name=s1}
                    {slice @name=s2}
                    {section @class=demo-card |
                        {label | {$label} {input @type=text @value="{$query}" @slice=query @slice-event=input @slice-value="{$target.value}"}}
                        {label | {input @type=checkbox @slice=checked @slice-event=change @slice-value="{$target.checked}"} checked}
                        {button @type=button @data-dispatch-select=true @slice=selected @slice-event=cem-select @slice-value="$event.type" | Custom select}
                        {button @type=button @data-role=increment @slice=clickcount @slice-event="click tap" @slice-value="//clickcount + 1" | +}
                        {button @type=button @data-role=decrement @slice=clickcount @slice-event=click @slice-value="//clickcount - 1" | -}
                        {label | Mirror {input @data-role=fanout @value="{$s1}" @slice="s1|s2" @slice-event=input @slice-value="@value"}}
                        {p | query: {output | {$datadom.slices.query}}}
                        {p | checked: {output | {$datadom.slices.checked}}}
                        {p | custom event: {output | {$datadom.slices.selected}}}
                        {p | count: {output @data-role=count | {$datadom.slices.clickcount}}}
                        {p | s1: {output @data-role=s1 | {$datadom.slices.s1}}}
                        {p | s2: {output @data-role=s2 | {$datadom.slices.s2}}}
                    }
            </cem-element>

            <cem-slice-field label="Type and toggle"></cem-slice-field>
            <p class="status-note">Parity target: checkbox/radio coercion and form-data extraction are queued in <code>docs/todo.md</code>.</p>
        </template>
    </html-demo-element>
</main>
<script type="module" src="https://unpkg.com/html-demo-element@1/html-demo-element.js"></script>
</body>
</html>
