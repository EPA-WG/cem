<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>cem-element http-request demo</title>
    <link rel="stylesheet" href="./demo.css">
    <script type="module">
        import { installCemElementRuntime } from '../dist/index.js';
        installCemElementRuntime(window);
    </script>
</head>
<body>
<nav class="page-nav"><a href="../index.html">cem-element demo</a><h1>http-request</h1></nav>

<main>
    <html-demo-element legend="0. url from text to http-request"
                       description="read data from arbitrary URL">
        <template>
            <cem-element tag="cem-resource-panel">
                <template type="text/cem-ml">
                    {http-request @slice=page @url="{$datadom.attributes.url}" @header-accept="application/json" @content-type="application/json"}
                    {http-request @slice=xml @url="{$datadom.attributes.xml-url}" @header-accept="application/xml" @content-type="application/xml"}
                    {article @class=demo-card |
                        {h2 | {$datadom.attributes.title}}
                        {p | Requested URL: {$datadom.attributes.url}}
                        {p | state: {output | {$datadom.slices.page.state}}}
                        {cem:if @test='datadom.slices.page.state == "loaded"' |
                            {ul |
                                {cem:for-each @select="datadom.slices.page.data.results" @as=item |
                                    {li | {$item.name}: {$item.status}}
                                }
                            }
                        }
                        {p | XML URL: {$datadom.attributes.xml-url}}
                        {p | xml state: {output | {$datadom.slices.xml.state}}}
                        {cem:if @test='datadom.slices.xml.state == "loaded"' |
                            {ul @class=xml-results |
                                {cem:for-each @select="datadom.slices.xml.data.children" @as=item |
                                    {li | {$item.attributes.name}: {$item.attributes.status}}
                                }
                            }
                        }
                    }
                </template>
            </cem-element>

            <cem-resource-panel title="HTTP request parity target" url="./http-data.json" xml-url="./http-data.xml"></cem-resource-panel>
        </template>
    </html-demo-element>
</main>
<script type="module" src="https://unpkg.com/html-demo-element@1/html-demo-element.js"></script>
</body>
</html>
