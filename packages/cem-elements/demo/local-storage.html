<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>cem-element local-storage demo</title>
    <link rel="stylesheet" href="./demo.css">
    <script>
        localStorage.setItem('cemDemoDraft', 'stored initial');
        localStorage.setItem('cemDemoCount', '3');
        localStorage.setItem('cemDemoBasket', JSON.stringify({ fruit: 'apple' }));
    </script>
    <script type="module">
        import { installCemElementRuntime } from '../dist/index.js';
        installCemElementRuntime(window);
    </script>
</head>
<body>
<nav class="page-nav"><a href="../index.html">cem-element demo</a><h1>local-storage</h1></nav>

<cem-element tag="cem-local-storage-panel">
    <template type="text/cem-ml">
        {local-storage @key=cemDemoDraft @slice=draft @type=text @live=true}
        {local-storage @key=cemDemoCount @slice=count @type=number @live=true}
        {local-storage @key=cemDemoBasket @slice=basket @type=json @live=true}
        {article @class=demo-card |
            {label | Draft {input @value="{$draft}" @slice=draft @slice-event=input @slice-value="{$target.value}"}}
            {button @type=button @data-storage-write=draft | External write}
            {p | draft: {output @data-role=draft | {$datadom.slices.draft}}}
            {p | number: {output @data-role=count | {$datadom.slices.count}}}
            {p | basket fruit: {output @data-role=basket | {$datadom.slices.basket.fruit}}}
        }
    </template>
</cem-element>

<main><cem-local-storage-panel></cem-local-storage-panel></main>
<script>
    document.addEventListener('click', (event) => {
        if (event.target?.matches?.('[data-storage-write="draft"]')) {
            localStorage.setItem('cemDemoDraft', 'external update');
        }
    });
</script>
</body>
</html>
