<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>cem-element location demo</title>
    <link rel="stylesheet" href="./demo.css">
    <script type="module">
        import { installCemElementRuntime } from '../dist/index.js';
        installCemElementRuntime(window);
    </script>
</head>
<body>
<nav class="page-nav"><a href="../index.html">cem-element demo</a><h1>location-element</h1></nav>

<cem-element tag="cem-location-panel">
    <template type="text/cem-ml">
        {slice @name=hash | #cem-location}
        {article @class=demo-card |
            {label | Hash {input @value="{$hash}" @slice=hash @slice-event=input @slice-value="{$target.value}"}}
            {p | requested hash: {output | {$datadom.slices.hash}}}
            {p @class=status-note | Reading and writing location through a resource slice is the immediate parity target.}
        }
    </template>
</cem-element>

<main><cem-location-panel></cem-location-panel></main>
</body>
</html>
