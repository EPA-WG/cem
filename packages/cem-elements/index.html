<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>cem-element CEM-ML demo</title>
    <link rel="icon" href="../custom-element/demo/wc-square.svg">
    <link rel="stylesheet" href="./demo/demo.css">
    <script type="module">
        import { installCemElementRuntime } from './dist/index.js';

        installCemElementRuntime(window, {
            resolveModuleUrl(specifier, document) {
                if (specifier === '@epa-wg/custom-element/demo/wc-square.svg') {
                    return new URL('../custom-element/demo/wc-square.svg', document.baseURI).href;
                }
                if (specifier === '@epa-wg/material') {
                    return new URL('../custom-element/material/', document.baseURI).href;
                }
                return new URL(specifier, document.baseURI).href;
            },
        });
    </script>
</head>
<body>
<nav class="page-nav">
    <h1><code>cem-element</code> CEM-ML demo</h1>
    <p>Declarative light-DOM custom elements authored with canonical CEM-ML templates.</p>
    <section class="link-grid" aria-label="Feature demos">
        <a href="./demo/attributes.html">attributes</a>
        <a href="./demo/data-slices.html">data slices/events</a>
        <a href="./demo/external-template.html">external template</a>
        <a href="./demo/module-url.html">module-url</a>
        <a href="./demo/scoped-css.html">scoped CSS</a>
        <a href="./demo/for-each.html">for-each</a>
        <a href="./demo/dom-merge.html">DOM merge</a>
        <a href="./demo/form.html">form validation</a>
        <a href="./demo/http-request.html">http-request</a>
        <a href="./demo/local-storage.html">local-storage</a>
        <a href="./demo/location-element.html">location-element</a>
        <a href="./demo/set-url.html">set-url</a>
        <a href="./demo/hex-grid.html">hex grid</a>
        <a href="./demo/npm-versions-demo.html">npm versions</a>
    </section>
</nav>

<html-demo-element legend="1. simple payload"
                   description="payload is ignored as in DCE definition there is no default slot">
    <template>
        <cem-element tag="dce-link" hidden>
                {a @href="#" | link 😃}
        </cem-element>
        <dce-link><i>🍋</i></dce-link>
    </template>
</html-demo-element>

<html-demo-element legend="2. payload with slot definition and slot value"
                   description="slots are filled as in template+shadow root">
    <template>
        <cem-element tag="dce-1-slot" hidden>
                🐇❤️{slot @name=slot1 | 🥦}
        </cem-element>
        <dce-1-slot><i slot="slot1">🥕</i></dce-1-slot>
    </template>
</html-demo-element>

<html-demo-element legend="2a. payload with slot definition and slot value"
                   description="unlike in TEMPLATE, same slot can be used multiple times and within attribute ">
    <template>
        <cem-element tag="dce-2-slots" hidden>
            {slot @name=slot2 | 😃} and again:
            {slot @name=slot2 | 😃}
            {input @placeholder="🐇❤️{$datadom.slots.slot2.children.text}"}
        </cem-element>
        <dce-2-slots><i slot="slot2">🥕</i></dce-2-slots>
        <dce-2-slots></dce-2-slots>
    </template>
</html-demo-element>

<html-demo-element legend="2b. named default slot"
                   description="slot without `name` attribute or with blank value `name=''` use whole payload">
    <template>
        <cem-element tag="dce-3-slot" hidden>
            #1
            {slot @name="" | 😃}
            and
            {slot | 😃}
        </cem-element>
        <dce-3-slot><i slot="">🥕</i></dce-3-slot>
    </template>
</html-demo-element>

<html-demo-element legend="2c. named default slot"
                   description="slot without `name` attribute or with blank value `name=''` use whole payload">
    <template>
        <cem-element tag="dce-4-slot" hidden>
                #2
                {slot @name="" | 😃}
                and
                {slot | 😃}
        </cem-element>
        <dce-4-slot>🥕</dce-4-slot>
    </template>
</html-demo-element>

<html-demo-element legend="2d. default slot"
                   description="slot without `name` attribute use whole payload">
    <template>
        <cem-element tag="greet-element" hidden>
                {slot | Hello} World!
        </cem-element>
        <greet-element></greet-element>
        <greet-element>👋</greet-element>
    </template>
</html-demo-element>

<html-demo-element legend="3. 💪 DCE template "
                   description="Complex case with slots, attributes, dataset, conditional render">
    <template>
        <cem-element tag="pokemon-tile" hidden id="shared-template">
                /* title is an attribute in instance, mapped into datadom.attributes.title */
                {h3 | {$datadom.attributes.title}}

                /* data-smile DCE instance attribute, mapped into datadom.dataset.smile and used in condition */
                {cem:if @test="(datadom.slices.smile ?? datadom.dataset.smile ?? datadom.attributes.smile)" |
                    /* data-smile DCE instance attribute, used as HTML */
                    {div | Smile as: {$(datadom.slices.smile ?? datadom.dataset.smile ?? datadom.attributes.smile)}}
                }
                /* image would not be visible in sandbox, see live demo */
                {img
                    @src="https://unpkg.com/pokeapi-sprites@2.0.2/sprites/pokemon/other/dream-world/{$datadom.attributes.pokemon-id}.svg"
                    @alt="{$datadom.attributes.title} image"}

                /* image-src and title are DCE instance attributes, mapped into datadom.attributes,
                   used within output attribute via curly brackets */
                /* `slot name=xxx` replaced with elements with `slot=xxx` attribute */
                {p | {slot @name=description | {i | description is not available}}}

                /* loop over payload elements with `pokemon-id` attribute, i.e LI elements */
                {cem:for-each @select="datadom.elementsByAttribute.pokemon-id" @as=item |
                    {button |
                        {img
                            @height=32 @src="https://unpkg.com/pokeapi-sprites@2.0.2/sprites/pokemon/other/dream-world/{$item.attributes.pokemon-id}.svg"
                            @alt="{$item.text}"}
                        {br}
                        {$item.text}
                    }
                }
        </cem-element>

        <pokemon-tile title="bulbasaur" data-smile="👼" pokemon-id="1">
            <p slot="description">Bulbasaur is a cute Pokémon born with a large seed firmly affixed to its back;
                the seed grows in size as the Pokémon  does.</p>
            <ul>
                <li pokemon-id="2">ivysaur</li>
                <li pokemon-id="3">venusaur</li>
            </ul>
        </pokemon-tile>

        <pokemon-tile title="ninetales" pokemon-id="38">
            <li pokemon-id="37">vulpix</li>
        </pokemon-tile>
    </template>
</html-demo-element>

<script type="module" src="https://unpkg.com/html-demo-element@1.0/html-demo-element.js"></script>
</body>
</html>
