<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <title>custom-element browser smoke fixture</title>
    </head>
    <body>
        <custom-element tag="fixture-card" hidden>
            <template>
                <h3>{title}</h3>
                <p><slot>empty</slot></p>
            </template>
        </custom-element>

        <fixture-card title="Smoke">
            <span>Payload</span>
        </fixture-card>

        <custom-element tag="explicit-legacy-card" hidden>
            <template lang="custom-element-v0">
                <strong data-role="explicit-legacy">{label}</strong>
            </template>
        </custom-element>

        <explicit-legacy-card label="Explicit legacy"></explicit-legacy-card>

        <custom-element tag="implicit-template-card" hidden>
            <a href="#">Implicit</a>
        </custom-element>

        <implicit-template-card></implicit-template-card>

        <custom-element class="inline-fixture">
            <template>
                <strong>{class}</strong>
            </template>
        </custom-element>

        <template id="inline-src-template">
            <article>
                <h4>External inline source</h4>
                <p><slot>empty</slot></p>
            </article>
        </template>

        <custom-element class="inline-src-fixture" src="#inline-src-template">
            <template>
                <span>Inline src payload</span>
            </template>
        </custom-element>

        <custom-element class="inline-external-document-fixture" src="./external-document.html">
            <span>External document payload</span>
        </custom-element>

        <custom-element class="inline-external-fragment-fixture" src="./external-fragments.html#fragment-card"></custom-element>

        <custom-element
            class="inline-external-xhtml-tree-fixture"
            src="../demo/html-template.xhtml#embedded-xsl"
            title="Anonymous DCE data island"
            data-demo="custom-element"
        >
            <template>
                <catalog data-root="custom-element">
                    <section data-level="1" name="alpha">
                        <item data-level="2" code="a1">
                            <leaf data-level="3">Leaf text from custom-element data island</leaf>
                        </item>
                    </section>
                </catalog>
            </template>
        </custom-element>

        <script type="module">
            import { runCustomElementSmoke } from './browser-smoke.js';

            window.__customElementFixture = await runCustomElementSmoke('..');
        </script>
    </body>
</html>
