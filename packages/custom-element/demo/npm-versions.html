<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>CEM version picker template</title></head><body>
<p><a href="./npm-versions-demo.html">Native CEM version-picker examples</a></p>
    <template id="npm-version" type="text/cem-ml" xpath-functions="./http-data.cemt">
{style |```
    label { display: grid; gap: 0.35rem; }
    select { min-inline-size: 14rem; }
```}
{attribute @name=package}
{attribute @name=initialversion}
{attribute @name=showdate}
{attribute
    @name=value
    @select='if datadom.eventPayloads.selectedVersion
             { datadom.slices.selectedVersion }
             else { "" }'}
{http-request
    @slice=registry
    @url="./npm-versions.json"
    @method=GET
    @header-accept="application/json"
    @content-type="application/json"
}
{label |
    {span | {slot @name=label |
        {code | {$package}} version:
    }}
    {cem:if @test='datadom.slices.registry.state == "loaded"' |
        {select
            @name=version
            @autocomplete=off
            @slice=selectedVersion
            @slice-event=change
            @slice-value="$target.value" |
            {cem:for-each
                @select='native:call("http.versions", datadom.slices.registry.data)'
                @as=version |
                {cem:variable @name=releaseVersion @select='native:call("http.field", version, "version")'}
                {cem:variable @name=releaseDate @select='native:call("http.field", version, "date")'}
                {cem:choose |
                    {cem:when
                        @test='releaseVersion == initialversion' |
                        {option @value="{$releaseVersion}" @selected=true |
                            {$releaseVersion}
                            {cem:if @test='showdate == "true"' |
                                - {$releaseDate}}
                        }
                    }
                    {cem:otherwise |
                        {option @value="{$releaseVersion}" |
                            {$releaseVersion}
                            {cem:if @test='showdate == "true"' |
                                - {$releaseDate}}
                        }
                    }
}   }   }   }
}
    </template>
</body></html>
