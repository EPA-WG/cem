[package]
name = "cem-ml-cli"
version = "0.1.0"
authors = ["Sasha Firsov <sasha@firsov.net>"]
edition = "2021"
description = "CEM parser/runtime CLI"
license = "MIT"
publish = true

[[bin]]
name = "cem-ml"
path = "src/main.rs"

[features]
default = ["debug-control"]
debug-control = [
    "cem-ml/debug-control",
    "cem-ml-transform-cem-ql/debug-control",
]

[dependencies]
clap = { version = "4", features = ["derive"] }
cem-ml = { version = "=0.1.0", path = "../cem_ml", default-features = false }
cem-ml-transform-cem-ql = { version = "=0.1.0", path = "../cem_ml_transform_cem_ql", default-features = false }
ctrlc = { version = "3.5", features = ["termination"] }
quick-xml = "0.41"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls-webpki-roots"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
yaml-rust2 = "0.11"

[dev-dependencies]
cem-ml = { version = "=0.1.0", path = "../cem_ml", default-features = false, features = ["fake-engine"] }
