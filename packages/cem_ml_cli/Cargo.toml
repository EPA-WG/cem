[package]
name = "cem-ml-cli"
version = "0.1.0"
authors = ["Sasha Firsov <sasha@firsov.net>"]
edition = "2021"
description = "CEM parser/runtime CLI"
license = "MIT"
publish = true

[[bin]]
name = "cem-ml"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
cem-ml = { path = "../cem_ml" }
cem-ml-transform-cem-ql = { path = "../cem_ml_transform_cem_ql" }
cem-ql = { path = "../cem_ql" }
serde_json = "1"
yaml-rust2 = "0.11"

[dev-dependencies]
cem-ml = { path = "../cem_ml", features = ["fake-engine"] }
