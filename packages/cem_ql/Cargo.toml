[package]
name = "cem-ql"
version = "0.1.0"
authors = ["Sasha Firsov <sasha@firsov.net>"]
edition = "2021"
description = "CEM query language compiler and evaluator"
license = "MIT"
publish = true

[lib]
name = "cem_ql"
crate-type = ["cdylib", "rlib"]

[features]
default = ["debug-control"]
debug-control = ["cem-ml/debug-control"]

[dependencies]
cem-ml = { version = "=0.1.0", path = "../cem_ml", default-features = false }
rmp-serde = "1.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
