[package]
name = "cem-ql"
version = "0.1.0"
authors = ["Sasha Firsov <sasha@firsov.net>"]
edition = "2021"
description = "CEM query language compiler and evaluator"
license = "MIT"
publish = true

[lib]
name = "cem_ql"
crate-type = ["cdylib", "rlib"]

[features]
default = ["debug-control"]
# Separate compiled-component ABI; never used by the full/default build.
component-runtime = ["cem-ml/component-runtime"]
selected-application-runtime = ["component-runtime", "cem-ml/selected-application-runtime"]
debug-control = ["cem-ml/debug-control"]
# Opt-in source/owner adapters and native-provisioned byte endpoints. No default admission.
query-source-runtime = ["cem-ml/query-source-runtime"]
# Native application verifiers/compiler/receiver adapters, independently opt-in.
application-source-runtime = ["query-source-runtime", "cem-ml/application-source-runtime"]
# Build-time schema/operation validation only.
application-contract-build = ["dep:apollo-compiler"]

[dependencies]
cem-ml = { version = "=0.1.0", path = "../cem_ml", default-features = false }
form_urlencoded = "1.2.2"
url = { package = "cem-url", version = "=0.1.0", path = "../../vendor/url" }
rmp-serde = "1.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
apollo-compiler = { version = "=1.33.0", optional = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
js-sys = "0.3"

[dev-dependencies]
url_unpatched = { package = "url", version = "=2.5.8" }

[[example]]
name = "query_source_probe"
crate-type = ["cdylib"]
required-features = ["query-source-runtime"]

[[example]]
name = "application_source_probe"
crate-type = ["cdylib"]
required-features = ["application-source-runtime"]
