<!DOCTYPE html>
<html lang="en">
<head>
    <meta name="copyright" content="Copyright (c) 2026 Sasha Firsov <https://github.com/sashafirsov>">
    <meta charset="UTF-8">
    <title>CEM timing CSS generator</title>
    <style>
        main { display: block; white-space: pre; font-family: monospace; }
        table { white-space: normal; border-collapse: collapse; }
        td { padding: 0.5rem; letter-spacing: 0.05em; }
        caption { font-size: 1.5rem; padding-bottom: 0.5rem; text-align: start; }
        tr>th:first-child { text-align: start; }
        code { color: green; font-weight: bold; }
    </style>
</head>
<body>
<!--
  Phase 3.6 CEM-ML/CEM-QL generator (Option B). cem-css-generator.js shapes the token tables into
  datadom.slices via the cem-elements DOM→datadom bridge and renders this template through the
  cem_ql WASM boundary; no live browser XSLT. Rows use normalized Markdown heading fields such as
  token/value/description/tier and reduced_motion_value.
-->
<template type="cem-ml; version=0.0"
          id="cem-timing-template"
          data-token-url="../../../dist/lib/tokens/cem-timing.xhtml"
          data-slices="durations=cem-timing-durations easings=cem-timing-easings reduced=cem-timing-reduced-motion">
{module @version="1.0.0" |
{import @as=docs @src="./cem-token-docs.cemt"}
{body |
{call @from=docs @template=preview-token-table
    @with:rows={datadom.slices.durations} @with:id=cem-timing-durations
    @with:href="../../../dist/lib/tokens/cem-timing.xhtml#4-1-duration-tokens-required"
    @with:link_label=cem-timing-durations @with:caption=" — duration scale"
    @with:preview_label=Demo @with:preview_kind=duration}
{hr | }
{call @from=docs @template=preview-token-table
    @with:rows={datadom.slices.easings} @with:id=cem-timing-easings
    @with:href="../../../dist/lib/tokens/cem-timing.xhtml#4-2-easing-tokens-required"
    @with:link_label=cem-timing-easings @with:caption=" — easing curves"
    @with:preview_label=Demo @with:preview_kind=easing}
{hr | }
{table @id=cem-timing-reduced-motion |
    {caption | {a @href="../../../dist/lib/tokens/cem-timing.xhtml#4-4-reduced-motion-overrides" | cem-timing-reduced-motion} — prefers-reduced-motion overrides}
    {thead | {tr | {th | Token}{th | Reduced value}{th | Description}}}
    {tbody | {cem:for-each @select="$datadom.slices.reduced" @as="row" |
        {tr | {th | {code | {$row.token}}}{td | {code | {$row.reduced_motion_value}}}{td | {$row.description}}}}}
}
{hr | }
{pre @class=language-css | {code @class=language-css @data-generated-css |```:root {
  /* region durations: cem-duration-[bucket] */```{call @from=docs @template=css-properties @with:rows={datadom.slices.durations} @with:indent="  "}```
  /* endregion durations */

  /* region easings: cem-easing-[intent] */```{call @from=docs @template=css-properties @with:rows={datadom.slices.easings} @with:indent="  "}```
  /* endregion easings */
}

/* region prefers-reduced-motion: shorten durations, preserve ordering */
@media (prefers-reduced-motion: reduce) {
  :root {```{cem:for-each @select="$datadom.slices.reduced" @as="row" |```
    ```{$row.token}: {$row.reduced_motion_value};}```
  }
}
/* endregion prefers-reduced-motion */
```}}
}
}
</template>
<main></main>
<cem-css-loader></cem-css-loader>
<script src="./cem-css-loader.js" type="module"></script>
<script src="./cem-css-generator.js" type="module"></script>
</body>
</html>
