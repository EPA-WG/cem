<!DOCTYPE html>
<html lang="en">
<head>
    <meta name="copyright" content="Copyright (c) 2026 Sasha Firsov <https://github.com/sashafirsov>">
    <meta charset="UTF-8">
    <title>CEM controls CSS generator</title>
    <style>
        main { display: block; white-space: pre; font-family: monospace; }
        table { white-space: normal; border-collapse: collapse; }
        td { padding: 0.5rem; letter-spacing: 0.05em; }
        caption { font-size: 1.5rem; padding-bottom: 0.5rem; text-align: start; }
        tr>th:first-child { text-align: start; }
        code { color: green; font-weight: bold; }
    </style>
</head>
<body>
<!--
  Phase 3.6 CEM-ML/CEM-QL generator (Option B). The legacy @epa-wg/custom-element XSLT/XPath
  runtime is gone: cem-css-generator.js shapes the token tables into datadom.slices via the
  cem-elements DOM→datadom bridge and renders this template through the cem_ql WASM boundary.
  Token rows use normalized Markdown heading fields: token/value/description/tier for standard
  tables and token/forgiving/compact for mode overrides.
-->
<template type="cem-ml; version=0.0"
          id="cem-controls-template"
          data-token-url="../../../dist/lib/tokens/cem-controls.xhtml"
          data-slices="geometry=cem-controls-geometry progress=cem-progress-geometry slider=cem-slider-geometry overrides=cem-controls-geometry-overrides">
{module @version="1.0.0" |
{import @as=docs @src="./cem-token-docs.cemt"}
{body |
{call @from=docs @template=width-token-table
    @with:rows={datadom.slices.geometry} @with:id=cem-controls-geometry
    @with:href="../../../dist/lib/tokens/cem-controls.xhtml#3-1-baseline-balanced-mode"
    @with:link_label=cem-controls-geometry
    @with:caption=" — visual control geometry (balanced baseline)"}
{hr | }
{call @from=docs @template=width-token-table
    @with:rows={datadom.slices.progress} @with:id=cem-progress-geometry
    @with:href="../../../dist/lib/tokens/cem-controls.xhtml#cem-progress-geometry"
    @with:link_label=cem-progress-geometry
    @with:caption=" — non-interactive progress graphic geometry"}
{hr | }
{call @from=docs @template=width-token-table
    @with:rows={datadom.slices.slider} @with:id=cem-slider-geometry
    @with:href="../../../dist/lib/tokens/cem-controls.xhtml#cem-slider-geometry"
    @with:link_label=cem-slider-geometry
    @with:caption=" — slider visual geometry"}
{hr | }
{table @id=cem-controls-geometry-overrides |
    {caption | {a @href="../../../dist/lib/tokens/cem-controls.xhtml#3-4-coupling-mode-overrides-visual-geometry-only" | cem-controls-geometry-overrides} — coupling mode overrides (visual geometry only)}
    {thead | {tr | {th | Token}{th | forgiving}{th | compact}}}
    {tbody | {cem:for-each @select="$datadom.slices.overrides" @as="row" |
        {tr |
            {th | {code | {$row.token}}}
            {td | {code | {$row.forgiving}}}
            {td | {code | {$row.compact}}}
        }}}
}
{hr | }
{pre @class=language-css | {code @class=language-css @data-generated-css |```:root {
  /* region control geometry — balanced (default) baseline */```{call @from=docs @template=css-properties @with:rows={datadom.slices.geometry} @with:indent="  "}```
  /* endregion control geometry */

  /* region progress graphic geometry */```{call @from=docs @template=css-properties @with:rows={datadom.slices.progress} @with:indent="  "}```
  /* endregion progress graphic geometry */

  /* region slider visual geometry */```{call @from=docs @template=css-properties @with:rows={datadom.slices.slider} @with:indent="  "}```
  /* endregion slider visual geometry */
}

/* region coupling mode: forgiving — larger visual geometry */
:root[data-cem-coupling="forgiving"] {```{cem:for-each @select="$datadom.slices.overrides" @as="row" |```
  ```{$row.token}: {$row.forgiving};}```
}
/* endregion coupling mode: forgiving */

/* region coupling mode: compact — smaller visual geometry */
:root[data-cem-coupling="compact"] {```{cem:for-each @select="$datadom.slices.overrides" @as="row" |```
  ```{$row.token}: {$row.compact};}```
}
/* endregion coupling mode: compact */
```}}
}
}
</template>
<main></main>
<cem-css-loader></cem-css-loader>
<script src="./cem-css-loader.js" type="module"></script>
<script src="./cem-css-generator.js" type="module"></script>
</body>
</html>
