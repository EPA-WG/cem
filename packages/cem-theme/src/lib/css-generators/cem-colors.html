<body>
<!--
  Phase 3.6 CEM-ML/CEM-QL generator (Option B). cem-css-generator.js shapes the token tables into
  datadom.slices via the cem-elements DOM→datadom bridge and renders this template through the
  cem_ql WASM boundary; no live browser XSLT. The full color logic runs in cem-ql:
   - hue-variant: td1=token td4=value.
   - emotion-shift: td1=token td3=Light td4=dark td5=NativeLight td6=NativeDark. The cem-theme
     palette resolves each short name to var(--cem-color-<name>) when that token exists in the
     hue-variant table (cross-table join: datadom.slices.hue.td1 = str:concat(("--cem-color-",name)))
     else var(--cem-palette-<name>); native uses td5/td6 format heuristics.
   - action cross-product: intent (td1=intent td2=emotion) × state (td1=state td2=bg td3=text);
     the [emotion] placeholder is filled with str:replace.
   - zebra-mode-mapping: td1=mode td3=focus td4=target td5=selected; var()-wrapped when the value
     starts with `--`, else used raw (system colors).
  @test uses bare cem-ql names + double-quoted string literals (so attributes are single-quoted).
-->
<template type="cem-ml; version=0.0"
          id="cem-colors-template"
          data-token-url="../../../dist/lib/tokens/cem-colors.xhtml"
          data-slices="hue=cem-color-hue-variant native=cem-color-native shift=cem-palette-emotion-shift mode=cem-theme-mode intent=cem-action-intent-emotion state=cem-action-state-color input=cem-input-indicator-colors select=cem-select-state-colors navigation=cem-navigation-item-state-colors content=cem-content-interaction-state-colors separator=cem-separator-colors progress=cem-progress-indicator-colors workflow=cem-workflow-step-colors slider=cem-slider-colors zebra=cem-zebra-tokens zmap=cem-zebra-mode-mapping">
{table @id=cem-color-hue-variant @data-selected-token="" |
    {caption | {a @href="../../../dist/lib/tokens/cem-colors.xhtml#cem-color-hue-variant" | cem-color-hue-variant} Branded colors}
    {thead | {tr | {th | Token}{th | Hue}{th | Swatch}{th | Label}{th | Value}}}
    {tbody | {cem:for-each @select="$datadom.slices.hue" @as="row" |
        {tr |
            {th | {$row.td1}}
            {td | {$row.td2}}
            {td
                @style='{str:concat(("background-color: var(", row.td1, "); min-width: 3rem;"))}'
                @title='{str:concat((row.td1, " \n ", row.td6))}'
                @data-cem-value='{str:concat((row.td1, ": ", row.td4))}' | }
            {td | {$row.td5}}
            {td | {code | {$row.td4}}}
        }}
    }
}
{table @id=cem-color-native-table @data-selected-token="" |
    {caption | {a @href="../../../dist/lib/tokens/cem-colors.xhtml#cem-color-native" | cem-color-native} Native browser colors}
    {thead | {tr | {th | Color}{th | Light}{th | Dark}{th | Description}}}
    {tbody | {cem:for-each @select="$datadom.slices.native" @as="row" |
        {tr |
            {th | {code | {$row.td1}}}
            {td
                @style='{str:concat(("background-color: ", row.td1, "; color: ", row.td2, "; color-scheme: light; min-width: 6rem;"))}'
                @title="{$row.td1}"
                @data-cem-value="{$row.td1}" | {$row.td1}}
            {td
                @style='{str:concat(("background-color: ", row.td1, "; color: ", row.td2, "; color-scheme: dark; min-width: 6rem;"))}'
                @title="{$row.td1}"
                @data-cem-value="{$row.td1}" | {$row.td1}}
            {td | {$row.td3}}
        }}
    }
}
{hr | }
{table @id=cem-palette-emotion-shift @data-selected-token="" |
    {caption | {a @href="../../../dist/lib/tokens/cem-colors.xhtml#cem-palette-emotion-shift" | cem-palette-emotion-shift} Emotional palette}
    {thead | {tr | {th | emotion token}{th | light}{th | dark}{th | native light}{th | native dark}}}
    {tbody | {cem:for-each @select="$datadom.slices.shift" @as="row" |
        {cem:if @test='!str:contains(row.td1, "-text") && !str:contains(row.td1, "-x")' |
            {tr |
                {th | {$row.td1}}
                {td
                    @style='{str:concat(("background-color: var(", row.td1, "); color: var(", row.td1, "-text); color-scheme: light"))}'
                    @title='{str:concat((row.td1, " \n background-color: var(", row.td1, "); color: var(", row.td1, "-text); color-scheme: light"))}' | light ⬤ {$row.td8}}
                {td
                    @style='{str:concat(("background-color: var(", row.td1, "); color: var(", row.td1, "-text); color-scheme: dark"))}'
                    @title='{str:concat((row.td1, " \n background-color: var(", row.td1, "); color: var(", row.td1, "-text); color-scheme: dark"))}' | dark ⬤ {$row.td8}}
                {td @class=cem-theme-native
                    @style='{str:concat(("background-color: var(", row.td1, "); color: var(", row.td1, "-text); color-scheme: light"))}'
                    @title='{str:concat((row.td1, " \n background-color: var(", row.td1, "); color: var(", row.td1, "-text); color-scheme: light"))}'
                    @data-selected-token='{str:concat((".cem-theme-native,[data-theme=\"cem-theme-native\"]", "{}"))}' | native light ⬤ {$row.td8}}
                {td @class=cem-theme-native
                    @style='{str:concat(("background-color: var(", row.td1, "); color: var(", row.td1, "-text); color-scheme: dark"))}'
                    @title='{str:concat((row.td1, " \n background-color: var(", row.td1, "); color: var(", row.td1, "-text); color-scheme: dark"))}'
                    @data-selected-token='{str:concat((".cem-theme-native,[data-theme=\"cem-theme-native\"]", "{}"))}' | native dark ⬤ {$row.td8}}
            }
            {tr |
                {th | {$row.td1}-x}
                {td
                    @style='{str:concat(("background-color: var(", row.td1, "-x); color: var(", row.td1, "-text-x); color-scheme: light"))}'
                    @title='{str:concat((row.td1, "-x \n background-color: var(", row.td1, "-x); color: var(", row.td1, "-text-x); color-scheme: light"))}' | light ⬤ {$row.td8}-x}
                {td
                    @style='{str:concat(("background-color: var(", row.td1, "-x); color: var(", row.td1, "-text-x); color-scheme: dark"))}'
                    @title='{str:concat((row.td1, "-x \n background-color: var(", row.td1, "-x); color: var(", row.td1, "-text-x); color-scheme: dark"))}' | dark ⬤ {$row.td8}-x}
                {td @class=cem-theme-native
                    @style='{str:concat(("background-color: var(", row.td1, "-x); color: var(", row.td1, "-text-x); color-scheme: light"))}'
                    @title='{str:concat((row.td1, "-x \n background-color: var(", row.td1, "-x); color: var(", row.td1, "-text-x); color-scheme: light"))}' | native light ⬤ {$row.td8}-x}
                {td @class=cem-theme-native
                    @style='{str:concat(("background-color: var(", row.td1, "-x); color: var(", row.td1, "-text-x); color-scheme: dark"))}'
                    @title='{str:concat((row.td1, "-x \n background-color: var(", row.td1, "-x); color: var(", row.td1, "-text-x); color-scheme: dark"))}' | native dark ⬤ {$row.td8}-x}
            }
        }
    }}
}
{hr | }
{h1 | Action colors {a @href="../../../dist/lib/tokens/cem-colors.xhtml#cem-action-state-color" | cem-action-state-color} intent × state}
{section |
    {cem:for-each @select="$datadom.slices.mode" @as="mode" |
        {section @class="cem-theme-{$mode.td1}" |
            {table @id=cem-action-state-color
                @data-selected-token='{str:concat(("[data-theme*=\"cem-theme-\"], .cem-theme-native, .cem-theme-contrast-light, .cem-theme-contrast-dark, .cem-theme-light, .cem-theme-dark ", "{}"))}' |
                {caption | {b @title="{$mode.td3}" | {$mode.td1}} {sub | {$mode.td3}}}
                {thead | {tr |
                    {th | {sub | State} \ {sup | intent:}}
                    {cem:for-each @select="$datadom.slices.intent" @as="intent" | {th | {$intent.td1}}}
                }}
                {tbody | {cem:for-each @select="$datadom.slices.state" @as="state" |
                    {tr |
                        {th | {$state.td1}}
                        {cem:for-each @select="$datadom.slices.intent" @as="intent" |
                            {td
                                @style='{str:concat(("background-color: var(--cem-action-", intent.td1, "-", state.td1, "-background); color: var(--cem-action-", intent.td1, "-", state.td1, "-text); min-width: 4rem;"))}'
                                @title='{str:concat(("--cem-action-", intent.td1, "-", state.td1, "-background \n --cem-action-", intent.td1, "-", state.td1, "-text"))}'
                                @data-cem-value='{str:concat(("--cem-action-", intent.td1, "-", state.td1, "-background: ", str:replace(state.td2, "[emotion]", intent.td2), "; --cem-action-", intent.td1, "-", state.td1, "-text: ", str:replace(state.td3, "[emotion]", intent.td2)))}' | Aa}
                        }
                    }
                }}
            }
        }
    }
}
{hr | }
{h1 | Zebra tokens {a @href="../../../dist/lib/tokens/cem-colors.xhtml#cem-zebra-mode-mapping" | §8 zebra outline colors}}
{section |

        {cem:for-each @select="$datadom.slices.zmap" @as="z" |
            {cem:if @test='z.td1 == mode.td1' |
                {section @class="cem-theme-{$mode.td1}" |
                    {table
                        @data-selected-token='{if mode.td1 == "native" { str:concat((".cem-theme-native,[data-theme=\"cem-theme-native\"]", "{}")) } else { if mode.td1 == "light" { str:concat((".cem-theme-light, [data-theme=\"cem-theme-light\"], .cem-theme-contrast-light, [data-theme=\"cem-theme-contrast-light\"]", "{}")) } else { if mode.td1 == "dark" { str:concat((".cem-theme-dark, [data-theme=\"cem-theme-dark\"], .cem-theme-contrast-dark, [data-theme=\"cem-theme-contrast-dark\"]", "{}")) } else { "" } } }}'
                        @style="background-color: var(--cem-palette-comfort); color: var(--cem-palette-comfort-text)" |
                        {caption | {b @title="{$mode.td3}" | {$mode.td1}} {sub | {$mode.td3}}}
                        {thead | {tr | {th | State}{th | color-0}{th | color-1}{th | color-2}{th | color-3}{th | Ring}}}
                        {tbody |
                            {tr |
                                {th | none}
                                {td @style="background-color:var(--cem-zebra-color-0);min-width:2rem" @title=--cem-zebra-color-0 @data-cem-value='{str:concat(("--cem-zebra-color-0: ", if str:starts_with(z.td2, "--") { str:concat(("var(", z.td2, ")")) } else { z.td2 }))}' | }
                                {td @style="background-color:var(--cem-zebra-color-1);min-width:2rem" @title=--cem-zebra-color-1 @data-cem-value='{str:concat(("--cem-zebra-color-1: ", if str:starts_with(z.td2, "--") { str:concat(("var(", z.td2, ")")) } else { z.td2 }))}' | }
                                {td @style="background-color:var(--cem-zebra-color-2);min-width:2rem" @title=--cem-zebra-color-2 @data-cem-value='{str:concat(("--cem-zebra-color-2: ", if str:starts_with(z.td2, "--") { str:concat(("var(", z.td2, ")")) } else { z.td2 }))}' | }
                                {td @style="background-color:var(--cem-zebra-color-3);min-width:2rem" @title=--cem-zebra-color-3 @data-cem-value='{str:concat(("--cem-zebra-color-3: ", if str:starts_with(z.td2, "--") { str:concat(("var(", z.td2, ")")) } else { z.td2 }))}' | }
                                {td @style="background-color:var(--cem-palette-comfort)" | {div @style="width:2rem; height:2rem; margin:0.5rem auto; background-color:var(--cem-action-explicit-default-background); box-shadow:0 0 0 calc(1*var(--cem-zebra-strip-size)) var(--cem-zebra-color-0),0 0 0 calc(2*var(--cem-zebra-strip-size)) var(--cem-zebra-color-1),0 0 0 calc(3*var(--cem-zebra-strip-size)) var(--cem-zebra-color-2),0 0 0 calc(4*var(--cem-zebra-strip-size)) var(--cem-zebra-color-3);" | }}
                            }
                            {tr @data-selected-token='{str:concat((if mode.td1 == "native" { ".cem-theme-native,[data-theme=\"cem-theme-native\"]" } else { if mode.td1 == "light" { ".cem-theme-light, [data-theme=\"cem-theme-light\"], .cem-theme-contrast-light, [data-theme=\"cem-theme-contrast-light\"]" } else { if mode.td1 == "dark" { ".cem-theme-dark, [data-theme=\"cem-theme-dark\"], .cem-theme-contrast-dark, [data-theme=\"cem-theme-contrast-dark\"]" } else { "" } } }, "[focus],*:focus, *:focus-visible, *:focus-within, .focus", "{}"))}' |
                                {th | focus}
                                {td @class=focus @style="background-color:var(--cem-zebra-color-0);min-width:2rem" @title=--cem-zebra-color-0 @data-cem-value='{str:concat(("--cem-zebra-color-0: ", if str:starts_with(z.td2, "--") { str:concat(("var(", z.td2, ")")) } else { z.td2 }))}' | }
                                {td @class=focus @style="background-color:var(--cem-zebra-color-1);min-width:2rem" @title="--cem-zebra-color-1 (focus)" @data-cem-value='{str:concat(("--cem-zebra-color-1: ", if str:starts_with(z.td3, "--") { str:concat(("var(", z.td3, ")")) } else { z.td3 }))}' | }

                                {td @class=focus @style="background-color:var(--cem-zebra-color-3);min-width:2rem" @title=--cem-zebra-color-3 @data-cem-value='{str:concat(("--cem-zebra-color-3: ", if str:starts_with(z.td2, "--") { str:concat(("var(", z.td2, ")")) } else { z.td2 }))}' | }
                                {td @class=focus @style="background-color:var(--cem-palette-comfort)" | {div @style="width:2rem; height:2rem; margin:0.5rem auto; background-color:var(--cem-action-explicit-default-background); box-shadow:0 0 0 calc(1*var(--cem-zebra-strip-size)) var(--cem-zebra-color-0),0 0 0 calc(2*var(--cem-zebra-strip-size)) var(--cem-zebra-color-1),0 0 0 calc(3*var(--cem-zebra-strip-size)) var(--cem-zebra-color-2),0 0 0 calc(4*var(--cem-zebra-strip-size)) var(--cem-zebra-color-3);" | }}
                            }
                            {tr @data-selected-token='{str:concat((if mode.td1 == "native" { ".cem-theme-native,[data-theme=\"cem-theme-native\"]" } else { if mode.td1 == "light" { ".cem-theme-light, [data-theme=\"cem-theme-light\"], .cem-theme-contrast-light, [data-theme=\"cem-theme-contrast-light\"]" } else { if mode.td1 == "dark" { ".cem-theme-dark, [data-theme=\"cem-theme-dark\"], .cem-theme-contrast-dark, [data-theme=\"cem-theme-contrast-dark\"]" } else { "" } } }, "[selected],.selected", "{}"))}' |
                                {th | selected}
                                {td @class=selected @style="background-color:var(--cem-zebra-color-0);min-width:2rem" @title=--cem-zebra-color-0 @data-cem-value='{str:concat(("--cem-zebra-color-0: ", if str:starts_with(z.td2, "--") { str:concat(("var(", z.td2, ")")) } else { z.td2 }))}' | }

                            }
                            {tr @data-selected-token='{str:concat((if mode.td1 == "native" { ".cem-theme-native,[data-theme=\"cem-theme-native\"]" } else { if mode.td1 == "light" { ".cem-theme-light, [data-theme=\"cem-theme-light\"], .cem-theme-contrast-light, [data-theme=\"cem-theme-contrast-light\"]" } else { if mode.td1 == "dark" { ".cem-theme-dark, [data-theme=\"cem-theme-dark\"], .cem-theme-contrast-dark, [data-theme=\"cem-theme-contrast-dark\"]" } else { "" } } }, "[target], *:target, .target", "{}"))}' |
                                {th | target}
                                {td @class=target @style="background-color:var(--cem-zebra-color-0);min-width:2rem" @title=--cem-zebra-color-0 @data-cem-value='{str:concat(("--cem-zebra-color-0: ", if str:starts_with(z.td2, "--") { str:concat(("var(", z.td2, ")")) } else { z.td2 }))}' | }
