<!--
  Phase 3.6 CEM-ML/CEM-QL generator (Option B). cem-css-generator.js shapes the token tables into
  datadom.slices via the cem-elements DOM→datadom bridge and renders this template through the
  cem_ql WASM boundary; no live browser XSLT. The full color logic runs in cem-ql:
   - hue-variant uses token and value.
   - emotion-shift uses token, light, dark, nativelight, and nativedark. The cem-theme
     palette resolves each short name to var(--cem-color-<name>) when that token exists in the
     hue-variant table (cross-table join: datadom.slices.hue.token = str:concat(("--cem-color-",name)))
     else var(--cem-palette-<name>); native uses the named native-mode fields and format heuristics.
   - action cross-product: action_intent/emotional_palette × state/background_formula_palette_level/text_token;
     the [emotion] placeholder is filled with str:replace.
   - zebra-mode-mapping uses theme_mode and the named zebra state fields; var()-wrapped when a value
     starts with `--`, else used raw (system colors).
  @test uses bare cem-ql names + double-quoted string literals (so attributes are single-quoted).
-->
<template type="cem-ml; version=0.0"
          id="cem-colors-template"
          data-token-url="../../../dist/lib/tokens/cem-colors.xhtml"
          data-slices="hue=cem-color-hue-variant native=cem-color-native shift=cem-palette-emotion-shift mode=cem-theme-mode intent=cem-action-intent-emotion state=cem-action-state-color input=cem-input-indicator-colors select=cem-select-state-colors navigation=cem-navigation-item-state-colors content=cem-content-interaction-state-colors separator=cem-separator-colors progress=cem-progress-indicator-colors workflow=cem-workflow-step-colors slider=cem-slider-colors zebra=cem-zebra-tokens zmap=cem-zebra-mode-mapping">
{table @id=cem-color-hue-variant @data-selected-token="" |
    {caption | {a @href="../../../dist/lib/tokens/cem-colors.xhtml#cem-color-hue-variant" | cem-color-hue-variant} Branded colors}
    {thead | {tr | {th | Token}{th | Hue}{th | Swatch}{th | Label}{th | Value}}}
    {tbody | {cem:for-each @select="$datadom.slices.hue" @as="row" |
        {tr |
            {th | {$row.token}}
            {td | {$row.hue}}
            {td
                @style="background-color: var({$row.token}); min-width: 3rem;"
                @title='{str:concat((row.token, " \n ", row.intended_use))}'
                @data-cem-value='{str:concat((row.token, ": ", row.value))}' | }
            {td | {$row.label}}
            {td | {code | {$row.value}}}
        }}
    }
}
{table @id=cem-color-native-table @data-selected-token="" |
    {caption | {a @href="../../../dist/lib/tokens/cem-colors.xhtml#cem-color-native" | cem-color-native} Native browser colors}
    {thead | {tr | {th | Color}{th | Light}{th | Dark}{th | Description}}}
    {tbody | {cem:for-each @select="$datadom.slices.native" @as="row" |
        {tr |
            {th | {code | {$row.color}}}
            {td
                @style="background-color: {$row.color}; color: {$row.text_pair}; color-scheme: light; min-width: 6rem;"
                @title="{$row.color}"
                @data-cem-value="{$row.color}" | {$row.color}}
            {td
                @style="background-color: {$row.color}; color: {$row.text_pair}; color-scheme: dark; min-width: 6rem;"
                @title="{$row.color}"
                @data-cem-value="{$row.color}" | {$row.color}}
            {td | {$row.description}}
        }}
    }
}
{hr | }
{table @id=cem-palette-emotion-shift @data-selected-token="" |
    {caption | {a @href="../../../dist/lib/tokens/cem-colors.xhtml#cem-palette-emotion-shift" | cem-palette-emotion-shift} Emotional palette}
    {thead | {tr | {th | emotion token}{th | light}{th | dark}{th | native light}{th | native dark}}}
    {tbody | {cem:for-each @select="$datadom.slices.shift" @as="row" |
        {cem:if @test='!str:contains(row.token, "-text") && !str:contains(row.token, "-x")' |
            {tr |
                {th | {$row.token}}
                {td
                    @style='{str:concat(("background-color: var(", row.token, "); color: var(", row.token, "-text); color-scheme: light"))}'
                    @title='{str:concat((row.token, " \n background-color: var(", row.token, "); color: var(", row.token, "-text); color-scheme: light"))}' | light ⬤ {$row.emotion}}
                {td
                    @style='{str:concat(("background-color: var(", row.token, "); color: var(", row.token, "-text); color-scheme: dark"))}'
                    @title='{str:concat((row.token, " \n background-color: var(", row.token, "); color: var(", row.token, "-text); color-scheme: dark"))}' | dark ⬤ {$row.emotion}}
                {td @class=cem-theme-native
                    @style='{str:concat(("background-color: var(", row.token, "); color: var(", row.token, "-text); color-scheme: light"))}'
                    @title='{str:concat((row.token, " \n background-color: var(", row.token, "); color: var(", row.token, "-text); color-scheme: light"))}'
                    @data-selected-token='{str:concat((".cem-theme-native,[data-theme=\"cem-theme-native\"]", "{}"))}' | native light ⬤ {$row.emotion}}
                {td @class=cem-theme-native
                    @style='{str:concat(("background-color: var(", row.token, "); color: var(", row.token, "-text); color-scheme: dark"))}'
                    @title='{str:concat((row.token, " \n background-color: var(", row.token, "); color: var(", row.token, "-text); color-scheme: dark"))}'
                    @data-selected-token='{str:concat((".cem-theme-native,[data-theme=\"cem-theme-native\"]", "{}"))}' | native dark ⬤ {$row.emotion}}
            }
            {tr |
                {th | {$row.token}-x}
                {td
                    @style='{str:concat(("background-color: var(", row.token, "-x); color: var(", row.token, "-text-x); color-scheme: light"))}'
                    @title='{str:concat((row.token, "-x \n background-color: var(", row.token, "-x); color: var(", row.token, "-text-x); color-scheme: light"))}' | light ⬤ {$row.emotion}-x}
                {td
                    @style='{str:concat(("background-color: var(", row.token, "-x); color: var(", row.token, "-text-x); color-scheme: dark"))}'
                    @title='{str:concat((row.token, "-x \n background-color: var(", row.token, "-x); color: var(", row.token, "-text-x); color-scheme: dark"))}' | dark ⬤ {$row.emotion}-x}
                {td @class=cem-theme-native
                    @style='{str:concat(("background-color: var(", row.token, "-x); color: var(", row.token, "-text-x); color-scheme: light"))}'
                    @title='{str:concat((row.token, "-x \n background-color: var(", row.token, "-x); color: var(", row.token, "-text-x); color-scheme: light"))}' | native light ⬤ {$row.emotion}-x}
                {td @class=cem-theme-native
                    @style='{str:concat(("background-color: var(", row.token, "-x); color: var(", row.token, "-text-x); color-scheme: dark"))}'
                    @title='{str:concat((row.token, "-x \n background-color: var(", row.token, "-x); color: var(", row.token, "-text-x); color-scheme: dark"))}' | native dark ⬤ {$row.emotion}-x}
            }
        }
    }}
}
{hr | }
{h1 | Action colors {a @href="../../../dist/lib/tokens/cem-colors.xhtml#cem-action-state-color" | cem-action-state-color} intent × state}
{section |
    {cem:for-each @select="$datadom.slices.mode" @as="mode" |
        {section @class="cem-theme-{$mode.mode}" |
            {table @id=cem-action-state-color
                @data-selected-token='{str:concat(("[data-theme*=\"cem-theme-\"], .cem-theme-native, .cem-theme-contrast-light, .cem-theme-contrast-dark, .cem-theme-light, .cem-theme-dark ", "{}"))}' |
                {caption | {b @title="{$mode.description}" | {$mode.mode}} {sub | {$mode.description}}}
                {thead | {tr |
                    {th | {sub | State} \ {sup | intent:}}
                    {cem:for-each @select="$datadom.slices.intent" @as="intent" | {th | {$intent.action_intent}}}
                }}
                {tbody | {cem:for-each @select="$datadom.slices.state" @as="state" |
                    {tr |
                        {th | {$state.state}}
                        {cem:for-each @select="$datadom.slices.intent" @as="intent" |
                            {td
                                @style='{str:concat(("background-color: var(--cem-action-", intent.action_intent, "-", state.state, "-background); color: var(--cem-action-", intent.action_intent, "-", state.state, "-text); min-width: 4rem;"))}'
                                @title='{str:concat(("--cem-action-", intent.action_intent, "-", state.state, "-background \n --cem-action-", intent.action_intent, "-", state.state, "-text"))}'
                                @data-cem-value='{str:concat(("--cem-action-", intent.action_intent, "-", state.state, "-background: ", str:replace(state.background_formula_palette_level, "[emotion]", intent.emotional_palette), "; --cem-action-", intent.action_intent, "-", state.state, "-text: ", str:replace(state.text_token, "[emotion]", intent.emotional_palette)))}' | Aa}
                        }
                    }
                }}
            }
        }
    }
}
{hr | }
