<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1060" viewBox="0 0 1440 1060" role="img" aria-labelledby="title description">
  <title id="title">CEM projector proposed palette</title>
  <desc id="description">A white canvas with black primary text, neutral supporting colors and five dark semantic accents. A sample three-step diagram uses labels and distinct shapes in addition to color. Contrast figures are digital sRGB calculations, not projector measurements.</desc>
  <rect width="1440" height="1060" fill="#FFFFFF"/>
  <g font-family="Arial, Helvetica, sans-serif">
    <text x="64" y="64" font-size="20" font-weight="bold" fill="#6A1B9A">CEM  /  PROPOSED PRESENTATION PROFILE</text>
    <text x="64" y="126" font-size="48" font-weight="bold" fill="#000000">projector</text>
    <text x="64" y="166" font-size="24" fill="#333333">Classic CEM light. White canvas, black primary text and retained semantic fills.</text>

    <text x="64" y="230" font-size="25" font-weight="bold" fill="#000000">Neutral foundation</text>
    <g font-size="20" fill="#000000">
      <rect x="64" y="252" width="242" height="72" fill="#FFFFFF" stroke="#595959" stroke-width="2"/>
      <text x="80" y="298" font-size="27">Aa</text>
      <text x="64" y="354" font-weight="bold">Canvas  #FFFFFF</text>
      <text x="64" y="384" fill="#333333">Default slide surface</text>

      <rect x="326" y="252" width="242" height="72" fill="#000000"/>
      <text x="342" y="298" font-size="27" fill="#FFFFFF">Aa</text>
      <text x="326" y="354" font-weight="bold">Ink  #000000</text>
      <text x="326" y="384" fill="#333333">21.00:1 on white</text>

      <rect x="588" y="252" width="242" height="72" fill="#333333"/>
      <text x="604" y="298" font-size="27" fill="#FFFFFF">Aa</text>
      <text x="588" y="354" font-weight="bold">Support  #333333</text>
      <text x="588" y="384" fill="#333333">12.63:1 on white</text>

      <rect x="850" y="252" width="242" height="72" fill="#F2F2F2" stroke="#595959" stroke-width="2"/>
      <text x="866" y="298" font-size="27">Aa</text>
      <text x="850" y="354" font-weight="bold">Panel  #F2F2F2</text>
      <text x="850" y="384" fill="#333333">Use an edge for grouping</text>

      <rect x="1112" y="252" width="264" height="72" fill="#595959"/>
      <text x="1128" y="298" font-size="22" fill="#FFFFFF">Edges and connectors</text>
      <text x="1112" y="354" font-weight="bold">Stroke  #595959</text>
      <text x="1112" y="384" fill="#333333">7.00:1 on white</text>
    </g>

    <text x="64" y="454" font-size="25" font-weight="bold" fill="#000000">Dark semantic accents</text>
    <text x="64" y="486" font-size="20" fill="#333333">All pass 7:1 on white and on the neutral panel. They are not pairwise chart colors.</text>
    <g font-size="20" fill="#000000">
      <rect x="64" y="508" width="242" height="68" fill="#6A1B9A"/>
      <text x="80" y="551" font-size="25" font-weight="bold" fill="#FFFFFF">Creativity</text>
      <text x="64" y="607" font-weight="bold">#6A1B9A</text>
      <text x="64" y="637" fill="#333333">9.39:1 on white</text>

      <rect x="326" y="508" width="242" height="68" fill="#002F65"/>
      <text x="342" y="551" font-size="25" font-weight="bold" fill="#FFFFFF">Trust</text>
      <text x="326" y="607" font-weight="bold">#002F65</text>
      <text x="326" y="637" fill="#333333">13.17:1 on white</text>

      <rect x="588" y="508" width="242" height="68" fill="#005A5A"/>
      <text x="604" y="551" font-size="25" font-weight="bold" fill="#FFFFFF">Calm</text>
      <text x="588" y="607" font-weight="bold">#005A5A</text>
      <text x="588" y="637" fill="#333333">8.05:1 on white</text>

      <rect x="850" y="508" width="242" height="68" fill="#723600"/>
      <text x="866" y="551" font-size="25" font-weight="bold" fill="#FFFFFF">Enthusiasm</text>
      <text x="850" y="607" font-weight="bold">#723600</text>
      <text x="850" y="637" fill="#333333">9.36:1 on white</text>

      <rect x="1112" y="508" width="264" height="68" fill="#9B1C1C"/>
      <text x="1128" y="551" font-size="25" font-weight="bold" fill="#FFFFFF">Danger</text>
      <text x="1112" y="607" font-weight="bold">#9B1C1C</text>
      <text x="1112" y="637" fill="#333333">8.15:1 on white</text>
    </g>

    <path d="M64 679H1376" stroke="#595959" stroke-width="2"/>
    <text x="64" y="734" font-size="32" font-weight="bold" fill="#000000">From source to visible result</text>
    <text x="64" y="770" font-size="22" fill="#333333">Example: filled semantic backgrounds, white labels and explicit step numbers on a white canvas.</text>

    <rect x="64" y="802" width="350" height="120" rx="6" fill="#6A1B9A" stroke="#6A1B9A" stroke-width="4"/>
    <text x="88" y="842" font-size="20" font-weight="bold" fill="#FFFFFF">1  AUTHOR</text>
    <text x="88" y="886" font-size="32" font-weight="bold" fill="#FFFFFF">CEM source</text>

    <path d="M430 862H491" fill="none" stroke="#595959" stroke-width="4"/>
    <path d="M479 852L493 862L479 872" fill="none" stroke="#595959" stroke-width="4"/>

    <rect x="512" y="802" width="350" height="120" fill="#002F65" stroke="#002F65" stroke-width="4"/>
    <text x="536" y="842" font-size="20" font-weight="bold" fill="#FFFFFF">2  TRANSFORM</text>
    <text x="536" y="886" font-size="32" font-weight="bold" fill="#FFFFFF">Shared runtime</text>

    <path d="M878 862H939" fill="none" stroke="#595959" stroke-width="4"/>
    <path d="M927 852L941 862L927 872" fill="none" stroke="#595959" stroke-width="4"/>

    <path d="M989 802H1337L1376 862L1337 922H989L950 862Z" fill="#005A5A" stroke="#005A5A" stroke-width="4"/>
    <text x="1013" y="842" font-size="20" font-weight="bold" fill="#FFFFFF">3  INSPECT</text>
    <text x="1013" y="886" font-size="32" font-weight="bold" fill="#FFFFFF">Visible result</text>

    <text x="64" y="979" font-size="21" fill="#000000">Essential text target: at least 7:1. Required graphics: at least 3:1 against adjacent colors.</text>
    <text x="64" y="1017" font-size="20" fill="#333333">Calculated digital contrast does not predict room contrast. Verify the actual projector from the back of the room.</text>
  </g>
</svg>
